<!doctype html>
<html lang="ja" data-style="top-down-hand-drawn-game-v9" data-bearing="0">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#3f704d">
  <title>真上視点の手描きゲーム地図 — PixelMap test</title>
  <style>
    :root {
      color-scheme: light;
      font-family: ui-rounded, "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
      background: #3f704d;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #3f704d;
    }

    body { position: fixed; inset: 0; }

    [data-top-down-map] {
      display: block;
      width: 100vw;
      height: 100dvh;
      cursor: grab;
      touch-action: none;
      transform-origin: 0 0;
      background: #91bb70;
    }

    [data-top-down-map].is-dragging { cursor: grabbing; }

    [data-current-location] {
      position: fixed;
      right: calc(14px + env(safe-area-inset-right, 0px));
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      z-index: 3;
      display: grid;
      place-items: center;
      min-width: 48px;
      min-height: 48px;
      padding: 0;
      border: 3px solid #263a35;
      border-radius: 50%;
      color: #263a35;
      background: #ffef78;
      box-shadow: 3px 4px 0 rgb(38 58 53 / 42%);
      font: 800 25px/1 monospace;
      cursor: pointer;
    }

    [data-current-location]:disabled { opacity: .55; cursor: wait; }

    [data-current-location]:focus-visible,
    [data-map-retry]:focus-visible,
    .attribution a:focus-visible {
      outline: 4px solid #fff5b6;
      outline-offset: 3px;
    }

    [data-map-status] {
      position: fixed;
      left: 50%;
      top: calc(16px + env(safe-area-inset-top, 0px));
      z-index: 4;
      max-width: min(88vw, 430px);
      padding: 10px 12px;
      transform: translateX(-50%);
      border: 2px solid #263a35;
      border-radius: 8px;
      color: #263a35;
      background: #f5e9c6;
      box-shadow: 3px 4px 0 rgb(38 58 53 / 38%);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.45;
      text-align: center;
    }

    [data-map-status][hidden],
    [data-map-retry][hidden] { display: none; }

    [data-map-retry] {
      min-height: 34px;
      margin-left: 8px;
      padding: 4px 9px;
      border: 2px solid #263a35;
      border-radius: 5px;
      color: #f5e9c6;
      background: #3f704d;
      font: inherit;
      cursor: pointer;
    }

    .attribution {
      position: fixed;
      left: calc(8px + env(safe-area-inset-left, 0px));
      bottom: calc(6px + env(safe-area-inset-bottom, 0px));
      z-index: 2;
      max-width: calc(100vw - 86px);
      padding: 3px 5px;
      border-radius: 3px;
      color: #263a35;
      background: rgb(245 233 198 / 76%);
      font: 9px/1.25 system-ui, sans-serif;
    }

    .attribution a { color: inherit; }

    @media (prefers-reduced-motion: reduce) {
      [data-top-down-map],
      [data-current-location],
      [data-map-status] { scroll-behavior: auto; transition: none; }
    }
  </style>
</head>
<body>
  <canvas
    data-top-down-map
    aria-label="実地理を真上から描いた、名称表示のないゲーム風地図。ドラッグで移動できます"
    aria-describedby="map-status map-attribution"
  ></canvas>

  <aside id="map-status" data-map-status role="status" aria-live="polite" hidden>
    <span data-map-status-text></span>
    <button type="button" data-map-retry hidden>再試行</button>
  </aside>

  <button type="button" data-current-location aria-label="現在地へ移動">◎</button>

  <small class="attribution" id="map-attribution">
    © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>
    · <a href="https://openfreemap.org/">OpenFreeMap</a>
    · <a href="https://openmaptiles.org/">OpenMapTiles</a>
  </small>

  <script src="../assets/top-down-game-patterns.js?v=reference-material-5"></script>
  <script src="../assets/top-down-game-materials.js?v=reference-material-5"></script>
  <script src="../assets/top-down-game-renderer.js?v=reference-material-5"></script>
  <script src="../assets/top-down-game-map.js?v=reference-material-5"></script>
</body>
</html>
