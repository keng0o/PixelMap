<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelMap｜テスト用1マップ</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#181820; --pattern-accent:#2f6fed; --pattern-muted:#78828a; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:#181820;
    color:#f8f0d8;
    font-family:'DotGothic16', monospace;
    display:flex; flex-direction:column; align-items:center;
    gap:14px; padding:20px 12px 40px; min-height:100vh;
  }
  .rpg-window{
    background:#101018;
    border:2px solid #f8f0d8;
    border-radius:0;                       /* 角ばった昔の窓 */
    box-shadow:0 0 0 2px #101018, 0 0 0 4px #f8f0d8, 0 0 0 6px #101018;
    padding:10px 16px;
    position:relative;
    image-rendering:pixelated;
  }
  .map-frame{ padding:6px; line-height:0; }
  #captureBadge{
    display:none;
    position:absolute;
    top:18px;
    left:18px;
    z-index:4;
    max-width:min(72%, 500px);
    padding:9px 12px 10px;
    border:3px solid #f8f0d8;
    outline:3px solid #101018;
    background:#101018e8;
    color:#f8f0d8;
    line-height:1.25;
    box-shadow:8px 8px 0 #10101888;
    pointer-events:none;
  }
  #captureBadge .capture-kicker{ color:#f8f0d8; font-size:12px; letter-spacing:2px; }
  #captureBadge .capture-title{ margin-top:3px; font-size:24px; letter-spacing:1px; }
  #captureBadge .capture-place{ margin-top:5px; color:#d8d0b8; font-size:13px; }
  canvas{
    width:min(92vw, 700px);
    aspect-ratio:1/1;
    image-rendering:pixelated;
    cursor:grab;
    background:#78b850;
    touch-action:none;
    user-select:none;
  }
  canvas:focus-visible{ outline:4px solid #f8d038; outline-offset:4px; }
  canvas.dragging{ cursor:grabbing; }
  #msg{ width:min(92vw, 700px); min-height:60px; font-size:14px; line-height:1.8; letter-spacing:1px; }
  #msg .cursor{ display:inline-block; margin-left:6px; animation:blink 1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
  #toolbar{
    width:min(92vw,700px);
    font-size:12px;
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:10px;
    align-items:start;
  }
  #patternBar{
    width:min(92vw,700px);
    padding:12px;
    line-height:1.5;
  }
  .pattern-heading{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:14px;
    margin-bottom:10px;
  }
  .pattern-kicker{ color:#f8f0d8; font-size:11px; letter-spacing:2px; }
  #patternTitle{ margin-top:2px; color:#f8f0d8; font-size:19px; font-weight:normal; letter-spacing:1px; }
  #patternSummary{ max-width:470px; margin-top:4px; color:#b8b09c; font-size:11px; }
  .pattern-gallery-link{
    flex:0 0 auto;
    padding:6px 8px;
    border:1px solid #686858;
    color:#f8f0d8;
    font-size:11px;
    text-decoration:none;
    white-space:nowrap;
  }
  .pattern-gallery-link:hover{ border-color:var(--pattern-accent); color:#f8f0d8; }
  #patternTabs{
    display:grid;
    grid-template-columns:repeat(5, minmax(0,1fr));
    gap:6px;
  }
  .pattern-tab{
    min-width:0;
    padding:6px 7px;
    border:1px solid #585848;
    background:#181820;
    color:#a8a088;
    font:inherit;
    font-size:10px;
    line-height:1.35;
    text-decoration:none;
  }
  .pattern-tab .pattern-number{ display:block; color:#a8a088; font-size:9px; }
  .pattern-tab:hover{ border-color:#f8f0d8; color:#f8f0d8; }
  .pattern-tab[aria-current="page"]{
    border-color:var(--pattern-accent);
    background:color-mix(in srgb, var(--pattern-accent) 18%, #101018);
    color:#f8f0d8;
    box-shadow:inset 3px 0 0 var(--pattern-accent);
  }
  .pattern-tab[aria-current="page"] .pattern-number{ color:#f8f0d8; }
  #patternRules{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:6px;
    margin-top:8px;
  }
  .pattern-rule{
    min-width:0;
    padding:6px 8px;
    border:1px solid #383830;
    background:#14141c;
    color:#a8a088;
    font-size:10px;
  }
  .pattern-rule b{ display:block; margin-bottom:1px; color:#f8f0d8; font-weight:normal; }
  #toolbar label{ display:inline-flex; gap:6px; align-items:center; cursor:pointer; color:#d8d0b8; }
  #toolbar input{ accent-color:#88c860; }
  #toolbar .toolbar-actions{ grid-column:1 / -1; display:flex; }
  #toolbar .layer-category{
    min-width:0;
    padding:8px;
    border:1px solid #585848;
    background:#181820;
  }
  #toolbar .landuse-category{ grid-column:1 / -1; }
  #toolbar .category-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    padding-bottom:7px;
    border-bottom:1px solid #484838;
  }
  #toolbar .category-title{
    color:#f8d038;
    font-size:13px;
    font-weight:normal;
    letter-spacing:1px;
    white-space:nowrap;
  }
  #toolbar .category-master{
    padding:3px 6px;
    border:1px solid #686858;
    background:#101018;
    white-space:nowrap;
  }
  #toolbar .category-items{
    display:flex;
    flex-wrap:wrap;
    gap:8px 12px;
    padding-top:8px;
  }
  #toolbar label:has(input:checked){ color:#f8f0d8; }
  .location-btn{
    flex:0 0 auto;
    min-height:34px;
    padding:5px 10px;
    border:2px solid #f8f0d8;
    background:#88c860;
    color:#101018;
    font:inherit;
    letter-spacing:1px;
    cursor:pointer;
    white-space:nowrap;
  }
  .location-btn:hover{ background:#f8f0d8; }
  .location-btn:focus-visible{ outline:3px solid #f8d038; outline-offset:3px; }
  .location-btn:disabled{ cursor:wait; opacity:.65; }
  #stats{ width:min(92vw,700px); font-size:11px; color:#a8a088; display:flex; flex-wrap:wrap; gap:4px 14px; }
  #attrib{ font-size:10px; color:#a8a088; padding:6px 12px; }
  #attrib a{ color:#88c860; }
  button.retry, label.retry{
    font-family:inherit; font-size:13px; letter-spacing:1px;
    background:#101018; color:#f8f0d8; border:2px solid #f8f0d8;
    padding:6px 18px; cursor:pointer; margin-top:8px;
  }
  button.retry:hover, label.retry:hover{ background:#282838; }
  @media (max-width:760px), (max-height:500px){
    html, body{ width:100%; height:100%; overflow:hidden; }
    body{
      display:block;
      min-height:100vh;
      min-height:100dvh;
      padding:0;
      background:#78b850;
    }
    #stats, #attrib{ display:none; }
    #patternBar{
      position:fixed;
      top:0;
      left:0;
      right:0;
      z-index:35;
      width:100%;
      padding:6px 8px;
      border:0;
      border-bottom:2px solid #f8f0d8;
      box-shadow:0 4px 14px #101018aa;
      background:#101018ee;
    }
    .pattern-heading, #patternRules{ display:none; }
    #patternTabs{
      display:flex;
      gap:5px;
      overflow-x:auto;
      scrollbar-width:none;
    }
    #patternTabs::-webkit-scrollbar{ display:none; }
    .pattern-tab{ flex:0 0 auto; min-width:88px; padding:5px 7px; }
    .map-frame{
      position:fixed;
      inset:0;
      z-index:0;
      width:100vw;
      height:100vh;
      height:100dvh;
      padding:0;
      overflow:auto;
      overscroll-behavior:none;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
      border:0;
      box-shadow:none;
      background:#78b850;
    }
    .map-frame::-webkit-scrollbar, #toolbar::-webkit-scrollbar{ display:none; }
    canvas{
      display:block;
      width:max(100vw, 100vh);
      height:max(100vw, 100vh);
      width:max(100dvw, 100dvh);
      height:max(100dvw, 100dvh);
      max-width:none;
      cursor:default;
      touch-action:none;
    }
    #msg{
      position:fixed;
      top:auto;
      bottom:0;
      left:0;
      right:0;
      z-index:20;
      width:auto;
      height:calc(56px + env(safe-area-inset-bottom, 0px));
      min-height:56px;
      padding:7px 10px calc(7px + env(safe-area-inset-bottom, 0px));
      border:0;
      border-top:2px solid #f8f0d8;
      box-shadow:0 -2px 0 #101018, 0 -5px 18px #101018aa;
      background:#101018dc;
      font-size:11px;
      line-height:1.5;
      pointer-events:none;
    }
    #toolbar{
      position:fixed;
      left:0;
      right:0;
      bottom:calc(56px + env(safe-area-inset-bottom, 0px));
      z-index:30;
      width:100%;
      max-width:none;
      display:flex;
      align-items:flex-start;
      padding:8px 10px;
      flex-wrap:nowrap;
      gap:8px;
      overflow-x:auto;
      overflow-y:hidden;
      overscroll-behavior-x:contain;
      scroll-snap-type:x proximity;
      scrollbar-width:none;
      border:0;
      border-top:2px solid #f8f0d8;
      box-shadow:0 -2px 0 #101018, 0 -10px 28px #101018aa;
      background:#101018ee;
    }
    #toolbar .toolbar-actions{
      flex:0 0 auto;
      grid-column:auto;
      display:flex;
      align-items:flex-start;
      scroll-snap-align:start;
    }
    #toolbar .layer-category{
      flex:0 0 min(82vw, 320px);
      grid-column:auto;
      max-height:min(38vh, 280px);
      overflow-y:auto;
      scroll-snap-align:start;
      scrollbar-width:thin;
    }
    #toolbar .category-items{ gap:6px; }
    #toolbar .category-items label{ min-height:32px; padding:5px 7px; }
    #toolbar label{
      flex:0 0 auto;
      min-height:38px;
      padding:8px 10px;
      border:1px solid #686858;
      background:#181820;
      color:#d8d0b8;
      scroll-snap-align:start;
      white-space:nowrap;
    }
    #toolbar .category-master{ min-height:32px; padding:5px 8px; }
    #toolbar .location-btn{
      min-height:38px;
      padding:8px 12px;
      scroll-snap-align:start;
    }
    #toolbar label:has(input:checked){
      border-color:#88c860;
      background:#202818;
      color:#f8f0d8;
    }
    #toolbar input{ width:18px; height:18px; }
  }
  #patternBar{ display:none; }
  body.shared-controls{
    display:block;
    min-height:100vh;
    min-height:100dvh;
    padding:0;
    overflow:hidden;
    background:#78b850;
  }
  body.shared-controls #patternBar,
  body.shared-controls #toolbar,
  body.shared-controls #msg,
  body.shared-controls #stats,
  body.shared-controls #attrib{ display:none; }
  body.shared-controls .map-frame{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    height:100dvh;
    padding:0;
    overflow:auto;
    scrollbar-width:none;
    border:0;
    box-shadow:none;
    background:#78b850;
  }
  body.shared-controls .map-frame::-webkit-scrollbar{ display:none; }
  body.shared-controls canvas{
    display:block;
    width:max(100vw, 100vh);
    height:max(100vw, 100vh);
    width:max(100dvw, 100dvh);
    height:max(100dvw, 100dvh);
    max-width:none;
  }
  body.capture-mode{
    display:flex;
    min-height:100vh;
    min-height:100dvh;
    justify-content:flex-start;
    padding:18px;
    overflow:hidden;
    background:#181820;
  }
  body.capture-mode #patternBar,
  body.capture-mode #toolbar,
  body.capture-mode #msg,
  body.capture-mode #stats,
  body.capture-mode #attrib{ display:none; }
  body.capture-mode .map-frame{
    position:relative;
    inset:auto;
    width:auto;
    height:auto;
    padding:6px;
    overflow:hidden;
    border:2px solid #f8f0d8;
    box-shadow:0 0 0 2px #101018, 0 0 0 4px #f8f0d8, 0 0 0 6px #101018;
    background:#78b850;
  }
  body.capture-mode canvas{
    display:block;
    width:min(84vw, 840px);
    height:auto;
    max-width:none;
    cursor:default;
  }
  body.capture-mode #captureBadge{ display:block; }
  @media (prefers-reduced-motion: reduce){ #msg .cursor{ animation:none; } }
</style>
</head>
<body>

<p id="mapPosition" hidden>OpenFreeMap z14 / 14549 / 6460 ─ 地理の読みやすさ</p>

<section id="patternBar" class="rpg-window" aria-labelledby="patternTitle">
  <div class="pattern-heading">
    <div>
      <p class="pattern-kicker" id="patternKicker">ICON STUDY 01 / 10</p>
      <h1 id="patternTitle">バランス階層</h1>
      <p id="patternSummary">面積と高さから施設アイコンの大きさと情報量を調整します。</p>
    </div>
    <a class="pattern-gallery-link" href="icon-pattern-study.html">10案を一覧で比較</a>
  </div>
  <nav id="patternTabs" aria-label="アイコン表示パターン"></nav>
  <div id="patternRules" aria-label="現在のパターンのルール"></div>
</section>

<div class="rpg-window map-frame">
  <div id="captureBadge" aria-hidden="true">
    <div class="capture-kicker" id="captureKicker">ICON STUDY 01 / 10</div>
    <div class="capture-title" id="captureTitle">バランス階層</div>
    <div class="capture-place" id="capturePlace">川崎駅</div>
  </div>
  <canvas id="map" width="1536" height="1536" tabindex="0" aria-label="川崎駅周辺の読みやすいレトロRPG風マップ。ドラッグで移動、矢印キーで施設を選択できます" aria-describedby="msg"></canvas>
</div>

<div id="toolbar" class="rpg-window" aria-label="地図レイヤーの表示設定">
  <div class="toolbar-actions">
    <button id="locateBtn" class="location-btn" type="button" disabled>◎ 現在地へ</button>
    <label class="category-master"><input type="checkbox" id="tglAllLayers">全レイヤー</label>
  </div>

  <section class="layer-category" role="group" aria-labelledby="natureCategoryTitle">
    <div class="category-header">
      <h2 id="natureCategoryTitle" class="category-title">自然・水域</h2>
      <label class="category-master"><input type="checkbox" data-category-toggle>一括</label>
    </div>
    <div class="category-items">
      <label><input type="checkbox" id="tglGrass" data-category-item>草地(背景)</label>
      <label><input type="checkbox" id="tglForest" data-category-item>森</label>
      <label><input type="checkbox" id="tglWoods" data-category-item>林</label>
      <label><input type="checkbox" id="tglFarmland" data-category-item>農地</label>
      <label><input type="checkbox" id="tglLandcoverGrass" data-category-item>草原</label>
      <label><input type="checkbox" id="tglSand" data-category-item>砂地</label>
      <label><input type="checkbox" id="tglRock" data-category-item>岩場</label>
      <label><input type="checkbox" id="tglWetland" data-category-item>湿地</label>
      <label><input type="checkbox" id="tglIce" data-category-item>雪・氷</label>
      <label><input type="checkbox" id="tglLandcoverOther" data-category-item>その他地表</label>
      <label><input type="checkbox" id="tglParks" data-category-item>公園</label>
      <label><input type="checkbox" id="tglWaterAreas" data-category-item>水面</label>
      <label><input type="checkbox" id="tglRivers" data-category-item>河川</label>
      <label><input type="checkbox" id="tglStreams" data-category-item>小川</label>
      <label><input type="checkbox" id="tglCanals" data-category-item>運河</label>
      <label><input type="checkbox" id="tglDrains" data-category-item>排水路</label>
      <label><input type="checkbox" id="tglWaterwayOther" data-category-item>その他水路</label>
    </div>
  </section>

  <section class="layer-category landuse-category" role="group" aria-labelledby="landuseCategoryTitle">
    <div class="category-header">
      <h2 id="landuseCategoryTitle" class="category-title">土地利用</h2>
      <label class="category-master"><input type="checkbox" data-category-toggle>一括</label>
    </div>
    <div class="category-items">
      <label><input type="checkbox" id="tglLanduseResidential" data-category-item>住宅地</label>
      <label><input type="checkbox" id="tglLanduseCommercial" data-category-item>業務・商業用地</label>
      <label><input type="checkbox" id="tglLanduseRetail" data-category-item>小売用地</label>
      <label><input type="checkbox" id="tglLanduseSchool" data-category-item>学校・幼稚園用地</label>
      <label><input type="checkbox" id="tglLanduseHigherEducation" data-category-item>大学・高等教育用地</label>
      <label><input type="checkbox" id="tglLanduseMedical" data-category-item>病院・医療用地</label>
      <label><input type="checkbox" id="tglLanduseCivic" data-category-item>公共施設用地</label>
      <label><input type="checkbox" id="tglLanduseIndustrial" data-category-item>工業用地</label>
      <label><input type="checkbox" id="tglLanduseGarages" data-category-item>車庫・ガレージ用地</label>
      <label><input type="checkbox" id="tglLanduseMilitary" data-category-item>軍事用地</label>
      <label><input type="checkbox" id="tglLanduseBusStation" data-category-item>バスターミナル用地</label>
      <label><input type="checkbox" id="tglLanduseRailway" data-category-item>鉄道用地</label>
      <label><input type="checkbox" id="tglLanduseCemetery" data-category-item>墓地</label>
      <label><input type="checkbox" id="tglLanduseStadium" data-category-item>スタジアム</label>
      <label><input type="checkbox" id="tglLandusePitchTrack" data-category-item>球技場・競技トラック</label>
      <label><input type="checkbox" id="tglLandusePlayground" data-category-item>遊び場</label>
      <label><input type="checkbox" id="tglLanduseAmusement" data-category-item>遊園地</label>
      <label><input type="checkbox" id="tglLanduseZoo" data-category-item>動物園</label>
      <label><input type="checkbox" id="tglLanduseAirport" data-category-item>空港施設</label>
      <label><input type="checkbox" id="tglLanduseHelipad" data-category-item>ヘリポート</label>
      <label><input type="checkbox" id="tglLanduseOther" data-category-item>その他</label>
    </div>
  </section>

  <section class="layer-category" role="group" aria-labelledby="transportCategoryTitle">
    <div class="category-header">
      <h2 id="transportCategoryTitle" class="category-title">交通</h2>
      <label class="category-master"><input type="checkbox" data-category-toggle>一括</label>
    </div>
    <div class="category-items">
      <label><input type="checkbox" id="tglLocalRoads" data-category-item>生活道路</label>
      <label><input type="checkbox" id="tglRegionalRoads" data-category-item>地区幹線道路</label>
      <label><input type="checkbox" id="tglMajorRoads" data-category-item>主要道路</label>
      <label><input type="checkbox" id="tglMotorways" data-category-item>高速道路</label>
      <label><input type="checkbox" id="tglPaths" data-category-item>歩道・小径</label>
      <label><input type="checkbox" id="tglTracks" data-category-item>作業道・未舗装路</label>
      <label><input type="checkbox" id="tglRaceways" data-category-item>競走路</label>
      <label><input type="checkbox" id="tglFerries" data-category-item>フェリー航路</label>
      <label><input type="checkbox" id="tglPiers" data-category-item>桟橋</label>
      <label><input type="checkbox" id="tglRail" data-category-item>鉄道</label>
      <label><input type="checkbox" id="tglSubway" data-category-item>地下鉄(破線)</label>
      <label><input type="checkbox" id="tglAerialways" data-category-item>索道・ロープウェイ</label>
      <label><input type="checkbox" id="tglTransportationOther" data-category-item>その他交通</label>
      <label><input type="checkbox" id="tglRoadTunnels" data-category-item>道路トンネル(破線)</label>
      <label><input type="checkbox" id="tglPathTunnels" data-category-item>歩道トンネル(破線)</label>
      <label><input type="checkbox" id="tglRailTunnels" data-category-item>鉄道トンネル(破線)</label>
    </div>
  </section>

  <section class="layer-category" role="group" aria-labelledby="facilityCategoryTitle">
    <div class="category-header">
      <h2 id="facilityCategoryTitle" class="category-title">建物・施設</h2>
      <label class="category-master"><input type="checkbox" data-category-toggle>一括</label>
    </div>
    <div class="category-items">
      <label><input type="checkbox" id="tglBuildings" data-category-item>たてもの</label>
      <label><input type="checkbox" id="tglPoi" data-category-item>施設アイコン</label>
      <label><input type="checkbox" id="tglDots" data-category-item>小さな施設(点)</label>
    </div>
  </section>

  <section class="layer-category" role="group" aria-labelledby="annotationCategoryTitle">
    <div class="category-header">
      <h2 id="annotationCategoryTitle" class="category-title">情報</h2>
      <label class="category-master"><input type="checkbox" data-category-toggle>一括</label>
    </div>
    <div class="category-items">
      <label><input type="checkbox" id="tglStationNames" data-category-item>駅名</label>
      <label><input type="checkbox" id="tglParkNames" data-category-item>公園名</label>
      <label><input type="checkbox" id="tglPoiNames" data-category-item>施設名</label>
      <label><input type="checkbox" id="tglPlaceNames" data-category-item>地名・地域</label>
      <label><input type="checkbox" id="tglTerrainNames" data-category-item>山・地形</label>
    </div>

/* =====================================================
   1. MVTデコーダ（依存なし・前版と同一）
   ===================================================== */
const TD = new TextDecoder('utf-8');

class Pbf {
  constructor(buf){
    this.b  = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    this.dv = new DataView(this.b.buffer, this.b.byteOffset, this.b.byteLength);
    this.pos = 0;
  }
  varint(){
    let r = 0, shift = 0, byte;
    do {
      byte = this.b[this.pos++];
      r += shift < 28 ? (byte & 0x7f) << shift : (byte & 0x7f) * 2 ** shift;
      shift += 7;
    } while (byte >= 0x80);
    return r;
  }
  svarint(){ const v = this.varint(); return (v % 2 === 1) ? -(v + 1) / 2 : v / 2; }
  string(){ const len = this.varint(); const s = TD.decode(this.b.subarray(this.pos, this.pos + len)); this.pos += len; return s; }
  float(){ const v = this.dv.getFloat32(this.pos, true); this.pos += 4; return v; }
  double(){ const v = this.dv.getFloat64(this.pos, true); this.pos += 8; return v; }
  packedVarint(){ const end = this.varint() + this.pos; const a = []; while (this.pos < end) a.push(this.varint()); return a; }
  skip(wt){
    if (wt === 0) this.varint();
    else if (wt === 2) this.pos += this.varint();
    else if (wt === 5) this.pos += 4;
    else if (wt === 1) this.pos += 8;
    else throw new Error('unknown wire type ' + wt);
  }
}
function parseValue(p){
  const end = p.varint() + p.pos;
  let v = null;
  while (p.pos < end){
    const tag = p.varint(), f = tag >> 3, wt = tag & 7;
    if (f === 1) v = p.string();
    else if (f === 2) v = p.float();
    else if (f === 3) v = p.double();
    else if (f === 4 || f === 5) v = p.varint();
    else if (f === 6) v = p.svarint();
    else if (f === 7) v = !!p.varint();
    else p.skip(wt);
  }
  return v;
}
const zz = v => ((v >> 1) ^ -(v & 1));
function decodeGeometry(cmds, type){
  let x = 0, y = 0, i = 0;
  const lines = []; let line = null;
  while (i < cmds.length){
    const c = cmds[i++], cmd = c & 7, count = c >> 3;
    if (cmd === 1){
      for (let k = 0; k < count; k++){
        x += zz(cmds[i++]); y += zz(cmds[i++]);
        line = [[x, y]]; lines.push(line);
      }
    } else if (cmd === 2){
      for (let k = 0; k < count; k++){
        x += zz(cmds[i++]); y += zz(cmds[i++]);
        line.push([x, y]);
      }
    } else if (cmd === 7){
      if (line) line.push(line[0].slice());
    } else break;
  }
  return lines;
}
function parseTile(buf){
  const p = new Pbf(buf);
  const layers = {};
  while (p.pos < p.b.length){
    const tag = p.varint(), f = tag >> 3, wt = tag & 7;
    if (f === 3){
      const end = p.varint() + p.pos;
      const layer = { name:'', extent:4096, keys:[], values:[], featureRanges:[], features:[] };
      while (p.pos < end){
        const t2 = p.varint(), f2 = t2 >> 3, w2 = t2 & 7;
        if (f2 === 1) layer.name = p.string();
        else if (f2 === 2){ const l = p.varint(); layer.featureRanges.push([p.pos, p.pos + l]); p.pos += l; }
        else if (f2 === 3) layer.keys.push(p.string());
        else if (f2 === 4) layer.values.push(parseValue(p));
        else if (f2 === 5) layer.extent = p.varint();
        else p.skip(w2);
      }
      for (const [s, e] of layer.featureRanges){
        const fp = new Pbf(p.b.subarray(s, e));
        const feat = { id:0, props:{}, type:0, geom:[] };
        let tags = [];
        while (fp.pos < fp.b.length){
          const t3 = fp.varint(), f3 = t3 >> 3, w3 = t3 & 7;
          if (f3 === 1) feat.id = fp.varint();
          else if (f3 === 2) tags = fp.packedVarint();
          else if (f3 === 3) feat.type = fp.varint();
          else if (f3 === 4) feat.geom = decodeGeometry(fp.packedVarint(), feat.type);
          else fp.skip(w3);
        }
        for (let i = 0; i + 1 < tags.length; i += 2)
          feat.props[layer.keys[tags[i]]] = layer.values[tags[i + 1]];
        layer.features.push(feat);
      }
      delete layer.featureRanges;
      layers[layer.name] = layer;
    } else p.skip(wt);
  }
  return layers;
}

function quantizeAssetRect(x,y,w,h){
  if(w<=0 || h<=0) return {x,y,w,h};
  const x0=Math.floor(x/SCENE_PIXELS_PER_LOGICAL_PIXEL)*SCENE_PIXELS_PER_LOGICAL_PIXEL;
  const y0=Math.floor(y/SCENE_PIXELS_PER_LOGICAL_PIXEL)*SCENE_PIXELS_PER_LOGICAL_PIXEL;
  const x1=Math.ceil((x+w)/SCENE_PIXELS_PER_LOGICAL_PIXEL)*SCENE_PIXELS_PER_LOGICAL_PIXEL;
  const y1=Math.ceil((y+h)/SCENE_PIXELS_PER_LOGICAL_PIXEL)*SCENE_PIXELS_PER_LOGICAL_PIXEL;
  return {
    x:x0,
    y:y0,
    w:Math.max(SCENE_PIXELS_PER_LOGICAL_PIXEL,x1-x0),
    h:Math.max(SCENE_PIXELS_PER_LOGICAL_PIXEL,y1-y0)
  };
}

function fillAssetRect(target,x,y,w,h,color){

}

function quantizeContextFillRects(target){
  const nativeFillRect=target.fillRect.bind(target);

    const transform=target.getTransform();
    if(Math.max(Math.abs(transform.a),Math.abs(transform.d))>=SCENE_PIXELS_PER_LOGICAL_PIXEL){
      nativeFillRect(x,y,w,h);
      return;
    }
    const rect=quantizeAssetRect(x,y,w,h);
    nativeFillRect(rect.x,rect.y,rect.w,rect.h);
  };
}

function T(draw){
  const c = document.createElement('canvas');
  // 標準用マップチップはcell2でも16シーンpxで構築し、後段で
  // 4×4個の原子セルへ変換する。完成した地図画像は量子化しない。
  c.width = c.height = STANDARD_CPX;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  draw(g, (x,y,w,h,col)=>fillAssetRect(g,x,y,w,h,col));
  return c;
}

/* 建物の分類・配色は building-styles.js が唯一の正典。
   ROOFPALはマップチップ生成と後方互換のためのエイリアス。 */
const BUILDING_STYLES = window.PixelMapBuildingStyles;
const ROOFPAL = BUILDING_STYLES.LEGACY_ROOFPAL;

function rasterizeGrid(layers, options){
  const RG = GRID + 2;                           // 移動時に端が空かないよう外周も描画
  // レイヤーごとに独立したグリッドを持ち、チェック順に合成できるようにする。
  // 0 = GRASS は未描画セルも兼ねるため、grass 以外は drawGrid の transparent で読み分ける。
  const grids = new Map();
  // cell2では塗り幅とは別に交通の中心線を保持し、縁取り・中央線・
  // レール・枕木を原子セルの多層として再構成する。
  const transportCenters = new Map();
  const featureCountsByOption = Object.create(null);
  const countFeatures = (option, count) => {
    featureCountsByOption[option] = (featureCountsByOption[option] || 0) + count;
  };
  const layerGrid = option => {
    if (!grids.has(option)) grids.set(option, new Uint8Array(RG * RG));
    return grids.get(option);
  };
  const centerGrid = option => {
    if (!transportCenters.has(option)) transportCenters.set(option, new Uint8Array(RG * RG));
    return transportCenters.get(option);
  };
  const oc = document.createElement('canvas');
  oc.width = oc.height = RG;
  const c = oc.getContext('2d', { willReadFrequently: true });
  const extent = layers.transportation?.extent || layers.building?.extent || 4096;
  const S = GRID / extent;
  const semanticS = STANDARD_GRID / extent;
  const L = n => (layers[n] ? layers[n].features : []);
  const gx = x => x * S - gridOriginX;
  const gy = y => y * S - gridOriginY;

  function polyPath(rings){
    c.beginPath();
    for (const ring of rings){
      ring.forEach((pt, i) => i ? c.lineTo(gx(pt[0]), gy(pt[1])) : c.moveTo(gx(pt[0]), gy(pt[1])));
    }
  }
  function linePath(lines){
    c.beginPath();
    for (const ln of lines)
      ln.forEach((pt, i) => i ? c.lineTo(gx(pt[0]), gy(pt[1])) : c.moveTo(gx(pt[0]), gy(pt[1])));
  }
  function stamp(option, id, drawFn){
    c.clearRect(0, 0, RG, RG);
    c.fillStyle = '#000'; c.strokeStyle = '#000';
    c.lineCap = 'round'; c.lineJoin = 'round';
    drawFn();
    const d = c.getImageData(0, 0, RG, RG).data;
    const grid = layerGrid(option);
    for (let i = 0; i < RG * RG; i++)
      if (d[i * 4 + 3] > 100) grid[i] = id;
  }
  function stampGroups(features, styleFor, drawFeature){
    const groups = new Map();
    for (const feature of features){
      const style = styleFor(feature);
      if (!style) continue;
      const key = `${style.option}:${style.id}`;
      if (!groups.has(key)) groups.set(key, { ...style, features:[] });
      groups.get(key).features.push(feature);
    }
    for (const group of groups.values()){
      countFeatures(group.option, group.features.length);
      stamp(group.option, group.id, () => {
        for (const feature of group.features) drawFeature(feature, group);
      });
    }
  }
  function paintGeometry(feature, lineWidth = 1, pointSize = 1){
    if (feature.type === 3){ polyPath(feature.geom); c.fill('evenodd'); }
    else if (feature.type === 2){ linePath(feature.geom); c.lineWidth = lineWidth * CELL_DETAIL_SCALE; c.stroke(); }
    else if (feature.type === 1){
      for (const line of feature.geom) for (const point of line)
        c.fillRect(
          gx(point[0]) - pointSize * CELL_DETAIL_SCALE / 2,
          gy(point[1]) - pointSize * CELL_DETAIL_SCALE / 2,
          pointSize * CELL_DETAIL_SCALE,
          pointSize * CELL_DETAIL_SCALE
        );
    }
  }

  function featureAreaCells(feature){
    if (feature.type !== 3) return 0;
    let twiceArea = 0;
    for (const ring of feature.geom){
      for (let i = 0; i + 1 < ring.length; i++)
        twiceArea += ring[i][0] * ring[i + 1][1] - ring[i + 1][0] * ring[i][1];
    }
    return Math.abs(twiceArea) * .5 * semanticS * semanticS;
  }

  const PARK_SURFACE_CLASSES = new Set(['park','garden','recreation_ground']);
  const PARK_RESERVE_CLASSES = new Set(['national_park','geopark','nature_reserve','protected_area']);
  const featureKind = feature => feature.props.subclass || feature.props.class || '';
  const isParkSurface = feature => PARK_SURFACE_CLASSES.has(featureKind(feature));

  const LANDCOVER = {
    wood:{ id:ID.WOODS, option:'woods' },
    forest:{ id:ID.FOREST, option:'forest' },
    farmland:{ id:ID.FARM, option:'farmland' },
    ice:{ id:ID.ICE, option:'ice' },
    glacier:{ id:ID.ICE, option:'ice' },
    snow:{ id:ID.ICE, option:'ice' },
    rock:{ id:ID.ROCK, option:'rock' },
    bare_rock:{ id:ID.ROCK, option:'rock' },
    scree:{ id:ID.ROCK, option:'rock' },
    grass:{ id:ID.MEADOW, option:'landcoverGrass' },
    grassland:{ id:ID.MEADOW, option:'landcoverGrass' },
    meadow:{ id:ID.MEADOW, option:'landcoverGrass' },
    wetland:{ id:ID.WETLAND, option:'wetland' },
    marsh:{ id:ID.WETLAND, option:'wetland' },
    swamp:{ id:ID.WETLAND, option:'wetland' },
    bog:{ id:ID.WETLAND, option:'wetland' },
    sand:{ id:ID.SAND, option:'sand' },
    beach:{ id:ID.SAND, option:'sand' },
    dune:{ id:ID.SAND, option:'sand' },
  };
  const LANDUSE = {
    wood:{ id:ID.WOODS, option:'woods' },
    forest:{ id:ID.FOREST, option:'forest' },
    residential:{ id:ID.DIRT, option:'landuseResidential' },
    suburb:{ id:ID.DIRT, option:'landuseResidential' },
    quarter:{ id:ID.DIRT, option:'landuseResidential' },
    neighbourhood:{ id:ID.DIRT, option:'landuseResidential' },
    commercial:{ id:ID.PAVE, option:'landuseCommercial' },
    retail:{ id:ID.PAVE, option:'landuseRetail' },
    school:{ id:ID.PAVE, option:'landuseSchool' },
    kindergarten:{ id:ID.PAVE, option:'landuseSchool' },
    college:{ id:ID.PAVE, option:'landuseHigherEducation' },
    university:{ id:ID.PAVE, option:'landuseHigherEducation' },
    hospital:{ id:ID.PAVE, option:'landuseMedical' },
    library:{ id:ID.PAVE, option:'landuseCivic' },
    industrial:{ id:ID.GRAVEL, option:'landuseIndustrial' },
    quarry:{ id:ID.GRAVEL, option:'landuseIndustrial' },
    dam:{ id:ID.GRAVEL, option:'landuseIndustrial' },
    garages:{ id:ID.GRAVEL, option:'landuseGarages' },
    military:{ id:ID.GRAVEL, option:'landuseMilitary' },
    bus_station:{ id:ID.PAVE, option:'landuseBusStation' },
    railway:{ id:ID.GRAVEL, option:'landuseRailway' },
    cemetery:{ id:ID.PARK, option:'landuseCemetery' },
    grave_yard:{ id:ID.PARK, option:'landuseCemetery' },
    stadium:{ id:ID.FIELD, option:'landuseStadium' },
    pitch:{ id:ID.FIELD, option:'landusePitchTrack' },
    track:{ id:ID.FIELD, option:'landusePitchTrack' },
    playground:{ id:ID.FIELD, option:'landusePlayground' },
    theme_park:{ id:ID.FIELD, option:'landuseAmusement' },
    zoo:{ id:ID.FIELD, option:'landuseZoo' },
  };
  const featureStyle = (feature, styles, fallback) =>
    styles[feature.props.subclass] || styles[feature.props.class] || fallback;
  stampGroups(
    L('landcover'),
    feature => isParkSurface(feature) ? null : featureStyle(feature, LANDCOVER, { id:ID.TERRAIN_OTHER, option:'landcoverOther' }),
    feature => paintGeometry(feature, 1.2, 1)
  );
  stampGroups(
    L('landuse'),
    feature => isParkSurface(feature) ? null : featureStyle(feature, LANDUSE, { id:ID.DIRT, option:'landuseOther' }),
    feature => paintGeometry(feature, 1.2, 1)
  );
  // landcover/landuse の公園・庭園を統合し、面積8セル未満を小、64セル未満を中、それ以上を大にする。
  // 国立公園・保護区は地表ではなく指定区域なので別IDにし、既存の森や林を塗り潰さない。
  const parkFeatures = [
    ...L('landcover').filter(isParkSurface),
    ...L('landuse').filter(isParkSurface),
  ];
  const parkGroups = new Map([
    [ID.PARK_RESERVE,L('park').filter(feature => feature.type === 3 && PARK_RESERVE_CLASSES.has(featureKind(feature)))],
    [ID.PARK_LARGE,[]],[ID.PARK_MEDIUM,[]],[ID.PARK,[]],
  ]);
  for (const feature of parkFeatures){
    const area = featureAreaCells(feature);
    const id = area >= 64 ? ID.PARK_LARGE : area >= 8 ? ID.PARK_MEDIUM : ID.PARK;
    parkGroups.get(id).push(feature);
  }
  for (const [id, features] of parkGroups){
    countFeatures('parks', features.length);
    stamp('parks', id, () => {
      for (const feature of features) paintGeometry(feature, 1.2, 1);
    });
  }
  stampGroups(
    L('aeroway'),
    feature => {
      const kind = feature.props.subclass || feature.props.class;
      return {
        id:ID.PAVE,
        option:['helipad','heliport'].includes(kind) ? 'landuseHelipad' : 'landuseAirport',
      };
    },
    feature => {
      const kind = feature.props.subclass || feature.props.class;
      paintGeometry(feature, kind === 'runway' ? 2.6 : 1.1, 1.4);
    }
  );
  // 水
  countFeatures('waterAreas', L('water').length);
  stamp('waterAreas', ID.WATER, () => {
    for (const feature of L('water')) paintGeometry(feature, 1.4, 1);
  });
  const waterways = L('waterway');
  const WATERWAY = {
    river:{ id:ID.WATER, option:'rivers', width:1.4 },
    stream:{ id:ID.WATER, option:'streams', width:.65 },
    canal:{ id:ID.WATER, option:'canals', width:1.4 },
    ditch:{ id:ID.WATER, option:'drains', width:1.1 },
    drain:{ id:ID.WATER, option:'drains', width:1.1 },
  };
  stampGroups(
    waterways,
    feature => featureStyle(feature, WATERWAY, { id:ID.WATER, option:'waterwayOther', width:1 }),
    (feature, style) => paintGeometry(feature, style.width, 1)
  );
  // 建物: 表示の有無にかかわらず面積を計算する。
  // z14では多数の棟が1つのマルチポリゴンfeatureに統合されるため、
  // 「外形リング＝棟」を単位に分割する（リゾルバーのbuildingIdと同じ意味論）。
  const bldGrid = new Uint16Array(RG * RG);
  const buildingGrid = layerGrid('buildings');
  function fillPolyCells(rings, visit){
    let minY = Infinity, maxY = -Infinity;
    for (const r of rings) for (const p of r){
      const y = gy(p[1]);
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;
    }
    const y0 = Math.max(0, Math.floor(minY)), y1 = Math.min(RG - 1, Math.ceil(maxY));
    for (let cy = y0; cy <= y1; cy++){
      const yc = cy + 0.5, xs = [];
      for (const r of rings){
        for (let i = 0; i + 1 < r.length; i++){
          const ya = gy(r[i][1]), yb = gy(r[i+1][1]);
          if ((ya <= yc) !== (yb <= yc)){
            const xa = gx(r[i][0]), xb = gx(r[i+1][0]);
            xs.push(xa + (yc - ya) * (xb - xa) / (yb - ya));
          }
        }
      }
      xs.sort((a, b) => a - b);
      for (let k = 0; k + 1 < xs.length; k += 2){
        const cx0 = Math.max(0, Math.ceil(xs[k] - 0.5));
        const cx1 = Math.min(RG - 1, Math.floor(xs[k+1] - 0.5));
        for (let cx = cx0; cx <= cx1; cx++) visit(cx, cy);
      }
    }
  }
  const ringSigned = ring => {
    let sum = 0;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++)
      sum += (ring[j][0] - ring[i][0]) * (ring[j][1] + ring[i][1]);
    return sum / 2;
  };
  const ringContainsPoint = (ring, x, y) => {
    let inside = false;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++){
      const [xi, yi] = ring[i], [xj, yj] = ring[j];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi)
        inside = !inside;
    }
    return inside;
  };
  const buildingExtent = layers.building?.extent || 4096;
  // 世界px変換はリゾルバーと同一式・同一の座標オブジェクトを使うため、
  // ringKey は facility.buildingId と文字列一致し、直接joinできる。
  const worldScale = (GRID * CPX) / buildingExtent;
  const bldUnits = [];                        // { props, rings, ringKey, geomAreaCells }
  const unitByRingKey = new Map();
  for (const f of L('building')){
    if (f.type !== 3 || !f.geom.length) continue;
    const rings = f.geom.filter(r => r.length >= 3).map(r => ({ pts:r, signed:ringSigned(r), holes:null }));
    if (!rings.length) continue;
    // 最大リングの符号を「外形」とみなし、逆符号のリングは内包する外形へ穴として割り当てる
    let outerSign = 1, maxAbs = -1;
    for (const r of rings){
      const a = Math.abs(r.signed);
      if (a > maxAbs){ maxAbs = a; outerSign = Math.sign(r.signed) || 1; }
    }
    const outers = [], holes = [];
    for (const r of rings) ((Math.sign(r.signed) || outerSign) === outerSign ? outers : holes).push(r);
    for (const hole of holes){
      const [hx, hy] = hole.pts[0];
      let best = null;
      for (const outer of outers){
        if (!ringContainsPoint(outer.pts, hx, hy)) continue;
        if (!best || Math.abs(outer.signed) < Math.abs(best.signed)) best = outer;
      }
      if (best) (best.holes || (best.holes = [])).push(hole.pts);
    }
    for (const outer of outers){
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const [ox, oy] of outer.pts){
        const wx = ox * worldScale + TILE.x * GRID * CPX;
        const wy = oy * worldScale + TILE.y * GRID * CPX;
        if (wx < minX) minX = wx; if (wx > maxX) maxX = wx;
        if (wy < minY) minY = wy; if (wy > maxY) maxY = wy;
      }
      bldUnits.push({
        props:f.props,
        rings:[outer.pts, ...(outer.holes || [])],
        ringKey:`r:${Math.round(minX)},${Math.round(minY)},${Math.round(maxX)},${Math.round(maxY)}`,
        // 意味分類は標準96セル基準のままにし、cell2の細分化で変化させない。
        geomAreaCells:Math.abs(outer.signed) * (STANDARD_GRID / buildingExtent) ** 2,
      });
    }
  }
  const bldArea = new Uint32Array(bldUnits.length + 1);
  bldUnits.forEach((u, i) => {
    if (!unitByRingKey.has(u.ringKey)) unitByRingKey.set(u.ringKey, i + 1);
    let cnt = 0;
    fillPolyCells(u.rings, (cx, cy) => {
      buildingGrid[cy * RG + cx] = ID.BLD;
      bldGrid[cy * RG + cx] = i + 1;
      cnt++;
    });
    if (!cnt){                                   // セル中心を1つも拾えない極小の棟は重心に1セル
      const r = u.rings[0];
      let sx = 0, sy = 0;
      r.forEach(p => { sx += p[0]; sy += p[1]; });
      if (r.length){
        const cx = Math.floor(gx(sx / r.length)), cy = Math.floor(gy(sy / r.length));
        if (cx >= 0 && cy >= 0 && cx < RG && cy < RG){
          buildingGrid[cy * RG + cx] = ID.BLD;
          bldGrid[cy * RG + cx] = i + 1;
          cnt = 1;
        }
      }
    }
    bldArea[i + 1] = cnt;
  });
  countFeatures('buildings', bldUnits.length);
  /* --- 道・線路: セル走査で必ず4連結にする（斜めは階段状） --- */
  const setCell = (grid, cx, cy, id) => {
    if (cx >= 0 && cy >= 0 && cx < RG && cy < RG) grid[cy * RG + cx] = id;
  };
  const setCellBrush = (grid, cx, cy, id, span) => {
    const start = -Math.floor(span / 2);
    for (let dy = 0; dy < span; dy++)
      for (let dx = 0; dx < span; dx++)
        setCell(grid, cx + start + dx, cy + start + dy, id);
  };
  // Amanatides–Woo のボクセル走査。1ステップで進むのは必ず1軸だけなので
  // 斜め線も自動的に「ギザギザの階段」になり、経路セルが途切れない。
  function traverse(x0, y0, x1, y1, visit){
    let cx = Math.floor(x0), cy = Math.floor(y0);
    const ex = Math.floor(x1), ey = Math.floor(y1);
    const dx = x1 - x0, dy = y1 - y0;
    const stepX = dx > 0 ? 1 : -1, stepY = dy > 0 ? 1 : -1;
    const tDX = dx !== 0 ? Math.abs(1 / dx) : Infinity;
    const tDY = dy !== 0 ? Math.abs(1 / dy) : Infinity;
    let tMX = dx !== 0 ? (dx > 0 ? (cx + 1 - x0) : (x0 - cx)) * tDX : Infinity;
    let tMY = dy !== 0 ? (dy > 0 ? (cy + 1 - y0) : (y0 - cy)) * tDY : Infinity;
    visit(cx, cy);
    let guard = 0;
    while ((cx !== ex || cy !== ey) && guard++ < RG * 4){
      if (tMX < tMY){ cx += stepX; tMX += tDX; }
      else          { cy += stepY; tMY += tDY; }
      visit(cx, cy);
    }
  }
  function lineStamp(layer, fs, id, thick, routeOption = layer){
    const grid = layerGrid(layer);
    const center = CELL_ONLY_MODE ? centerGrid(layer) : null;
    const minimumMinorRoute = STANDALONE_MINIMUM_MINOR_ROUTES &&
      ['localRoads','paths'].includes(routeOption);
    for (const f of fs){
      for (const ln of f.geom){
        for (let i = 0; i + 1 < ln.length; i++){
          traverse(gx(ln[i][0]), gy(ln[i][1]), gx(ln[i+1][0]), gy(ln[i+1][1]), (cx, cy) => {
            if (CELL_ONLY_MODE){
              setCell(center, cx, cy, 1);
              setCellBrush(grid, cx, cy, id,
                minimumMinorRoute ? 1 : (thick ? 2 : 1) * CELL_DETAIL_SCALE);
            } else {
              setCell(grid, cx, cy, id);
              if (thick){ setCell(grid, cx + 1, cy, id); setCell(grid, cx, cy + 1, id); }
            }
          });
        }
      }
    }
  }
  // 線路: 別の線路のセルと辺で隣接するなら砂利にして、レール面同士が接しないように配置
  function railStamp(option, fs){
    const grid = layerGrid(option);
    for (const f of fs){
      const own = new Set();                       // この線が自分で置いたセル
      for (const ln of f.geom){
        for (let i = 0; i + 1 < ln.length; i++){
          traverse(gx(ln[i][0]), gy(ln[i][1]), gx(ln[i+1][0]), gy(ln[i+1][1]), (cx, cy) => {
            if (cx < 0 || cy < 0 || cx >= RG || cy >= RG) return;
            const idx = cy * RG + cx;
            if (grid[idx] === ID.RAIL && !own.has(idx)) return;   // 既存の他線には触れない
            let foreign = false;
            for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
              const nx = cx + dx, ny = cy + dy;
              if (nx < 0 || ny < 0 || nx >= RG || ny >= RG) continue;
              const j = ny * RG + nx;
              if (grid[j] === ID.RAIL && !own.has(j)){ foreign = true; break; }
            }
            if (foreign){
              if (grid[idx] !== ID.RAIL) grid[idx] = ID.GRAVEL;   // 間は砂利の路盤
            } else {
              grid[idx] = ID.RAIL;
              own.add(idx);
            }
          });
        }
      }
    }
  }
  const transportationLines = new Map();
  const transportationSurfaces = new Map();
  for (const feature of L('transportation')){
    const binding = corridorBinding(feature);
    const option = binding.assetId;
    const isBridgeFeature = binding.modifiers.bridge;
    let layer = isBridgeFeature ? `bridge:${option}` : option;
    if (!isBridgeFeature && option === 'subway'){
      if (!CELL_ONLY_MODE) continue;
      layer = 'subway';
    } else if (binding.modifiers.tunnel && binding.stateAssetId !== option){
      if (!CELL_ONLY_MODE) continue;
      layer = binding.stateAssetId;
    }
    if (feature.type === 2){
      const key = `${layer}:${option}`;
      if (!transportationLines.has(key)) transportationLines.set(key, { layer, option, features:[] });
      transportationLines.get(key).features.push(feature);
    }else{
      transportationSurfaces.set(feature, { option, layer });
    }
  }
  for (const { layer, option, features } of transportationLines.values()){
    const style = TRANSPORT_STYLE[option] || TRANSPORT_STYLE.transportationOther;
    if (style.id === ID.RAIL && !CELL_ONLY_MODE) railStamp(layer, features);
    else lineStamp(layer, features, style.id, style.thick, option);
    countFeatures(layer, features.length);
  }
  stampGroups(
    [...transportationSurfaces.keys()],
    feature => {
      const item = transportationSurfaces.get(feature);
      const style = TRANSPORT_STYLE[item.option] || TRANSPORT_STYLE.transportationOther;
      return { id:style.polygonId, option:item.layer, enabledOption:item.option };
    },
    feature => paintGeometry(feature, 1.5, 1.25)
  );
  return { grids, transportCenters, bldGrid, bldUnits, unitByRingKey, bldArea, featureCountsByOption, size:RG };
}
let rasterizationCache = { layers:null, originX:null, originY:null, result:null };
function getRasterizedGrid(layers, options){
  if (rasterizationCache.layers !== layers ||
      rasterizationCache.originX !== gridOriginX || rasterizationCache.originY !== gridOriginY){
    rasterizationCache = {
      layers, originX:gridOriginX, originY:gridOriginY,
      result:rasterizeGrid(layers, options),
    };
  }
  return rasterizationCache.result;
}

/* =====================================================
   5. マップグリッド描画（隣接セルに応じたマップチップ選択）
   ===================================================== */
const cellHash = (x, y) => {
  const wx = gridOriginX + x, wy = gridOriginY + y;
  return ((wx * 7349 + wy * 9151 + TILE.x) % 97 + 97) % 97;
};

const cellCompositeCanvas = document.createElement('canvas');
const cellCompositeContext = cellCompositeCanvas.getContext('2d');
const CELL_RGBA_CACHE = new Map();
function solidCellRgba(color){
  if (CELL_RGBA_CACHE.has(color)) return CELL_RGBA_CACHE.get(color);
  const value = String(color).trim();
  const hex = value.startsWith('#') ? value.slice(1) : '';
  const expanded = hex.length === 3 ? hex.split('').map(part => part + part).join('') : hex;
  const rgba = /^[0-9a-f]{6}$/i.test(expanded)
    ? [
        Number.parseInt(expanded.slice(0, 2), 16),
        Number.parseInt(expanded.slice(2, 4), 16),
        Number.parseInt(expanded.slice(4, 6), 16),
        255,
      ]
    : [0, 0, 0, 255];
  CELL_RGBA_CACHE.set(color, rgba);
  return rgba;
}

function paintSolidMapCell(gx, gy, color, layer, stats){
  if (!color || !stats?.pixelData || gx < 0 || gy < 0 || gx >= stats.gridSize || gy >= stats.gridSize) return;
  const index = gy * stats.gridSize + gx;
  const pixelIndex = index * 4;
  const rgba = solidCellRgba(color);
  stats.pixelData[pixelIndex] = rgba[0];
  stats.pixelData[pixelIndex + 1] = rgba[1];
  stats.pixelData[pixelIndex + 2] = rgba[2];
  stats.pixelData[pixelIndex + 3] = rgba[3];
  stats.paintedCells++;
  if (!stats.occupiedMask[index]){
    stats.occupiedMask[index] = 1;
    stats.occupiedCells++;
  }
  stats.layerCells[layer] = (stats.layerCells[layer] || 0) + 1;
}

function paintLegacyCellBlock(gx, gy, color, layer, stats){
  const start = -Math.floor(CELL_DETAIL_SCALE / 2);
  for (let dy = 0; dy < CELL_DETAIL_SCALE; dy++)
    for (let dx = 0; dx < CELL_DETAIL_SCALE; dx++)
      paintSolidMapCell(gx + start + dx, gy + start + dy, color, layer, stats);
}

function flushSolidCellBuffer(stats){
  const size = stats.gridSize;
  if (cellCompositeCanvas.width !== size || cellCompositeCanvas.height !== size){
    cellCompositeCanvas.width = size;
    cellCompositeCanvas.height = size;
  }
  cellCompositeContext.putImageData(new ImageData(stats.pixelData, size, size), 0, 0);
  const originX = Math.round(gridShiftX / SCENE_PIXELS_PER_LOGICAL_PIXEL) * SCENE_PIXELS_PER_LOGICAL_PIXEL;
  const originY = Math.round(gridShiftY / SCENE_PIXELS_PER_LOGICAL_PIXEL) * SCENE_PIXELS_PER_LOGICAL_PIXEL;
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(cellCompositeCanvas, originX, originY, size * CPX, size * CPX);
  ctx.restore();
  stats.flushed = true;
}

function solidMapCellCenter(gx, gy){
  const originX = Math.round(gridShiftX / SCENE_PIXELS_PER_LOGICAL_PIXEL) * SCENE_PIXELS_PER_LOGICAL_PIXEL;
  const originY = Math.round(gridShiftY / SCENE_PIXELS_PER_LOGICAL_PIXEL) * SCENE_PIXELS_PER_LOGICAL_PIXEL;
  return [originX + (gx + .5) * CPX, originY + (gy + .5) * CPX];
}

const CELL_MAP_CHIP_CACHE = new Map();
const CELL_TEMPLATE_SIZE = STANDARD_CPX / CPX;
const positiveModulo = (value, divisor) => ((value % divisor) + divisor) % divisor;
const rgbKey = rgba => `${rgba[0]},${rgba[1]},${rgba[2]}`;
const rgbaHex = rgba => '#' + rgba.slice(0, 3).map(value => value.toString(16).padStart(2, '0')).join('');

function cellTemplateForCanvas(canvas, cacheKey, priorityColors = []){
  if (CELL_MAP_CHIP_CACHE.has(cacheKey)) return CELL_MAP_CHIP_CACHE.get(cacheKey);
  const source = canvas.getContext('2d', { willReadFrequently:true })
    .getImageData(0, 0, canvas.width, canvas.height).data;
  const cellsAcross = Math.ceil(canvas.width / CPX);
  const cellsDown = Math.ceil(canvas.height / CPX);
  const priority = new Set(priorityColors.map(color => rgbKey(solidCellRgba(color))));
  const colors = new Array(cellsAcross * cellsDown).fill(null);
  for (let cy = 0; cy < cellsDown; cy++){
    for (let cx = 0; cx < cellsAcross; cx++){
      const counts = new Map();
      for (let py = cy * CPX; py < Math.min(canvas.height, (cy + 1) * CPX); py++){
        for (let px = cx * CPX; px < Math.min(canvas.width, (cx + 1) * CPX); px++){
          const index = (py * canvas.width + px) * 4;
          if (source[index + 3] < 64) continue;
          const key = `${source[index]},${source[index + 1]},${source[index + 2]}`;
          counts.set(key, (counts.get(key) || 0) + 1);
        }
      }
      let selected = null, selectedCount = -1;
      for (const [key, count] of counts){
        if (priority.has(key) && count >= CPX * CPX * .25 && count > selectedCount){
          selected = key; selectedCount = count;
        }
      }
      if (!selected){
        for (const [key, count] of counts){
          if (count > selectedCount){ selected = key; selectedCount = count; }
        }
      }
      if (selected) colors[cy * cellsAcross + cx] = rgbaHex(selected.split(',').map(Number));
    }
  }
  const template = { colors, width:cellsAcross, height:cellsDown };
  CELL_MAP_CHIP_CACHE.set(cacheKey, template);
  return template;
}

function cellMapChipTemplate(name){
  const canvas = TILES[name];
  if (!canvas) return null;
  return cellTemplateForCanvas(canvas, `map-chip:${name}`, [P.outline, P.foam, P.rail, P.tie, P.win, GLYPH_WHITE]);
}

function worldFineCell(gx, gy){
  return [gridOriginX + gx, gridOriginY + gy];
}
function standardCellCoordinates(gx, gy){
  const [wx, wy] = worldFineCell(gx, gy);
  return [Math.floor(wx / CELL_DETAIL_SCALE), Math.floor(wy / CELL_DETAIL_SCALE)];
}
function standardCellHash(gx, gy){
  const [wx, wy] = standardCellCoordinates(gx, gy);
  return ((wx * 7349 + wy * 9151 + TILE.x) % 97 + 97) % 97;
}
function cellMapChipColor(name, gx, gy){
  const template = cellMapChipTemplate(name);
  if (!template) return null;
  const [wx, wy] = worldFineCell(gx, gy);
  const tx = positiveModulo(wx, template.width);
  const ty = positiveModulo(wy, template.height);
  return template.colors[ty * template.width + tx];
}

function surfaceChipName(id, gx, gy){
  const h = standardCellHash(gx, gy);
  if (id === ID.GRASS) return h < 5 ? 'tuft' : h < 8 ? 'flower' : h < 34 ? 'grass0' : h < 60 ? 'grass1' : 'grass2';
  if (id === ID.FOREST) return h < 48 ? 'forestBroad0' : h < 78 ? 'forestBroad1' : 'forestPine';
  if (id === ID.WOODS) return h < 35 ? 'woodsCopse0' : h < 70 ? 'woodsCopse1' : 'woodsOpen';
  if (id === ID.PARK) return h < 50 ? 'parkPocket0' : 'parkPocket1';
  if (id === ID.PARK_MEDIUM) return h < 30 ? 'parkTree' : h < 58 ? 'parkMeadow' : h < 74 ? 'parkFlower' : h < 86 ? 'bench' : 'lawn';
  if (id === ID.PARK_LARGE){
    const [wx, wy] = standardCellCoordinates(gx, gy);
    return positiveModulo(wx, 13) === 0 ? 'parkPromenadeV' : positiveModulo(wy, 11) === 0 ? 'parkPromenadeH'
      : h < 56 ? 'parkMeadow' : h < 76 ? 'parkGrove' : h < 86 ? 'parkGrandGarden' : 'lawn';
  }
  if (id === ID.DIRT) return 'dirt';
  if (id === ID.PAVE) return 'pave';
  if (id === ID.GRAVEL) return 'gravel';
  if (id === ID.FARM) return 'farm';
  if (id === ID.SAND) return 'sand';
  if (id === ID.ROCK) return 'rock';
  if (id === ID.WETLAND) return 'wetland';
  if (id === ID.ICE) return 'ice';
  if (id === ID.MEADOW) return 'meadow';
  if (id === ID.TERRAIN_OTHER) return 'terrainOther';
  if (id === ID.FIELD) return 'field';
  if (id === ID.WATER) return positiveModulo(standardCellCoordinates(gx, gy)[0] + standardCellCoordinates(gx, gy)[1], 2) ? 'water1' : 'water0';
  return null;
}

function cellSurfaceBoundary(grid, x, y, id){
  const RG = GRID + 2;
  const at = (x, y) => (x < 0 || y < 0 || x >= RG || y >= RG) ? ID.GRASS : grid[y * RG + x];
  const neighbors = [at(x-1,y), at(x+1,y), at(x,y-1), at(x,y+1)];
  const h = standardCellHash(x, y);
  if (id === ID.PARK_RESERVE)
    return neighbors.every(value => value === ID.PARK_RESERVE) ? null : (h % 3 ? P.treeDk : P.treeMd);
  if (id === ID.WATER && neighbors.some(value => value !== ID.WATER)) return P.foam;
  if (id === ID.FOREST && neighbors.some(value => value !== ID.FOREST)) return h % 4 ? P.forestDeep : P.forestLight;
  if (id === ID.WOODS && neighbors.some(value => value !== ID.WOODS)) return h % 4 ? P.woodsDeep : P.woodsLight;
  if (isPark(id) && neighbors.some(value => !isPark(value) && value !== ID.FOREST && value !== ID.WOODS))
    return h % 4 ? P.treeDk : P.treeMd;
  return undefined;
}

function drawCellPixelArtSurfaceGrid(grid, option, stats, transparent = true){
  const RG = GRID + 2;
  for (let y = 0; y < RG; y++){
    for (let x = 0; x < RG; x++){
      const id = grid[y * RG + x];
      if (transparent && id === ID.GRASS) continue;
      const boundary = cellSurfaceBoundary(grid, x, y, id);
      if (id === ID.PARK_RESERVE && boundary === null) continue;
      const chipName = surfaceChipName(id, x, y);
      const baseColor = CELL_COLOR_BY_OPTION[option] || CELL_COLOR_BY_ID.get(id);
      const chipColor = chipName ? cellMapChipColor(chipName, x, y) : null;
      const color = boundary || chipColor || baseColor;
      paintSolidMapCell(x, y, color, option, stats);
      if (boundary){ stats.boundaryCells++; continue; }
      if (chipColor && chipColor.toLowerCase() !== String(baseColor || '').toLowerCase()) stats.groundPatternCells++;
    }
  }
}

function paintDarkenedMapCell(gx, gy, factor, layer, stats){
  if (gx < 0 || gy < 0 || gx >= stats.gridSize || gy >= stats.gridSize) return;
  const pixelIndex = (gy * stats.gridSize + gx) * 4;
  if (!stats.pixelData[pixelIndex + 3]) return;
  const color = '#' + [0,1,2].map(offset => Math.round(stats.pixelData[pixelIndex + offset] * factor).toString(16).padStart(2,'0')).join('');
  paintSolidMapCell(gx, gy, color, layer, stats);
}

function drawCellPixelArtTransportGrid(grid, option, stats, centerGrid = null, bridge = false){
  const RG = GRID + 2;
  const has = (x, y) => x >= 0 && y >= 0 && x < RG && y < RG && grid[y * RG + x] !== ID.GRASS;
  const centered = (x, y) => centerGrid && x >= 0 && y >= 0 && x < RG && y < RG && centerGrid[y * RG + x];
  const tunnel = ['subway','roadTunnels','pathTunnels','railTunnels'].includes(option);
  const rail = ['rail','subway','railTunnels','aerialways'].includes(option);
  const roadStyle = SMOOTH_ROAD_STYLE[option];
  const minimumMinorRoute = STANDALONE_MINIMUM_MINOR_ROUTES &&
    ['localRoads','paths'].includes(option);
  const dashOn = (x, y, span = 8) => {
    const [wx, wy] = worldFineCell(x, y);
    return positiveModulo(wx + wy * 3, span) < Math.ceil(span / 2);
  };

  if (option === 'ferries'){
    for (let y = 0; y < RG; y++) for (let x = 0; x < RG; x++){
      if (!centered(x, y) || !dashOn(x, y, 10)) continue;
      paintSolidMapCell(x, y, P.foam, option, stats);
      stats.roadCenterCells++;
    }
    return;
  }

  const fill = roadStyle?.fill || (rail ? P.gravel : CELL_COLOR_BY_OPTION[option] || P.pave);
  const edge = bridge ? P.outline : roadStyle?.edge || (rail ? P.gravelDk : option === 'paths' ? P.trailDot : P.paveDk);
  for (let y = 0; y < RG; y++){
    for (let x = 0; x < RG; x++){
      if (!has(x, y) || (tunnel && !dashOn(x, y))) continue;
      const boundary = !has(x-1,y) || !has(x+1,y) || !has(x,y-1) || !has(x,y+1);
      const color = minimumMinorRoute
        ? (option === 'paths' ? P.trail : roadStyle.fill)
        : boundary ? edge : fill;
      paintSolidMapCell(x, y, color, option, stats);
      if (boundary && !minimumMinorRoute){
        if (rail) stats.boundaryCells++;
        else stats.roadCasingCells++;
      }
    }
  }

  if (rail){
    for (let y = 0; y < RG; y++) for (let x = 0; x < RG; x++){
      if (!centered(x, y) || (tunnel && !dashOn(x, y))) continue;
      const horizontal = centered(x-1,y) || centered(x+1,y);
      const vertical = centered(x,y-1) || centered(x,y+1);
      const useHorizontal = horizontal || !vertical;
      const [wx, wy] = worldFineCell(x, y);
      if (positiveModulo(useHorizontal ? wx : wy, 3) === 0){
        for (let d = -2; d <= 2; d++){
          const tx = useHorizontal ? x : x + d, ty = useHorizontal ? y + d : y;
          if (has(tx, ty)) paintSolidMapCell(tx, ty, P.tie, option, stats);
        }
        stats.railTieCells++;
      }
      for (const offset of [-1,1]){
        const rx = useHorizontal ? x : x + offset, ry = useHorizontal ? y + offset : y;
        if (has(rx, ry)) paintSolidMapCell(rx, ry, P.rail, option, stats);
      }
    }
    return;
  }

  if (roadStyle?.center){
    for (let y = 0; y < RG; y++) for (let x = 0; x < RG; x++){
      if (!centered(x, y) || (tunnel && !dashOn(x, y))) continue;
      const [wx, wy] = worldFineCell(x, y);
      const period = option === 'regionalRoads' ? 7 : 9;
      if (positiveModulo(wx + wy, period) >= Math.ceil(period * .55)) continue;
      paintSolidMapCell(x, y, roadStyle.center, option, stats);
      stats.roadCenterCells++;
    }
  } else if (centerGrid && ['paths','tracks','piers','transportationOther'].includes(option)){
    const detail = option === 'tracks' ? P.gravelDk : option === 'paths' ? P.trail : P.pave;
    for (let y = 0; y < RG; y++) for (let x = 0; x < RG; x++){
      if (!centered(x, y) || (tunnel && !dashOn(x, y))) continue;
      paintSolidMapCell(x, y, detail, option, stats);
      stats.roadCenterCells++;
    }
  }
}

function drawCellPixelArtBuildingGrid(grid, bldGrid, buildingKinds, buildingDescs, buildingAnchors, layer, stats){
  const RG = GRID + 2;
  const isCell = (x, y) => x >= 0 && y >= 0 && x < RG && y < RG && grid[y * RG + x] === ID.BLD;
  const southEdges = new Map();
  for (let y = 1; y < RG; y++) for (let x = 0; x < RG; x++){
    if (!isCell(x, y) && isCell(x, y - 1)){
      paintDarkenedMapCell(x, y, .68, `${layer}:shadow`, stats);
      stats.buildingDetailCells++;
    }
  }
  for (let y = 0; y < RG; y++){
    for (let x = 0; x < RG; x++){
      const index = y * RG + x;
      if (grid[index] !== ID.BLD) continue;
      const buildingIndex = bldGrid[index];
      const desc = buildingDescs[buildingIndex];
      const kind = buildingKinds[buildingIndex] || 'normal';
      const pal = desc?.pal || ROOFPAL[0];
      const same = (nx, ny) => isCell(nx, ny) && bldGrid[ny * RG + nx] === buildingIndex;
      const above = same(x, y-1), below = same(x, y+1), left = same(x-1,y), right = same(x+1,y);
      const [wx, wy] = worldFineCell(x, y);
      let color = pal[0];
      if (!below){
        color = above ? P.wall : pal[1];
        if (above && positiveModulo(wx, 4) === 1) color = P.win;
      } else if (!above) color = pal[2];
      else if ((!left || !right) && positiveModulo(wy, 3) !== 1) color = P.outline;
      else if (positiveModulo(wx * 3 + wy * 5 + buildingIndex, 17) === 0) color = pal[1];
      paintSolidMapCell(x, y, color, layer, stats);
      if (color !== pal[0]) stats.buildingDetailCells++;
      if (!below){
        const edge = southEdges.get(buildingIndex);
        if (!edge || y > edge.y) southEdges.set(buildingIndex, { y, minX:x, maxX:x });
        else if (y === edge.y){ edge.minX = Math.min(edge.minX, x); edge.maxX = Math.max(edge.maxX, x); }
      }
    }
  }

  const paintIfBuilding = (bi, x, y, color) => {
    if (x < 0 || y < 0 || x >= RG || y >= RG || bldGrid[y * RG + x] !== bi || grid[y * RG + x] !== ID.BLD) return;
    paintSolidMapCell(x, y, color, `${layer}:details`, stats);
    stats.buildingDetailCells++;
  };
  for (let bi = 1; bi < buildingKinds.length; bi++){
    const anchor = buildingAnchors?.[bi];
    const desc = buildingDescs[bi];
    const kind = buildingKinds[bi] || 'normal';
    if (!anchor){
      const edge = southEdges.get(bi);
      if (edge) paintIfBuilding(bi, Math.round((edge.minX + edge.maxX) / 2), edge.y, P.door);
      continue;
    }
    const accent = desc?.accent || desc?.pal?.[0] || P.roofA;
    if (kind === 'hospital'){
      for (const [dx,dy] of [[0,-2],[0,-1],[-2,0],[-1,0],[0,0],[1,0],[2,0],[0,1],[0,2]])
        paintIfBuilding(bi, anchor.gx + dx, anchor.gy + dy, dx === 0 && dy === 0 ? GLYPH_WHITE : '#48a050');
    } else if (kind === 'convenience'){
      ['#48a058','#f8d038','#5078d8'].forEach((color, row) => {
        for (let dx = -3; dx <= 3; dx++) paintIfBuilding(bi, anchor.gx + dx, anchor.gy + row, color);
      });
    } else if (kind === 'mixed'){
      ['#e05038','#f8d038','#5078d8'].forEach((color, column) =>
        paintIfBuilding(bi, anchor.ex - 1 + column, anchor.ey, color));
    } else if (kind === 'poi' && desc?.glyph){
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++)
        paintIfBuilding(bi, anchor.gx + dx, anchor.gy + dy, dx === 0 || dy === 0 ? GLYPH_WHITE : accent);
    }
    paintIfBuilding(bi, anchor.ex, anchor.ey, P.door);
  }
}

function drawGrid(grid, bldGrid, bldStyle, options, transparent = false, drawContext = ctx){
  const ctx = drawContext;
  const RG = GRID + 2;
  const at = (x, y) => (x < 0 || y < 0 || x >= RG || y >= RG) ? ID.GRASS : grid[y * RG + x];
  const bAt = (x, y) => (x < 0 || y < 0 || x >= RG || y >= RG) ? 0 : bldGrid[y * RG + x];
  const put = (name, x, y) => ctx.drawImage(TILES[name], gridShiftX + x * CPX, gridShiftY + y * CPX);
  const putC = (canvas, x, y) => ctx.drawImage(canvas, gridShiftX + x * CPX, gridShiftY + y * CPX);
  const edge = (x, y, dir, color, t = 2) => {
    ctx.fillStyle = color;
    const px = gridShiftX + x * CPX, py = gridShiftY + y * CPX;
    if (dir === 'L') ctx.fillRect(px, py, t, CPX);
    if (dir === 'R') ctx.fillRect(px + CPX - t, py, t, CPX);
    if (dir === 'U') ctx.fillRect(px, py, CPX, t);
    if (dir === 'D') ctx.fillRect(px, py + CPX - t, CPX, t);
  };
  const drawJaggedPath = (x, y) => {
    const bx = gridShiftX + x * CPX, by = gridShiftY + y * CPX;
    const connected = {
      L:at(x-1,y) === ID.PATH, R:at(x+1,y) === ID.PATH,
      U:at(x,y-1) === ID.PATH, D:at(x,y+1) === ID.PATH,
    };
    if (!connected.L && !connected.R && !connected.U && !connected.D) connected.L = connected.R = true;
    if (STANDALONE_MINIMUM_MINOR_ROUTES){
      const lineWidth = MINIMUM_ROUTE_SCENE_WIDTH;
      const center = Math.floor(CPX / (2 * lineWidth)) * lineWidth;
      ctx.fillStyle = P.trail;
      if (connected.L) ctx.fillRect(bx, by + center, center + lineWidth, lineWidth);
      if (connected.R) ctx.fillRect(bx + center, by + center, CPX - center, lineWidth);
      if (connected.U) ctx.fillRect(bx + center, by, lineWidth, center + lineWidth);
      if (connected.D) ctx.fillRect(bx + center, by + center, lineWidth, CPX - center);
      ctx.fillRect(bx + center, by + center, lineWidth, lineWidth);
      return;
    }
    const seed = cellHash(x * 5 + 3, y * 7 + 1);
    const wiggle = (step, salt) => ((seed + step * 17 + salt * 29) % 3) - 1;
    const segments = [];
    const horizontal = (from, to, salt) => {
      for (let sx = from; sx <= to; sx += 2){
        const endpoint = sx === from || sx === to;
        segments.push({ x:sx, y:7 + (endpoint ? 0 : wiggle(sx, salt)), vertical:false });
      }
    };
    const vertical = (from, to, salt) => {
      for (let sy = from; sy <= to; sy += 2){
        const endpoint = sy === from || sy === to;
        segments.push({ x:7 + (endpoint ? 0 : wiggle(sy, salt)), y:sy, vertical:true });
      }
    };
    if (connected.L) horizontal(0,8,1);
    if (connected.R) horizontal(8,14,2);
    if (connected.U) vertical(0,8,3);
    if (connected.D) vertical(8,14,4);
    ctx.fillStyle = P.trailDot;
    for (const s of segments) ctx.fillRect(bx + s.x - (s.vertical ? 2 : 0), by + s.y - (s.vertical ? 0 : 2), s.vertical ? 6 : 4, s.vertical ? 4 : 6);
    ctx.fillRect(bx + 4, by + 4, 8, 8);
    ctx.fillStyle = P.trail;
    for (const s of segments) ctx.fillRect(bx + s.x - (s.vertical ? 1 : 0), by + s.y - (s.vertical ? 0 : 1), 4, 4);
    ctx.fillRect(bx + 5, by + 5, 6, 6);
  };
  const drawCanonicalTransportCell = (x,y,id) => {
    if(EMBEDDED) return false;
    const option=options.routeOption;
    const rule=CANONICAL_TRANSPORT_RULES[option];
    if(!rule || !['cell','rail-cell'].includes(rule.renderer)) return false;
    const same=(nx,ny)=>at(nx,ny)===id;
    return LAYER_ASSET_CATALOG.drawStandardTransportCell(
      ctx,option,gridShiftX+x*CPX,gridShiftY+y*CPX,
      {L:same(x-1,y),R:same(x+1,y),U:same(x,y-1),D:same(x,y+1)},
      {scale:SCENE_PIXELS_PER_LOGICAL_PIXEL,dashOff:rule.dashed && cellHash(x,y)%3===0},
    );
  };

  for (let y = 0; y < RG; y++){
    for (let x = 0; x < RG; x++){
      const id = at(x, y), h = cellHash(x, y);
      switch (id){
        case ID.GRASS: {
          if (transparent) break;
          if (!options.grass) put('grassPlain', x, y);
          else if (h < 5) put('tuft', x, y);
          else if (h < 8) put('flower', x, y);
          else if (h < 34) put('grass0', x, y);
          else if (h < 60) put('grass1', x, y);
          else put('grass2', x, y);
          break;
        }
        case ID.FOREST: put(h < 52 ? 'forestBroad0' : h < 82 ? 'forestBroad1' : 'forestPine', x, y); break;
        case ID.WOODS: put(h < 38 ? 'woodsCopse0' : h < 76 ? 'woodsCopse1' : 'woodsOpen', x, y); break;
        case ID.PARK:
        case ID.PARK_MEDIUM:
        case ID.PARK_LARGE: {
          if (h < 34) put('parkTree', x, y);              // 木を主役に
          else if (h < 40) put('parkFlower', x, y);
          else if (h < 43) put('bench', x, y);
          else put('lawn', x, y);
          // 公園のふちに生け垣
          for (const [d, nx, ny] of [['L',x-1,y],['R',x+1,y],['U',x,y-1],['D',x,y+1]]){
            const n = at(nx, ny);
            if (!isPark(n) && n !== ID.FOREST && n !== ID.WOODS){
              edge(x, y, d, P.treeDk, 4);
              edge(x, y, d, P.treeMd, 2);
            }
          }
          break;
        }
        case ID.DIRT: put('dirt', x, y); break;
        case ID.PAVE: put('pave', x, y); break;
        case ID.GRAVEL: put('gravel', x, y); break;
        case ID.FARM: put('farm', x, y); break;
        case ID.SAND: put('sand', x, y); break;
        case ID.ROCK: put('rock', x, y); break;
        case ID.WETLAND: put('wetland', x, y); break;
        case ID.ICE: put('ice', x, y); break;
        case ID.MEADOW: put('meadow', x, y); break;
        case ID.TERRAIN_OTHER: put('terrainOther', x, y); break;
        case ID.FIELD: put('field', x, y); break;
        case ID.WATER: {
          put((x + y) % 2 ? 'water1' : 'water0', x, y);
          for (const [d, nx, ny] of [['L',x-1,y],['R',x+1,y],['U',x,y-1],['D',x,y+1]])
            if (at(nx, ny) !== ID.WATER) edge(x, y, d, P.foam, 2);
          break;
        }
        case ID.PATH:
          if (drawCanonicalTransportCell(x,y,id)) break;
          if (options.routeOption === 'paths') drawJaggedPath(x, y);
          else put('path', x, y);
          break;
        case ID.ROAD:
        case ID.ROAD_MAJOR:
        case ID.HIGHWAY: {
          if (drawCanonicalTransportCell(x,y,id)) break;
          put(id === ID.HIGHWAY ? 'highway' : id === ID.ROAD_MAJOR ? 'roadMajor' : 'road', x, y);
          if (id !== ID.ROAD){
            const bx = gridShiftX + x * CPX, by = gridShiftY + y * CPX;
            const lineCol = id === ID.HIGHWAY ? '#e8b840' : '#f8f0d8';
            ctx.fillStyle = lineCol;
            const lr = isRoad(at(x-1,y)) || isRoad(at(x+1,y));
            const ud = isRoad(at(x,y-1)) || isRoad(at(x,y+1));
            if (lr){ ctx.fillRect(bx+1,by+7,5,2); ctx.fillRect(bx+10,by+7,5,2); }
            if (ud){ ctx.fillRect(bx+7,by+1,2,5); ctx.fillRect(bx+7,by+10,2,5); }
          }
          if (!['regionalRoads','majorRoads'].includes(options.routeOption)){
            for (const [d, nx, ny] of [['L',x-1,y],['R',x+1,y],['U',x,y-1],['D',x,y+1]]){
              const n = at(nx, ny);
              if (!isRoad(n) && n !== ID.PAVE) edge(x, y, d, id === ID.HIGHWAY ? '#a89058' : P.roadDk, 2);
            }
          }
          break;
        }
        case ID.RAIL: {
          if (drawCanonicalTransportCell(x,y,id)) break;
          put('gravel', x, y);
          const con = {
            L: at(x-1, y) === ID.RAIL, R: at(x+1, y) === ID.RAIL,
            U: at(x, y-1) === ID.RAIL, D: at(x, y+1) === ID.RAIL,
          };
          if (!con.L && !con.R && !con.U && !con.D){ con.L = con.R = true; }
          const bx = gridShiftX + x * CPX, by = gridShiftY + y * CPX;
          const R = (rx, ry, rw, rh) => { ctx.fillStyle = P.rail; ctx.fillRect(bx+rx, by+ry, rw, rh); };
          const TIE = (rx, ry, rw, rh) => { ctx.fillStyle = P.tie; ctx.fillRect(bx+rx, by+ry, rw, rh); };
          if (con.L) TIE(2, 3, 2, 10);
          if (con.R) TIE(12, 3, 2, 10);
          if (con.U) TIE(3, 2, 10, 2);
          if (con.D) TIE(3, 12, 10, 2);
          if (con.L){ R(0, 4, 12, 2); R(0, 10, 12, 2); }
          if (con.R){ R(4, 4, 12, 2); R(4, 10, 12, 2); }
          if (con.U){ R(4, 0, 2, 12); R(10, 0, 2, 12); }
          if (con.D){ R(4, 4, 2, 12); R(10, 4, 2, 12); }
          break;
        }
        case ID.BLD: {
          const bi = bAt(x, y);
          const desc = options.buildingDescs?.[bi] || null;
          const st = desc ? desc.styleIndex : (bldStyle[bi] || 0);
          const pal = desc ? desc.pal : ROOFPAL[st];
          const kind = options.buildingKinds?.[bi] || 'normal';
          const anchor = options.buildingAnchors?.[bi] || null;
          // 病院・コンビニ・雑居は専用オーバーレイが用途を語るため、
          // カテゴリ色の庇・屋上マークは kind==='poi' の施設建物にだけ使う
          const accent = desc && kind === 'poi' ? desc.accent : null;
          const same = (nx, ny) => at(nx, ny) === ID.BLD && bAt(nx, ny) === bi;
          const above = same(x, y - 1), below = same(x, y + 1);
          const right = same(x + 1, y), left = same(x - 1, y);
          const isHouse = desc ? desc.isHouse : (st <= 5 || st === 9);
          const towerWall = desc ? desc.wallKey === 'tower' : (st === 6 || st === 7);
          const bx = gridShiftX + x * CPX, by = gridShiftY + y * CPX;
          const isEntrance = Boolean(anchor && accent && anchor.ex === x && anchor.ey === y && !below);
          if (!below && isHouse){
            // 低層建物の南面には窓と玄関を出し、塊ではなく家として読めるようにする
            if (isEntrance) putC(entranceTileFor(desc.glyph, accent, true), x, y);
            else put((!right ? 'frontDoor' : 'front') + st, x, y);
          } else if (!below && above){
            // 2セル以上の高さがある建物の最下段は壁面。施設はカテゴリ色の庇つき店先にする
            if (isEntrance) putC(entranceTileFor(desc.glyph, accent, true), x, y);
            else if (accent) putC(entranceTileFor(desc.glyph, accent, false), x, y);
            else if (towerWall) put('wallTower', x, y);
            else if (h % 3 === 2) put('wallPlain', x, y);
            else put('wallWin', x, y);
          } else {
            if (desc) putC(roofTileFor(desc), x, y);
            else put('roof' + st, x, y);
            if (!above) edge(x, y, 'U', accent || pal[2], 2);
            // 屋根の書き込み（世界座標アンカーで決定的）
            const hh = cellHash(x * 3 + 1, y * 5 + 2);
            const motif = desc ? desc.motif : (isHouse ? 'gable' : st === 7 ? 'aviation' : 'ac');
            if (motif === 'gable'){
              const parity = (((gridOriginX + x + gridOriginY + y) % 2) + 2) % 2;
              ctx.fillStyle = pal[1];                        // 瓦の継ぎ目（半セルずらし）
              ctx.fillRect(bx + (parity ? 4 : 10), by + 5, 1, 3);
              ctx.fillRect(bx + (parity ? 11 : 5), by + 10, 1, 3);
              if (hh < 6){                                   // テレビアンテナ
                ctx.fillStyle = P.outline;
                ctx.fillRect(bx + 11, by + 4, 1, 5);
                ctx.fillRect(bx + 9,  by + 4, 5, 1);
              } else if (hh < 10){                           // 天窓
                ctx.fillStyle = pal[2];
                ctx.fillRect(bx + 6, by + 5, 4, 3);
                ctx.fillStyle = P.win;
                ctx.fillRect(bx + 7, by + 6, 2, 1);
              }
            } else if (motif === 'tank' && !above && !left){ // 給水タンクは北西角に固定
              ctx.fillStyle = pal[1]; ctx.fillRect(bx + 2, by + 3, 5, 5);
              ctx.fillStyle = pal[2]; ctx.fillRect(bx + 2, by + 3, 5, 1);
              ctx.fillStyle = P.outline;
              ctx.fillRect(bx + 3, by + 8, 1, 2); ctx.fillRect(bx + 5, by + 8, 1, 2);
            } else if (motif === 'aviation' && !above && !right){ // 航空灯は北東角に固定
              ctx.fillStyle = '#f05038'; ctx.fillRect(bx + 11, by + 2, 2, 2);
              ctx.fillStyle = '#f8b0a0'; ctx.fillRect(bx + 11, by + 1, 2, 1);
            } else if ((motif === 'ac' || motif === 'hvac') && hh < 12){ // 追加の室外機
              ctx.fillStyle = pal[1]; ctx.fillRect(bx + 6, by + 6, 4, 4);
              ctx.fillStyle = pal[2]; ctx.fillRect(bx + 7, by + 7, 2, 1);
            }
          }
          // 屋上のカテゴリマーク（施設のワールド座標にアンカーし、パンで動かない）
          if (anchor && accent && desc.glyph && anchor.gx === x && anchor.gy === y){
            if (isEntrance){                                 // 1セルの棟は玄関の上に小型の袖看板
              ctx.fillStyle = P.outline; ctx.fillRect(bx + 8, by + 1, 7, 7);
              ctx.fillStyle = accent;    ctx.fillRect(bx + 9, by + 2, 5, 5);
              ctx.fillStyle = GLYPH_WHITE; ctx.fillRect(bx + 11, by + 4, 2, 2);
            } else {
              putC(glyphTileFor(desc.glyph, accent), x, y);
            }
          }
          // POIを内包する建物は、屋根・店先の記号で用途を直接読めるようにする。
          if (kind === 'hospital'){
            if (!above){
              ctx.fillStyle = '#48a050';
              ctx.fillRect(bx + 7, by + 3, 3, 10);
              ctx.fillRect(bx + 3, by + 7, 11, 3);
            }
            if (!below){
              ctx.fillStyle = '#f8f8f0'; ctx.fillRect(bx + 2, by + 11, 12, 4);
              ctx.fillStyle = '#48a050'; ctx.fillRect(bx + 7, by + 11, 2, 4);
            }
          } else if (kind === 'convenience'){
            if (!above){
              ctx.fillStyle = '#48a058'; ctx.fillRect(bx + 1, by + 3, 14, 2);
              ctx.fillStyle = '#f8d038'; ctx.fillRect(bx + 1, by + 5, 14, 2);
              ctx.fillStyle = '#5078d8'; ctx.fillRect(bx + 1, by + 7, 14, 2);
            }
            if (!below){
              ctx.fillStyle = '#f8f8f0'; ctx.fillRect(bx + 2, by + 10, 12, 5);
              ctx.fillStyle = '#5078d8'; ctx.fillRect(bx + 3, by + 11, 4, 3);
              ctx.fillRect(bx + 9, by + 11, 4, 3);
            }
          } else if (kind === 'mixed'){
            if (!below){
              const signs = ['#e05038','#f8d038','#5078d8'];
              signs.forEach((color, i) => {
                ctx.fillStyle = color;
                ctx.fillRect(bx + 2 + i * 4, by + 10, 3, 4);
              });
            }
            if (!above && !right){
              ctx.fillStyle = P.outline; ctx.fillRect(bx + 8, by + 1, 7, 6);
              ctx.fillStyle = '#f8d038'; ctx.fillRect(bx + 9, by + 2, 5, 2);
              ctx.fillStyle = '#e05038'; ctx.fillRect(bx + 9, by + 4, 5, 2);
            }
          }
          for (const [d, nx, ny] of [['L',x-1,y],['R',x+1,y],['U',x,y-1],['D',x,y+1]]){
            const n = at(nx, ny);
            if (!isBld(n)) edge(x, y, d, P.outline, 1);              // 輪郭は地面と接する辺だけ
            else if (bAt(nx, ny) !== bi) edge(x, y, d, pal[1], 1);   // 棟同士は淡い影
          }
          break;
        }
      }
      // 建物の南側に落ちる影（ドット絵らしい奥行き）
      if (id !== ID.BLD && at(x, y - 1) === ID.BLD){
        ctx.fillStyle = 'rgba(24,32,20,.28)';
        ctx.fillRect(gridShiftX + x * CPX, gridShiftY + y * CPX, CPX, 4);
      }
    }
  }
}

   単体標準ページ: 1論理px建物意味マスク
