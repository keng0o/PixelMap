<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#181820">
<title>PixelMap｜POIアセット一覧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/catalog.css">
</head>
<body>
  <header class="hero">
    <a class="back-link" href="index.html" aria-label="マップへ戻る">← MAP</a>
    <p class="eyebrow">PIXELMAP / LIVE POI ASSETS</p>
    <h1>POIアセット一覧</h1>
    <p class="lede">現在のマップでPOIの描画に使用しているアセットだけを掲載しています。<br>カードには対応するPOI属性とサイズ展開を表示します。</p>
    <div class="hero-stats" aria-label="アセット統計">
      <div><strong id="totalCount">26</strong><span>POI ASSETS</span></div>
      <div><strong id="categoryCount">10</strong><span>CATEGORIES</span></div>
      <div><strong>16</strong><span>PX / MAP TILE</span></div>
    </div>
  </header>

  <main>
    <section class="controls" aria-label="アセットの絞り込み">
      <label class="search">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="名前・ID・POI属性で検索" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <div id="filters" class="filters" role="group" aria-label="カテゴリ"></div>
    </section>

    <div class="result-line" aria-live="polite">
      <span><b id="resultCount">26</b> 個を表示</span>
      <span>MAPで使用中のアセットのみ</span>
    </div>

    <section id="assetGrid" class="asset-grid" aria-label="POIアセット一覧"></section>
    <p id="emptyState" class="empty" hidden>条件に合うアセットがありません。</p>
  </main>

  <footer>
    <span>26 LIVE POI ASSETS</span>
    <span>UNMAPPED POI → GENERIC</span>
  </footer>

  <script src="assets/facility-resolver.js"></script>
  <script src="assets/poi-sprites.js"></script>
  <script src="assets/catalog.js"></script>
</body>
</html>
