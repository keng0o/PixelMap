<!doctype html>
<html lang="ja" data-style-id="illustrated-landscape-v1" data-map-ready="0">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e1e2be">
  <title>彩色ゲーム地図 — PixelMap test</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: light; font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; background: #e1e2be; color: #4a4c38; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { position: fixed; inset: 0; }
    canvas { display: block; width: 100vw; height: 100dvh; touch-action: none; cursor: grab; }
    canvas.is-dragging { cursor: grabbing; }
    button { color: #4a4c38; font: inherit; cursor: pointer; }
    [data-current-location] { position: fixed; right: calc(16px + env(safe-area-inset-right)); bottom: calc(24px + env(safe-area-inset-bottom));
      width: 46px; height: 46px; border-radius: 50%; border: 1px solid #797c62; background: #f4efda; box-shadow: 0 2px 5px #60664c24;
      display: grid; place-items: center; }
    [data-current-location] svg { width: 23px; height: 23px; }
    button:disabled { opacity: .5; }
    button:focus-visible, a:focus-visible { outline: 3px solid #698d90; outline-offset: 3px; }
    [data-map-status] { position: fixed; top: calc(18px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
      max-width: min(90vw, 440px); padding: 10px 14px; border: 1px solid #b5b699; border-radius: 5px; background: #f4efda; font-size: 12px; line-height: 1.6; }
    [data-map-retry] { min-height: 44px; margin-left: 8px; background: transparent; border: 0; text-decoration: underline; }
    [data-fixture-label] { position: fixed; top: 14px; left: 14px; padding: 7px 10px; background: #f4efda; border: 1px solid #b5b699; font-size: 11px; }
    .attribution { position: fixed; bottom: calc(5px + env(safe-area-inset-bottom)); left: calc(7px + env(safe-area-inset-left)); font-size: 9px; color: #656b53; background: #e1e2bed9; padding: 2px 4px; }
    .attribution a { color: inherit; }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <canvas data-illustrated-map aria-label="実地理を真上から彩色した地図。ドラッグで移動できます"></canvas>
  <div data-fixture-label hidden>構成見本 · 架空の地形</div>
  <aside data-map-status role="status" aria-live="polite" hidden><span data-map-message></span><button data-map-retry hidden>再試行</button></aside>
  <button data-current-location aria-label="現在地へ移動"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg></button>

  <script src="../assets/top-down-game-map.js?v=semantic-miniature-1"></script>
  <script src="../assets/illustrated-landscape-geometry.js?v=1"></script>
  <script src="../assets/illustrated-landscape-renderer.js?v=1"></script>
  <script src="../assets/illustrated-landscape-fixture.js?v=1"></script>
  <script src="../assets/illustrated-landscape-map.js?v=1"></script>
</body>
</html>
