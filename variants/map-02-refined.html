  const resolvedSpriteKey = assetBinding.assetId;
  const spriteKey = resolvedSpriteKey === 'generic' && POI_ASSETS_BY_ID.has(renderClass)
    ? renderClass : resolvedSpriteKey;
  const collisionGeometry = RESOLVER.assetCollisionGeometry(
    POI_SPRITE_CATALOG,spriteKey,size,ACTIVE_PATTERN,category,assetCount);
  const [worldX, worldY] = landmarkWorldPoint(coordinate);
  return {
    key:`landmark:${props.id || feature.id}`,
    name:featureName(entityProps),
    props:entityProps,
    sourcePoiIds:[String(props.id || feature.id)],
    buildingId:null,
    facilityRole:props.role === 'complex' ? 'landmark_complex' : 'signature_venue',
    category,
    assetPack:assetBinding.packId,
    assetFamily:assetBinding.familyId,
    assetVariant:assetBinding.variantId,
    assetMatchedType:assetBinding.matchedType,
    assetFallback:assetBinding.fallback,
    spriteKey,
    variant:0,
    importance:1,
    rank:Number(props.rank ?? 1),
    metrics:{
      area:landmarkAreaCells(props.area_m2, coordinate[1]),
      height:Number(props.height_m || 0),
      kind:'poi',
    },
    size,
    assetCount,
    visualScale,
    ...collisionGeometry,
    selectionPriority:props.role === 'complex' ? 35 : 25,
    sourceWorldX:worldX,
    sourceWorldY:worldY,
    worldX,
    worldY,
    anchorMode:'source-point',
    representation:'icon',
    selectionReason:'landmark-guaranteed',
    landmarkEntity:true,
    landmarkEntityId:String(props.id || feature.id),
    parentId:props.parent_id || null,
    anchorCoordinate:coordinate,
  };
}
function landmarkFacilitiesCollide(a, b){
  return RESOLVER.facilitiesCollide(a,b,ACTIVE_PATTERN);
}
function applyStandaloneLandmarks(resolvedView){
  if (!STANDALONE_LANDMARK_MODE || !landmarkFeatureCollection || !LANDMARK_ENTITY_API)
    return { ...resolvedView, landmarks:{ enabled:false, state:landmarkLoadState, selected:[] } };

  const selection = LANDMARK_ENTITY_API.selectForZoom(landmarkFeatureCollection, TILE.z);
  const range = viewTileRange(W);
  const anchorInContext = feature => {
    const coordinate = LANDMARK_ENTITY_API.anchorOf(feature);
    if (!coordinate) return false;
    const [worldX, worldY] = landmarkWorldPoint(coordinate);
    const tileX = Math.floor(worldX / W), tileY = Math.floor(worldY / H);
    return tileX >= range.minX - 1 && tileX <= range.maxX + 1 &&
      tileY >= range.minY - 1 && tileY <= range.maxY + 1;
  };
  const contextParentIds = new Set(selection.features.filter(anchorInContext).map(feature =>
    feature.properties.role === 'complex'
      ? LANDMARK_ENTITY_API.featureId(feature)
      : feature.properties.parent_id).filter(Boolean));
  const selectedFeatures = selection.features.filter(feature =>
    feature.properties.role === 'complex'
      ? contextParentIds.has(LANDMARK_ENTITY_API.featureId(feature))
      : contextParentIds.has(feature.properties.parent_id) || anchorInContext(feature));
  if (!selectedFeatures.length)
    return { ...resolvedView, landmarks:{ enabled:true, state:landmarkLoadState, selected:[] } };

  const selectedParentIds = new Set(selectedFeatures
    .filter(feature => feature.properties.role === 'complex')
    .map(LANDMARK_ENTITY_API.featureId));
  const parentFeatures = selection.collection.features.filter(feature =>
    selectedParentIds.has(LANDMARK_ENTITY_API.featureId(feature)));
  const selectedNames = new Set(selectedFeatures.flatMap(LANDMARK_ENTITY_API.comparableNames));
  const facilities = resolvedView.facilities.map(facility => ({ ...facility }));
  const suppressedKeys = new Set();

  // 親敷地内の通常テナントは概要ズームでは代表施設へ畳み込む。
  // 駅だけは保護し、通常POIの代表選択でランドマークを消さない。
  for (const facility of facilities){
    if (isStationProps(facility.props)) continue;
    const coordinate = coordinatesFromWorldPoint(facility.worldX, facility.worldY);
    const insideOverviewComplex = parentFeatures.some(parent =>
      TILE.z < Number(parent.properties.detail_zoom ?? 16) &&
      LANDMARK_ENTITY_API.geometryContains(parent.geometry, coordinate));
    const duplicateName = selectedNames.has(normalizedLandmarkName(featureName(facility.props)));
    if (!insideOverviewComplex && !duplicateName) continue;
    facility.representation = 'hidden';
    facility.selectionReason = insideOverviewComplex ? 'landmark-member' : 'landmark-duplicate';
    suppressedKeys.add(facility.key);
  }

  // ランドマークも正本のsource pointへ固定する。衝突時に候補点へ動かさず、
  // 下位の通常施設をdot/hiddenへ落とすことで座標と世界形状を不変に保つ。
  const occupied = facilities.filter(facility =>
    facility.representation === 'icon' && isStationProps(facility.props));
  const landmarkFacilities = [];
  const placementOrder = selectedFeatures.slice().sort((a, b) =>
    Number(a.properties.role === 'complex') - Number(b.properties.role === 'complex') ||
    LANDMARK_ENTITY_API.featureId(a).localeCompare(LANDMARK_ENTITY_API.featureId(b)));
  for (const feature of placementOrder){
    const coordinate=LANDMARK_ENTITY_API.anchorOf(feature);
    if (!coordinate) continue;
    const facility=makeLandmarkFacility(feature,coordinate);
    const blocker=occupied.find(other => landmarkFacilitiesCollide(facility,other));
    if (blocker){
      facility.representation='dot';
      facility.selectionReason=`collision:${blocker.key}`;
    } else {
      occupied.push(facility);
    }
    landmarkFacilities.push(facility);
  }

  // ランドマークと衝突する通常施設はhiddenへ退かす。駅は常に残す。
  for (const facility of facilities){
    if (facility.representation === 'hidden' || isStationProps(facility.props)) continue;
    if (!landmarkFacilities.some(landmark =>
      landmark.representation === 'icon' && landmarkFacilitiesCollide(facility, landmark))) continue;
    facility.representation = 'hidden';
    facility.selectionReason = 'landmark-collision';
    suppressedKeys.add(facility.key);
  }

  // 抑制対象を含む既存クラスターは解体し、敷地外の残りだけdotへ戻す。
  const affectedClusterIds = new Set(facilities
    .filter(facility => suppressedKeys.has(facility.key) && facility.clusterId)
    .map(facility => facility.clusterId));
  for (const facility of facilities){
    if (!facility.clusterId || !affectedClusterIds.has(facility.clusterId) || suppressedKeys.has(facility.key)) continue;
    facility.representation = 'dot';
    facility.selectionReason = 'landmark-cluster-split';
    delete facility.clusterId;
  }
  const clusters = resolvedView.clusters.filter(cluster => {
    if (affectedClusterIds.has(cluster.clusterId)) return false;
    const coordinate = coordinatesFromWorldPoint(cluster.worldX, cluster.worldY);
    return !parentFeatures.some(parent => LANDMARK_ENTITY_API.geometryContains(parent.geometry, coordinate));
  });

  return {
    ...resolvedView,
    facilities:[...facilities, ...landmarkFacilities],
    clusters,
    landmarks:{
      enabled:true,
      state:landmarkLoadState,
      algorithmVersion:selection.algorithmVersion,
      scope:landmarkFeatureCollection.properties?.scope || null,
      overridesSchema:landmarkFeatureCollection.properties?.overrides_schema || null,
      selected:landmarkFacilities.map(facility => ({
        id:facility.landmarkEntityId,
        name:facility.name,
        role:facility.facilityRole,
        sprite:facility.spriteKey,
        representation:facility.representation,
        anchor:facility.anchorCoordinate,
      })),
      suppressed:suppressedKeys.size,
    },
  };
}

function drawCurrentLocation(){
  const pt = locationCanvasPoint();
  if (!pt) return;
  const [x, y] = pt;
  if (x < -200 || y < -200 || x > W + 200 || y > H + 200) return;

  const metersPerTile = 40075016.686 * Math.cos(currentLocation.latitude * Math.PI / 180) / (2 ** TILE.z);
  const radius = Math.max(18, Math.min(180, currentLocation.accuracy / metersPerTile * W));
  ctx.save();
  ctx.fillStyle = 'rgba(72,144,224,.18)';
  ctx.strokeStyle = 'rgba(248,240,216,.9)';
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.restore();

  px(Math.round(x) - 11, Math.round(y) - 11, 22, 22, OUT);
  px(Math.round(x) - 8, Math.round(y) - 8, 16, 16, '#4890e0');
  px(Math.round(x) - 3, Math.round(y) - 3, 6, 6, '#f8f0d8');
  hitAreas.push({
    x:x - 18, y:y - 18, w:36, h:36,
    p:{ name:'現在地', class:'current_location' }, kind:'location',
  });
}

function render(){
  if (!tileLayers) return;
  renderCount++;
  const renderStartedAt = performance.now();
  const o = opts();
  hitAreas = [];
  const L = n => (tileLayers[n] ? tileLayers[n].features : []);
  window.PixelMapGameData = {
    places:L('place'),
    sourceLayers:Object.keys(tileLayers),
  };
  SCALE = W / (tileLayers.transportation?.extent || tileLayers.building?.extent || 4096);
  gridOriginX = Math.floor(viewOffset.x / CPX) - 1;
  gridOriginY = Math.floor(viewOffset.y / CPX) - 1;
  gridShiftX = gridOriginX * CPX - viewOffset.x;
  gridShiftY = gridOriginY * CPX - viewOffset.y;

  /* --- 地形のマップグリッド + 建物情報 --- */
  const rasterized = getRasterizedGrid(tileLayers, o);
  const { grids, transportCenters, bldGrid, bldUnits, unitByRingKey, bldArea, featureCountsByOption } = rasterized;
  const RG = GRID + 2;
  const worldToGridCell = (wx, wy) => [
    Math.floor(wx / CPX) - TILE.x * GRID - gridOriginX,
    Math.floor(wy / CPX) - TILE.y * GRID - gridOriginY,
  ];
  const cellRenderingStats = {
    gridSize:RG,
    pixelData:CELL_ONLY_MODE ? new Uint8ClampedArray(RG * RG * 4) : null,
    occupiedMask:CELL_ONLY_MODE ? new Uint8Array(RG * RG) : null,
    paintedCells:0,
    occupiedCells:0,
    layerCells:Object.create(null),
    countedFeatureOptions:new Set(),
    cellizedFeatures:0,
    facilitySymbols:0,
    terrainSymbols:0,
    groundPatternCells:0,
    boundaryCells:0,
    roadCasingCells:0,
    roadCenterCells:0,
    railTieCells:0,
    buildingDetailCells:0,
    spriteCells:0,
    flushed:false,
  };

  /* --- リゾルバーの確定施設データ（アイコンにも建物の用途分類にも使う） --- */
  const resolvedView = applyStandaloneLandmarks(collectResolvedFacilities());
  if (resolvedView.pendingTiles) ensureTilesAround().catch(console.error);

  /* --- 建物の意味づけ: 棟 × リゾルバー施設 → 見た目記述子 ---
     kind/categoryはリゾルバーが唯一の正典。未解決MVTタイルの棟は一旦normalで描き、
     解決済みMVTタイルが増える（stampが変わる）たびに再計算して昇格させる。 --- */
  const semanticStamp = tileGeneration + ':' + resolvedView.resolvedTileCount;
  if (!rasterized.semantic || rasterized.semantic.stamp !== semanticStamp){
    const unitCount = bldUnits.length;
    const buildingKinds = Array(unitCount + 1).fill('normal');
    const buildingDescs = Array(unitCount + 1).fill(null);
    const buildingAnchors = Array(unitCount + 1).fill(null);
    const facilityByUnit = Array(unitCount + 1).fill(null);
    const unitAt = (cx, cy) => (cx >= 0 && cy >= 0 && cx < RG && cy < RG) ? bldGrid[cy * RG + cx] : 0;
    for (const facility of resolvedView.facilities){
      if (!facility.buildingId) continue;
      let bi = unitByRingKey.get(facility.buildingId) || 0;
      if (!bi){
        // MVTタイル境界でリング片が異なる場合は施設位置のセルから引く
        const [cx, cy] = worldToGridCell(facility.worldX, facility.worldY);
        bi = unitAt(cx, cy);
      }
      if (!bi) continue;
      const current = facilityByUnit[bi];
      if (!current || facility.selectionPriority < current.selectionPriority ||
          (facility.selectionPriority === current.selectionPriority && facility.key < current.key))
        facilityByUnit[bi] = facility;
    }
    for (let bi = 1; bi <= unitCount; bi++){
      const unit = bldUnits[bi - 1];
      const facility = facilityByUnit[bi];
      const kind = facility && facility.metrics.kind !== 'none' ? facility.metrics.kind : 'normal';
      buildingKinds[bi] = kind;
      const lodSeed = BUILDING_STYLES.seedFromKey(unit.ringKey);
      buildingDescs[bi] = {
        ...BUILDING_STYLES.buildingAppearance({
        heightM:Number(unit.props.render_height || 0),
        areaCells:unit.geomAreaCells,
        kind,
        category:facility ? facility.category : null,
        seed:lodSeed,
        }),
        lodSeed,
      };
      if (facility){
        // 屋上マークと入口は施設のワールド座標にアンカーする（パンで動かない）
        let [ax, ay] = worldToGridCell(facility.worldX, facility.worldY);
        if (unitAt(ax, ay) !== bi){
          let found = false;
          for (let dy = -CELL_DETAIL_SCALE; dy <= CELL_DETAIL_SCALE && !found; dy++)
            for (let dx = -CELL_DETAIL_SCALE; dx <= CELL_DETAIL_SCALE && !found; dx++)
              if (unitAt(ax + dx, ay + dy) === bi){ ax += dx; ay += dy; found = true; }
          if (!found) ax = -1;
        }
        if (ax >= 0){
          let ay0 = ay, ay1 = ay;
          while (ay0 - 1 >= 0 && unitAt(ax, ay0 - 1) === bi) ay0--;
          while (ay1 + 1 < RG && unitAt(ax, ay1 + 1) === bi) ay1++;
          // 屋上マークはアンカー列の最上段、入口は最下段
          buildingAnchors[bi] = { gx:ax, gy:ay0, ex:ax, ey:ay1 };
        }
      }
    }
    const bldStyle = new Uint8Array(unitCount + 1);
    for (let bi = 1; bi <= unitCount; bi++) bldStyle[bi] = buildingDescs[bi].styleIndex;
    const buildingGrid = grids.get('buildings');
    const normalBuildingGrid = new Uint8Array(RG * RG);
    const poiBuildingGrid = new Uint8Array(RG * RG);
    if (buildingGrid){
      for (let i = 0; i < buildingGrid.length; i++){
        if (buildingGrid[i] !== ID.BLD) continue;
        const target = buildingKinds[bldGrid[i]] === 'normal' ? normalBuildingGrid : poiBuildingGrid;
        target[i] = ID.BLD;
      }
    }
    rasterized.semantic = {
      stamp:semanticStamp, buildingKinds, buildingDescs, buildingAnchors,
      bldStyle, normalBuildingGrid, poiBuildingGrid,
    };
  }
  const { buildingKinds, buildingDescs, buildingAnchors, bldStyle, normalBuildingGrid, poiBuildingGrid } = rasterized.semantic;
  const emptyGrid = new Uint8Array((GRID + 2) * (GRID + 2));
  if (CELL_ONLY_MODE) drawCellPixelArtSurfaceGrid(emptyGrid, 'grass', cellRenderingStats, false);
  else drawGrid(emptyGrid, bldGrid, bldStyle, { grass:false });

  const unifiedCorridorCache = new Map();
  let unifiedLevelCrossingPoints = [];
  const unifiedWaterwayClasses = new Set(['river','stream','canal','ditch','drain']);
  function unifiedCorridorFeatures(option, bridge = false){
    const style = STANDALONE_STYLE_SPEC.corridor[option];
    if (!style) return [];
    if (style.source === 'waterway'){
      return L('waterway').filter(feature => {
        const kind = feature.props.subclass || feature.props.class || '';
        return style.fallback ? !unifiedWaterwayClasses.has(kind) : style.classes.includes(kind);
      });
    }
    return L('transportation').filter(feature => {
      const binding = corridorBinding(feature);
      const routeOption = binding.assetId;
      const isBridge = binding.modifiers.bridge;
      const isTunnel = binding.modifiers.tunnel;
      if (style.tunnelGroup){
        return !bridge && binding.stateAssetId === option;
      }
      if (option === 'subway') return routeOption === 'subway' && !isBridge;
      if (routeOption !== option || isTunnel) return false;
      return bridge ? isBridge : !isBridge;
    });
  }
  function unifiedCorridorEntry(option, bridge = false){
    const key = `${option}:${bridge ? 'bridge' : 'surface'}`;
    if (unifiedCorridorCache.has(key)) return unifiedCorridorCache.get(key);
    const style = STANDALONE_STYLE_SPEC.corridor[option];
    const features = unifiedCorridorFeatures(option, bridge);
    const maskStyle = bridge ? corridorModifierStyle(style,'bridge') : style;
    const entry = {
      style,
      features,
      masks:features.length ? buildUnifiedCorridorMasks(features, maskStyle) : null,
    };
    unifiedCorridorCache.set(key, entry);
    return entry;
  }
  function drawUnifiedCorridorLayer(option, bridge = false){
    const entry = unifiedCorridorEntry(option, bridge);
    if (!entry?.masks) return;
    renderUnifiedCorridor(entry.features, entry.style, bridge, entry.masks);
  }
  function activeUnifiedCorridorMask(){
    const combined = new Uint8Array(PRESENTATION_SIZE * PRESENTATION_SIZE);
    for (const [option, style] of Object.entries(STANDALONE_STYLE_SPEC.corridor)){
      if (!o[option] || style.tunnelGroup || option === 'subway' || option === 'ferries' || option === 'aerialways') continue;
      const masks = unifiedCorridorEntry(option, false).masks;
      if (!masks) continue;
      for (let index = 0; index < combined.length; index++)
        if (masks.body[index]) combined[index] = 1;
    }
    return combined;
  }
  function combinedGroundCorridorMask(options){
    const combined=new Uint8Array(PRESENTATION_SIZE*PRESENTATION_SIZE);
    for(const option of options){
      if(!o[option]) continue;
      const masks=unifiedCorridorEntry(option,false).masks;
      if(!masks) continue;
      for(let index=0;index<combined.length;index++)
        if(masks.body[index]) combined[index]=1;
    }
    return combined;
  }
  function drawUnifiedLevelCrossings(){
    const modifier=WORLD_STYLE.corridorModifiers?.levelCrossing;
    if(!modifier || !o.rail) return [];
    const roadOptions=Object.keys(STANDALONE_STYLE_SPEC.corridor).filter(option =>
      ASSET_FAMILY_REGISTRY.corridorFamilyIdsForAsset(option,ACTIVE_ASSET_PACK).includes('road') &&
      !STANDALONE_STYLE_SPEC.corridor[option].tunnelGroup);
    const roadMask=combinedGroundCorridorMask(roadOptions);
    const railMask=combinedGroundCorridorMask(['rail']);
    const points=CORRIDOR_RENDERER.findMaskIntersections(
      roadMask,railMask,PRESENTATION_SIZE,PRESENTATION_SIZE,
      {minimumSpacing:modifier.minimumSpacing});
    ctx.save();
    for(const point of points){
      const x=point.x*SCENE_PIXELS_PER_LOGICAL_PIXEL;
      const y=point.y*SCENE_PIXELS_PER_LOGICAL_PIXEL;
      ctx.fillStyle=modifier.outline;ctx.fillRect(x-4,y-4,8,8);
      ctx.fillStyle=modifier.light;ctx.fillRect(x-2,y-2,4,4);
      ctx.fillStyle=modifier.dark;
      ctx.fillRect(x-2,y-2,2,2);ctx.fillRect(x,y,2,2);
    }
    ctx.restore();
    return points;
  }

  /* 本番道路は16pxセルへ落とさず、MVTの元形状を2シーンpx
     （出力画像上1論理px）のグリッドへ直接描く。外形・舗装・中央線を
     別ストロークにすることで、交差点をつなげたまま細かな曲線を保つ。 */
  function drawSmoothRoadLayer(option, bridge = false){
    const style = SMOOTH_ROAD_STYLE[option];
    if (!style) return;
    const features = L('transportation').filter(feature => {
      const binding = corridorBinding(feature);
      if (binding.assetId !== option) return false;
      const isBridge = binding.modifiers.bridge;
      const isTunnel = binding.modifiers.tunnel;
      return bridge ? isBridge : !isBridge && !isTunnel;
    });
    if (!features.length) return;

    const point = value => {
      const [x, y] = tp(value);
      return [Math.round(x / 2) * 2, Math.round(y / 2) * 2];
    };
    const lineFeatures = features.filter(feature => feature.type === 2);
    const areaFeatures = features.filter(feature => feature.type === 3);
    const traceLines = () => {
      ctx.beginPath();
      for (const feature of lineFeatures){
        for (const line of feature.geom){
          line.forEach((pt, index) => {
            const [x, y] = point(pt);
            index ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
          });
        }
      }
    };

    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const minimumLocalRoad = STANDALONE_MINIMUM_MINOR_ROUTES && option === 'localRoads';
    const bridgeExtra = bridge && !minimumLocalRoad ? 4 : 0;
    const width = style.width + bridgeExtra;
    if (areaFeatures.length){
      for (const feature of areaFeatures){
        ctx.beginPath();
        for (const ring of feature.geom){
          ring.forEach((pt, index) => {
            const [x, y] = point(pt);
            index ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
          });
          ctx.closePath();
        }
        ctx.fillStyle = style.fill;
        ctx.strokeStyle = style.edge;
        ctx.lineWidth = style.casing * 2 + bridgeExtra;
        ctx.fill('evenodd');
        if (ctx.lineWidth > 0) ctx.stroke();
      }
    }
    if (lineFeatures.length){
      if (style.casing > 0 || bridgeExtra > 0){
        traceLines();
        ctx.strokeStyle = style.edge;
        ctx.lineWidth = width + style.casing * 2;
        ctx.stroke();
      }
      traceLines();
      ctx.strokeStyle = style.fill;
      ctx.lineWidth = width;
      ctx.stroke();
      if (style.center){
        traceLines();
        ctx.strokeStyle = style.center;
        ctx.lineWidth = style.centerWidth;
        ctx.setLineDash(style.dash);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }
    ctx.restore();
  }

  function drawTunnelLayer(option){
    const tunnelRule=CANONICAL_TRANSPORT_RULES[option];
    ctx.globalAlpha = tunnelRule.alpha;
    ctx.lineCap = 'round';
    for (const f of L('transportation')){
      const binding = corridorBinding(f);
      const routeOption = binding.assetId;
      const isTunnel = binding.modifiers.tunnel;
      const isBridge = binding.modifiers.bridge;
      const showSubway = option === 'subway' && routeOption === 'subway' && !isBridge;
      const showRoadTunnel = option === 'roadTunnels' && binding.stateAssetId === option;
      const showPathTunnel = option === 'pathTunnels' && binding.stateAssetId === option;
      const showRailTunnel = option === 'railTunnels' && binding.stateAssetId === option;
      if (!showSubway && !showRoadTunnel && !showPathTunnel && !showRailTunnel) continue;
      ctx.strokeStyle = tunnelRule.fill;
      ctx.lineWidth = tunnelRule.logicalWidth * SCENE_PIXELS_PER_LOGICAL_PIXEL;
      ctx.setLineDash(tunnelRule.dash.map(value => value * SCENE_PIXELS_PER_LOGICAL_PIXEL));
      if (f.type === 1){
        const [x, y] = tp(f.geom[0][0]);
        px(x - 4, y - 4, 8, 8, '#282838');
      }else{
        ctx.beginPath();
        for (const ln of f.geom)
          ln.forEach((pt, i) => { const [x, y] = tp(pt); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
        ctx.stroke();
      }
    }
    ctx.setLineDash([]); ctx.globalAlpha = 1;
  }

  // 建物マスクはMVT形状から一度だけ確定する。corridorとの競合は診断するが、
  // 建物・POIを衝突後に移動または変形させない。
  let preciseBuildingRaster = null;
  let preciseSurfaceRoadMask = null;
  let preciseBuildingOverlapAudit = null;
  let preciseBuildingRoadOverlapPixels = 0;
  let preciseBuildingLodStats = null;
  if (o.buildings && STANDALONE_PRECISE_BUILDINGS){
    preciseBuildingRaster = rasterizeStandaloneBuildingPixels(bldUnits);
    preciseSurfaceRoadMask = STANDALONE_UNIFIED_STYLE
      ? activeUnifiedCorridorMask()
      : standaloneSurfaceRoadMask(o, L('transportation'));
    preciseBuildingOverlapAudit = auditStandaloneBuildingCorridorOverlap(
      preciseBuildingRaster, preciseSurfaceRoadMask
    );
    preciseBuildingRoadOverlapPixels = preciseBuildingOverlapAudit.overlapPixels;
  }

  /* --- レイヤー統計 --- */
  const stats = {};
  for (const n in tileLayers) stats[n] = tileLayers[n].features.length;
  const buildingKindCounts = buildingKinds.slice(1).reduce((counts, kind) => {
    counts[kind] = (counts[kind] || 0) + 1;
    return counts;
  }, {});
  document.getElementById('stats').innerHTML =
    (CELL_ONLY_MODE ? `<span>描画: ${MAP_CELL_LOGICAL_SIZE}×${MAP_CELL_LOGICAL_SIZE}論理px原子セルのピクセルアート</span>` : '')+
    `<span>普通建物: ${buildingKindCounts.normal || 0}</span>`+
    `<span>病院: ${buildingKindCounts.hospital || 0}</span>`+
    `<span>コンビニ: ${buildingKindCounts.convenience || 0}</span>`+
    `<span>雑居ビル: ${buildingKindCounts.mixed || 0}</span>`+
    `<span>その他POI建物: ${buildingKindCounts.poi || 0}</span>`+
    Object.entries(stats).map(([k, v]) => `<span>${k}: ${v}</span>`).join('');

  /* --- POI ---
     icon / dot / cluster はリゾルバーがワールド座標で確定済み。
     ここでは範囲内の確定データを画面座標へ変換して描くだけで、
     パンしても選抜・表示順・アイコンと点の切り替えは一切起きない。 --- */
  const worldToScreen = (wx, wy) => [wx - TILE.x * W - viewOffset.x, wy - TILE.y * H - viewOffset.y];
  const facilitiesInView = resolvedView.facilities
    .map(f => {
      const pt = worldToScreen(f.worldX, f.worldY);
      return { ...f, pt, visualRadius:f.collisionRadius };
    })
    .filter(p => p.pt[0] >= -70 && p.pt[1] >= -70 && p.pt[0] <= W + 70 && p.pt[1] <= H + 70);
  // タイル単位のicon判定は保持し、画面全体の密度予算もresolverの純粋関数で確定する。
  // source座標・衝突結果は変更せず、WorldStyleが描画対象数だけを制限する。
  const viewportIconSelection = WORLD_STYLE_MODE
    ? RESOLVER.selectViewportIcons(facilitiesInView, WORLD_STYLE.density)
    : {
        selected:facilitiesInView.filter(p => p.representation === 'icon'),
        rejected:[],roleCounts:{},categoryCounts:{},maxIcons:Infinity,
      };
  const worldStyleDisplayAssetSize = item => {
    const sourceSize = item.assetSize || item.size || 'S';
    const minimum = WORLD_STYLE.symbol.minimumAssetSizeByRole[item.semanticRole] || 'S';
    return WORLD_STYLE_MODE && tierValue(sourceSize) < tierValue(minimum) ? minimum : sourceSize;
  };
  const drawnIcons = viewportIconSelection.selected.map(item => ({
    ...item,
    displayAssetSize:worldStyleDisplayAssetSize(item),
  }));
  const foregroundBuildingIds = new Set(drawnIcons
    .map(item => item.buildingId ? unitByRingKey.get(item.buildingId) : 0)
    .filter(Boolean));
  const hiddenPois = [
    ...facilitiesInView.filter(p => p.representation === 'dot'),
    ...viewportIconSelection.rejected,
  ];
  const clusterMarks = resolvedView.clusters
    .map(c => ({ ...c, pt:worldToScreen(c.worldX, c.worldY) }))
    .filter(c => c.pt[0] >= -40 && c.pt[1] >= -40 && c.pt[0] <= W + 40 && c.pt[1] <= H + 40);
  let drawnDotCount = 0;
  function drawDotMarker(p){
    const [x0, y0] = p.pt;
    const x = Math.round(x0), y = Math.round(y0);
    const tone = categoryTone(p.category);
    const s = Math.max(2, Math.round(4 * ACTIVE_PATTERN.dotScale));
    const kind = ACTIVE_PATTERN.dot;
    if (kind === 'category-shape'){
      drawCategoryShape(x, y, Math.max(5,s+2), p.category, tone, .9);
      return;
    }
    ctx.save();
    ctx.fillStyle = OUT; ctx.strokeStyle = OUT; ctx.lineWidth = 2;
    if (kind === 'ring'){
      ctx.beginPath(); ctx.arc(x,y,s+3,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle = tone; ctx.fillRect(x-2,y-2,4,4);
    } else if (kind === 'diamond'){
      ctx.beginPath(); ctx.moveTo(x,y-s-3); ctx.lineTo(x+s+3,y); ctx.lineTo(x,y+s+3); ctx.lineTo(x-s-3,y); ctx.closePath(); ctx.fill();
      ctx.fillStyle = tone; ctx.beginPath(); ctx.moveTo(x,y-s); ctx.lineTo(x+s,y); ctx.lineTo(x,y+s); ctx.lineTo(x-s,y); ctx.closePath(); ctx.fill();
    } else if (kind === 'cross'){
      ctx.fillRect(x-2,y-s-3,4,(s+3)*2); ctx.fillRect(x-s-3,y-2,(s+3)*2,4);
      ctx.fillStyle = tone; ctx.fillRect(x-1,y-s-1,2,(s+1)*2); ctx.fillRect(x-s-1,y-1,(s+1)*2,2);
    } else if (kind === 'dash'){
      ctx.fillRect(x-s-4,y-3,(s+4)*2,6); ctx.fillStyle = tone; ctx.fillRect(x-s-2,y-1,(s+2)*2,2);
    } else if (kind === 'bar'){
      ctx.fillRect(x-3,y-s-5,6,(s+5)*2); ctx.fillStyle = tone; ctx.fillRect(x-1,y-s-3,2,(s+3)*2);
    } else if (kind === 'cluster'){
      for (const [dx,dy] of [[-4,-3],[4,-3],[0,4]]){ ctx.fillStyle=OUT; ctx.fillRect(x+dx-3,y+dy-3,6,6); ctx.fillStyle=tone; ctx.fillRect(x+dx-2,y+dy-2,4,4); }
    } else if (kind === 'tiny' || kind === 'pixel'){
      ctx.fillRect(x-s-1,y-s-1,(s+1)*2,(s+1)*2); ctx.fillStyle=tone; ctx.fillRect(x-s+1,y-s+1,Math.max(2,(s-1)*2),Math.max(2,(s-1)*2));
    } else {
      ctx.fillRect(x-s-2,y-s-2,(s+2)*2,(s+2)*2); ctx.fillStyle=tone; ctx.fillRect(x-s,y-s,s*2,s*2);
    }
    ctx.restore();
  }
  function drawDots(points = hiddenPois){
    for (const p of points){
      const [x, y] = p.pt;
      if (x < 0 || y < 0 || x > W || y > H) continue;
      drawDotMarker(p);
      hitAreas.push({ x: x - 9, y: y - 9, w: 18, h: 18, p: p.props, kind:'dot' });
      drawnDotCount++;
    }
  }
  // 密集地の点はリゾルバーがクラスターへ統合済み。件数に応じた角印で描く。
  function drawClusters(){
    for (const c of clusterMarks){
      const x = Math.round(c.pt[0]), y = Math.round(c.pt[1]);
      const tone = categoryTone(c.category);
      const r = Math.min(13, 6 + Math.round(Math.sqrt(c.count)));
      ctx.save();
      ctx.fillStyle = OUT;
      ctx.fillRect(x - r - 2, y - r - 2, r * 2 + 4, r * 2 + 4);
      ctx.fillStyle = tone;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
      ctx.fillStyle = '#f8f0d8';
      const pips = Math.max(2, Math.min(4, Math.round(c.count / 3)));
      for (let i = 0; i < pips; i++){
        const angle = -Math.PI / 2 + i * Math.PI * 2 / pips;
        ctx.fillRect(x + Math.round(Math.cos(angle) * (r - 4)) - 1,
          y + Math.round(Math.sin(angle) * (r - 4)) - 1, 3, 3);
      }
      ctx.restore();
      hitAreas.push({
        x:x - r - 4, y:y - r - 4, w:(r + 4) * 2, h:(r + 4) * 2,
        p:{ name:`まとまった施設（${c.count}件）`, class:'cluster' }, kind:'cluster',
      });
    }
  }
  function drawCellFacilityMarker(item, size, layer){
    const [gx, gy] = worldToGridCell(item.worldX, item.worldY);
    const tone = categoryTone(item.category);
    const radius = size === 'L' ? Math.min(6, 3 + Math.floor(Math.sqrt(item.count || 1) / 2)) : 2;
    for (let dy = -radius; dy <= radius; dy++){
      for (let dx = -radius; dx <= radius; dx++){
        const edge = Math.abs(dx) === radius || Math.abs(dy) === radius;
        const corner = Math.abs(dx) === radius && Math.abs(dy) === radius;
        if (corner && radius > 2) continue;
        paintSolidMapCell(gx + dx, gy + dy, edge ? OUT : tone, layer, cellRenderingStats);
        cellRenderingStats.spriteCells++;
      }
    }
    if (size === 'L'){
      const pips = Math.max(2, Math.min(4, Math.round((item.count || 4) / 3)));
      const pipCells = [[0,-1],[1,0],[0,1],[-1,0]];
      for (let index = 0; index < pips; index++){
        const [dx, dy] = pipCells[index];
        paintSolidMapCell(gx + dx, gy + dy, GLYPH_WHITE, layer, cellRenderingStats);
        cellRenderingStats.spriteCells++;
      }
    }
    item.cellPt = solidMapCellCenter(gx, gy);
    cellRenderingStats.facilitySymbols++;
    return item.cellPt;
  }

  function drawCellPatternMarker(item, gx, gy, layer){
    const tone = categoryTone(item.category);
    const marker = ACTIVE_PATTERN.marker;
    const visualScale = ACTIVE_PATTERN.scale * (ACTIVE_PATTERN.categoryScale[item.category] || 1);
    const radius = Math.max(3, Math.round(5 * visualScale));
    const paint = (x, y, color) => {
      paintSolidMapCell(x, y, color, layer, cellRenderingStats);
      cellRenderingStats.spriteCells++;
    };
    if (marker === 'tower'){
      const height = Math.max(5, Math.min(17, Math.round((14 + item.metrics.height * .42) / CPX)));
      const x = gx + radius;
      for (let y = gy - height; y <= gy; y++){
        paint(x, y, OUT); paint(x + 1, y, tone);
        if (positiveModulo(y, 3) === 0) paint(x + 1, y, GLYPH_WHITE);
      }
    } else if (marker === 'flag' || marker === 'beacon'){
      const x = gx - radius;
      for (let y = gy - radius * 2; y <= gy; y++) paint(x, y, OUT);
      for (let dx = 1; dx <= radius + 1; dx++) paint(x + dx, gy - radius * 2, tone);
    } else if (marker === 'corners' || marker === 'microgrid'){
      for (const [dx,dy] of [[-radius,-radius],[radius,-radius],[-radius,radius],[radius,radius]]) paint(gx + dx, gy + dy, tone);
    } else {
      for (let dx = -radius; dx <= radius; dx++){
        paint(gx + dx, gy + 1, OUT);
        if (Math.abs(dx) < radius) paint(gx + dx, gy, tone);
      }
    }
  }

  function drawCellSprite(item, layer){
    const [gx, gy] = worldToGridCell(item.worldX, item.worldY);
    const template = cellSpriteTemplateFor(item);
    item.visualScale = ACTIVE_PATTERN.scale * (ACTIVE_PATTERN.categoryScale[item.category] || 1);
    item.visualRadius = 24 * item.visualScale + Math.max(0, item.assetCount - 1) * 8;
    drawCellPatternMarker(item, gx, gy, `${layer}:marker`);
    for (let ty = 0; ty < template.height; ty++){
      for (let tx = 0; tx < template.width; tx++){
        const color = template.colors[ty * template.width + tx];
        if (!color) continue;
        paintSolidMapCell(gx + tx - template.anchorX, gy + ty - template.anchorY, color, layer, cellRenderingStats);
        cellRenderingStats.spriteCells++;
      }
    }
    item.cellPt = solidMapCellCenter(gx, gy);
    cellRenderingStats.facilitySymbols++;
    return item.cellPt;
  }
  function drawCellDots(points = hiddenPois){
    for (const p of points){
      const [x, y] = drawCellFacilityMarker(p, 'S', 'dots');
      if (x < 0 || y < 0 || x > W || y > H) continue;
      hitAreas.push({ x:x - 9, y:y - 9, w:18, h:18, p:p.props, kind:'dot' });
      drawnDotCount++;
    }
  }
  function drawCellClusters(){
    for (const c of clusterMarks){
      const [x, y] = drawCellFacilityMarker(c, 'L', 'clusters');
      hitAreas.push({
        x:x - STANDARD_CPX * 1.5, y:y - STANDARD_CPX * 1.5,
        w:STANDARD_CPX * 3, h:STANDARD_CPX * 3,
        p:{ name:`まとまった施設（${c.count}件）`, class:'cluster' }, kind:'cluster',
      });
    }
  }
  const categoryIndex = p => {
    const index = ACTIVE_PATTERN.priority.indexOf(p.category);
    return index < 0 ? ACTIVE_PATTERN.priority.length : index;
  };
  drawnIcons.sort((a, b) => {
    if (ACTIVE_PATTERN.drawOrder === 'priority') return b.selectionPriority - a.selectionPriority || a.pt[1] - b.pt[1];
    if (ACTIVE_PATTERN.drawOrder === 'height') return a.metrics.height - b.metrics.height || a.pt[1] - b.pt[1];
    if (ACTIVE_PATTERN.drawOrder === 'size') return tierValue(a.size) - tierValue(b.size) || a.pt[1] - b.pt[1];
    if (ACTIVE_PATTERN.drawOrder === 'category') return categoryIndex(b) - categoryIndex(a) || a.pt[1] - b.pt[1];
    return a.pt[1] - b.pt[1] || tierValue(a.size) - tierValue(b.size);
  });
  const semanticRoleForPoi = p => {
    if (p.semanticRole) return p.semanticRole;
    const id = p.spriteKey || RESOLVER.spriteKeyFor(p.props,ACTIVE_ASSET_PACK);
    return POI_ASSETS_BY_ID.get(id)?.semanticRole || 'marker';
  };
  function drawPoiIcons(roles){
    const allowed = new Set(roles);
    for (const p of drawnIcons.filter(item => allowed.has(semanticRoleForPoi(item)))){
      drawSprite(spriteFor(p.props, p.displayAssetSize || p.assetSize || p.size, p.variant, p.spriteKey), p.pt[0], p.pt[1], p);
      const radius = Math.max(28, p.visualRadius);
      hitAreas.push({ x:p.pt[0]-radius, y:p.pt[1]-radius*2, w:radius*2, h:radius*2.2, p:p.props, kind:'poi' });
    }
  }
  function drawPoi(){
    // legacy/cell以外の従来合成。表示採用はresolverの結果をそのまま使う。
    drawPoiIcons(['structure','object','marker']);
    drawDots();
    drawClusters();
  }
  function drawPoiStructures(){
    drawPoiIcons(['structure']);
  }
  function drawPoiOverlays(){
    // 固定semantic z-order: world object → marker。dot/clusterは独立レイヤー。
    drawPoiIcons(['object']);
    drawPoiIcons(['marker']);
  }
  function drawCellPoi(){
    drawCellDots();
    drawCellClusters();
    for (const p of drawnIcons){
      const [x, y] = drawCellSprite(p, 'poi');
      const radius = Math.max(28, p.visualRadius);
      hitAreas.push({ x:x - radius, y:y - radius*1.9, w:radius*2, h:radius*2.1, p:p.props, kind:'poi' });
    }
  }

  const labelPoint = p => CELL_ONLY_MODE && p.cellPt ? p.cellPt : p.pt;

  function drawStationNames(){
    const placedRects = [];
    const stationTargets = drawnIcons
      .filter(p => isStationProps(p.props) && featureName(p.props))
      .sort((a,b) => a.rank - b.rank);
    for (const p of stationTargets){
      const [x, y] = labelPoint(p);
      const offset = p.size === 'L' ? 154 : 130;
      labelWindow(featureName(p.props), x, y - offset, placedRects);
    }
  }
  function drawParkNames(){
    const placedRects = [];
    for (const f of L('park')){
      const name = featureName(f.props);
      if (!name || f.type !== 3) continue;
      const [cx, cy] = centroid(f.geom);
      if (cx < 0 || cy < 0 || cx > W || cy > H) continue;
      labelWindow(name, cx, cy - 40, placedRects);
    }
  }
  function drawPoiNames(){
    const placedRects = [];
    const labelTargets = drawnIcons
      .filter(p => featureName(p.props) && !isStationProps(p.props))
      .sort((a, b) => a.selectionPriority - b.selectionPriority || a.rank - b.rank)
      .slice(0, ACTIVE_PATTERN.labelLimit);
    for (const p of labelTargets){
      const [x, y] = labelPoint(p);
      const offset = p.size === 'L' ? 142 : 116;
      labelWindow(featureName(p.props), x, y - offset, placedRects);
    }
  }
  function drawPlaceNames(){
    const placedRects = [];
    const placeWeight = {
      continent:0, country:1, state:2, province:2, city:3, town:4, borough:5,
      village:6, hamlet:7, suburb:8, quarter:9, neighbourhood:10, island:6,
      isolated_dwelling:11, aboriginal_lands:7,
    };
    const seenPlaces = new Set();
    const placeFeatures = L('place')
      .filter(f => geometryAnchor(f) && featureName(f.props))
      .sort((a,b) => (placeWeight[a.props.class] ?? 8) - (placeWeight[b.props.class] ?? 8) ||
        Number(a.props.rank ?? 30) - Number(b.props.rank ?? 30));
    for (const f of placeFeatures){
      const name = featureName(f.props);
      if (seenPlaces.has(name)) continue;
      const [x, y] = tp(geometryAnchor(f));
      if (x < 0 || y < 0 || x > W || y > H) continue;
      const big = ['continent','country','state','province','city','town'].includes(f.props.class);
      const r = outlinedTextPlaced(name, x, y, big ? 42 : 26, big ? '#f8f0d8' : '#f8e8a8', placedRects);
      if (r){
        hitAreas.push({ ...r, p: { ...f.props }, kind:'place' });
        seenPlaces.add(name);
      }
    }
  }
  const terrainItems = L('mountain_peak')
    .map(feature => ({ feature, anchor:geometryAnchor(feature) }))
    .filter(item => item.anchor);
  const terrainCellPoints = new Map();
  function drawTerrainNames(){
    const placedRects = [];
    for (const { feature:f, anchor } of terrainItems){
      const kind = f.props.subclass || f.props.class || 'terrain';
      const [ax, ay] = tp(anchor);
      if (f.type === 1){
        if (ax < -20 || ay < -20 || ax > W + 20 || ay > H + 20) continue;
        ctx.fillStyle = OUT;
        ctx.beginPath(); ctx.moveTo(ax, ay - 11); ctx.lineTo(ax - 10, ay + 8); ctx.lineTo(ax + 10, ay + 8); ctx.closePath(); ctx.fill();
        ctx.fillStyle = kind === 'volcano' ? '#d8583f' : kind === 'saddle' ? '#b89058' : '#8d8790';
        ctx.beginPath(); ctx.moveTo(ax, ay - 7); ctx.lineTo(ax - 6, ay + 5); ctx.lineTo(ax + 6, ay + 5); ctx.closePath(); ctx.fill();
        if (kind === 'volcano'){ ctx.fillStyle = '#f8d038'; ctx.fillRect(ax - 2, ay - 6, 4, 2); }
      }else{
        ctx.strokeStyle = kind === 'cliff' ? '#625f69' : '#8d7655';
        ctx.lineWidth = kind === 'cliff' ? 5 : 3;
        ctx.setLineDash(kind === 'ridge' || kind === 'arete' ? [12, 7] : []);
        ctx.beginPath();
        for (const line of f.geom)
          line.forEach((point, index) => { const [x, y] = tp(point); index ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
        ctx.stroke(); ctx.setLineDash([]);
      }
      const name = featureName(f.props);
      if (name) outlinedTextPlaced(name, ax, ay - 16, 26, '#e8d8b0', placedRects);
      hitAreas.push({ x:ax - 12, y:ay - 14, w:24, h:24,
        p:{ ...f.props, name:name || kind }, kind:'terrain' });
    }
  }
  function drawCellTerrainSymbols(){
    const screenToGridCell = ([x, y]) => [
      Math.floor((x - gridShiftX) / CPX),
      Math.floor((y - gridShiftY) / CPX),
    ];
    const walkLine = (x0, y0, x1, y1, visit) => {
      let cx = Math.floor(x0), cy = Math.floor(y0);
      const ex = Math.floor(x1), ey = Math.floor(y1);
      const dx = x1 - x0, dy = y1 - y0;
      const stepX = dx > 0 ? 1 : -1, stepY = dy > 0 ? 1 : -1;
      const tDX = dx !== 0 ? Math.abs(1 / dx) : Infinity;
      const tDY = dy !== 0 ? Math.abs(1 / dy) : Infinity;
      let tMX = dx !== 0 ? (dx > 0 ? cx + 1 - x0 : x0 - cx) * tDX : Infinity;
      let tMY = dy !== 0 ? (dy > 0 ? cy + 1 - y0 : y0 - cy) * tDY : Infinity;
      visit(cx, cy);
      let guard = 0;
      while ((cx !== ex || cy !== ey) && guard++ < RG * 4){
        if (tMX < tMY){ cx += stepX; tMX += tDX; }
        else { cy += stepY; tMY += tDY; }
        visit(cx, cy);
      }
    };
    for (const { feature:f, anchor } of terrainItems){
      const kind = f.props.subclass || f.props.class || 'terrain';
      const [anchorX, anchorY] = screenToGridCell(tp(anchor));
      const color = kind === 'volcano' ? '#d8583f'
        : kind === 'saddle' ? '#b89058'
          : kind === 'cliff' ? P.rockDk
            : kind === 'ridge' || kind === 'arete' ? '#8d7655' : P.rock;
      const cells = new Set();
      if (f.type === 1){
        // 2px原子セルの三角形。火山は山頂の火口色を追加する。
        for (let row = 0; row < 5; row++){
          const half = Math.floor(row / 2);
          for (let dx = -half; dx <= half; dx++) cells.add(`${anchorX + dx},${anchorY - 2 + row}`);
        }
      } else {
        for (const line of f.geom){
          for (let index = 1; index < line.length; index++){
            const [x0, y0] = screenToGridCell(tp(line[index - 1]));
            const [x1, y1] = screenToGridCell(tp(line[index]));
            walkLine(x0 + .5, y0 + .5, x1 + .5, y1 + .5, (x, y) => cells.add(`${x},${y}`));
          }
        }
      }
      for (const key of cells){
        const [x, y] = key.split(',').map(Number);
        if (x < 0 || y < 0 || x >= RG || y >= RG) continue;
        const [wx, wy] = worldFineCell(x, y);
        if (f.type !== 1 && (kind === 'ridge' || kind === 'arete') && positiveModulo(wx + wy * 3, 7) >= 4) continue;
        const pointRow = y - anchorY + 2;
        const pointHalf = Math.floor(pointRow / 2);
        const pointOutline = f.type === 1 && (pointRow === 0 || pointRow === 4 || Math.abs(x - anchorX) === pointHalf);
        paintSolidMapCell(x, y, pointOutline ? OUT : color, 'terrainSymbols', cellRenderingStats);
        if (f.type !== 1 && kind === 'cliff'){
          paintSolidMapCell(x + 1, y, P.rockDk, 'terrainSymbols', cellRenderingStats);
        }
      }
      if (f.type === 1 && kind === 'volcano')
        paintSolidMapCell(anchorX, anchorY - 1, '#f8d038', 'terrainSymbols', cellRenderingStats);
      if (!cells.size) continue;
      const point = solidMapCellCenter(anchorX, anchorY);
      terrainCellPoints.set(f, point);
      cellRenderingStats.terrainSymbols++;
      cellRenderingStats.cellizedFeatures++;
      hitAreas.push({ x:point[0] - 12, y:point[1] - 14, w:24, h:24,
        p:{ ...f.props, name:featureName(f.props) || kind }, kind:'terrain' });
    }
  }
  function drawCellTerrainNames(){
    const placedRects = [];
    for (const { feature:f, anchor } of terrainItems){
      const name = featureName(f.props);
      if (!name) continue;
      const [ax, ay] = terrainCellPoints.get(f) || tp(anchor);
      outlinedTextPlaced(name, ax, ay - 16, 26, '#e8d8b0', placedRects);
    }
  }

  const z0Ground = new Set([
    'grass','forest','woods','farmland','landcoverGrass','sand','rock','wetland','ice','landcoverOther','parks',
    'landuseResidential','landuseCommercial','landuseRetail','landuseSchool','landuseHigherEducation',
    'landuseMedical','landuseCivic','landuseIndustrial','landuseGarages','landuseMilitary',
    'landuseBusStation','landuseRailway','landuseCemetery','landuseStadium','landusePitchTrack',
    'landusePlayground','landuseAmusement','landuseZoo','landuseOther',
  ]);
  const z1Water = new Set(['waterAreas','rivers','streams','canals','drains','waterwayOther']);
  const z2Routes = new Set([
    'landuseAirport','landuseHelipad','localRoads','regionalRoads','majorRoads','motorways',
    'paths','tracks','raceways','ferries','piers','rail','subway','aerialways','transportationOther',
    'roadTunnels','pathTunnels','railTunnels',
  ]);
  const bridgeOptions = new Set([
    'localRoads','regionalRoads','majorRoads','motorways','paths','tracks','raceways','ferries',
    'piers','rail','subway','aerialways','transportationOther',
  ]);
  const tunnelOptions = new Set(['subway','roadTunnels','pathTunnels','railTunnels']);
  const drawers = {
    dots:() => {
      drawDots(hiddenPois);
      drawClusters();
    },
    poi:STANDALONE_UNIFIED_STYLE ? drawPoiOverlays : drawPoi,
    stationNames:drawStationNames,
    parkNames:drawParkNames,
    poiNames:drawPoiNames,
    placeNames:drawPlaceNames,
    terrainNames:drawTerrainNames,
  };
  const cellLabelDrawers = {
    stationNames:drawStationNames,
    parkNames:drawParkNames,
    poiNames:drawPoiNames,
    placeNames:drawPlaceNames,
    terrainNames:drawCellTerrainNames,
  };

  const renderOrder = [];
  const countCellFeatures = option => {
    if (!CELL_ONLY_MODE || cellRenderingStats.countedFeatureOptions.has(option)) return;
    cellRenderingStats.countedFeatureOptions.add(option);
    cellRenderingStats.cellizedFeatures += featureCountsByOption[option] || 0;
  };
  const drawRasterGroup = (z, options) => {
    for (const option of layerOrder){
      if (!o[option] || !options.has(option)) continue;
      // 統一Style Specのcorridorは、地表areaの後・建物の前へ共通合成する。
      // 個別の重なり検出ではなく全域で同じ優先順にする。
      if (STANDALONE_UNIFIED_STYLE && STANDALONE_STYLE_SPEC.corridor[option]) continue;
      if (CELL_ONLY_MODE){
        // The base pass already fills every map cell with grass. Avoid a
        // duplicate repaint so the cell-write diagnostics remain meaningful.
        if (option !== 'grass'){
          const grid = grids.get(option);
          if (grid) drawCellPixelArtSurfaceGrid(grid, option, cellRenderingStats, true);
        }
        countCellFeatures(option);
      }
      else if (option === 'grass') drawGrid(emptyGrid, bldGrid, bldStyle, { grass:true });
      else if (option === 'forest'){
        const grid = grids.get(option);
        if (grid) drawForestGrid(grid);
      }
      else if (option === 'woods'){
        const grid = grids.get(option);
        if (grid) drawWoodsGrid(grid);
      }
      else if (option === 'parks'){
        const grid = grids.get(option);
        if (grid) drawParkGrid(grid);
      }
      else {
        const grid = grids.get(option);
        if (grid) drawGrid(grid, bldGrid, bldStyle, { grass:false, routeOption:option }, true);
      }
      renderOrder.push(`${z}:${option}`);
    }
  };

  // Z0〜Z4を固定し、同じZ階層内だけチェック順（後にチェックしたものほど前面）にする。
  drawRasterGroup('Z0', z0Ground);
  drawRasterGroup('Z1', z1Water);
  for (const option of layerOrder){
    if (!o[option] || !z2Routes.has(option)) continue;
    // standalone標準のcorridorは地表areaの後へ一括して合成する。
    if (STANDALONE_UNIFIED_STYLE && STANDALONE_STYLE_SPEC.corridor[option]) continue;
    if (CELL_ONLY_MODE){
      const grid = grids.get(option);
      if (grid) drawCellPixelArtTransportGrid(grid, option, cellRenderingStats, transportCenters.get(option));
      countCellFeatures(option);
    }
    else if (SMOOTH_ROAD_OPTIONS.has(option)) drawSmoothRoadLayer(option);
    else if (tunnelOptions.has(option)) drawTunnelLayer(option);
    else {
      const grid = grids.get(option);
      if (grid) drawGrid(grid, bldGrid, bldStyle, { grass:false, routeOption:option }, true);
    }
    renderOrder.push(`Z2:${option}`);
  }

  // 地上corridorは地表の上・建物の下。source geometryは変えず、建物との
  // 視覚衝突は「地上線を建物が遮蔽する」という全域共通の意味順で解決する。
  if (STANDALONE_UNIFIED_STYLE){
    for (const option of layerOrder){
      if (!o[option] || !STANDALONE_STYLE_SPEC.corridor[option]) continue;
      drawUnifiedCorridorLayer(option);
      renderOrder.push(`Z2:ground-corridor:${option}`);
    }
    unifiedLevelCrossingPoints=drawUnifiedLevelCrossings();
    if(unifiedLevelCrossingPoints.length)
      renderOrder.push('Z2:modifier:level-crossing');
  }

  if (o.buildings && STANDALONE_PRECISE_BUILDINGS){
    preciseBuildingLodStats = drawStandalonePreciseBuildings(
      preciseBuildingRaster, buildingKinds, buildingDescs, buildingAnchors, bldStyle,
      preciseSurfaceRoadMask, foregroundBuildingIds
    );
    renderOrder.push(STANDALONE_UNIFIED_STYLE ? 'Z3:building:precise-1px' : 'Z3:buildings:precise-1px');
  } else if (o.buildings){
    if (CELL_ONLY_MODE){
      drawCellPixelArtBuildingGrid(normalBuildingGrid, bldGrid, buildingKinds, buildingDescs, buildingAnchors, 'buildings', cellRenderingStats);
      countCellFeatures('buildings');
    } else {
      drawGrid(normalBuildingGrid, bldGrid, bldStyle, { grass:false, buildingKinds, buildingDescs, buildingAnchors }, true);
    }
    renderOrder.push('Z3:building');
  }
  if (STANDALONE_UNIFIED_STYLE && o.poi){
    // POI structureは通常建物と同じworld層。道路を避けて移動・変形せず、
    // 地上corridorを遮蔽する。object/markerは後段へ分離する。
    drawPoiStructures();
    renderOrder.push('Z3:symbol:structure');
  }
  // legacy描画だけは旧競合フォールバックを維持する。統一Style Specでは
  // 地理形状を不変にし、競合を理由に道路・建物を再配置または再描画しない。
  if (!STANDALONE_UNIFIED_STYLE && preciseBuildingRoadOverlapPixels){
    for (const option of layerOrder){
      if (!o[option] || !SMOOTH_ROAD_OPTIONS.has(option)) continue;
      drawSmoothRoadLayer(option);
    }
    renderOrder.push('Z3:surface-roads:conflict-fallback');
  }
  for (const option of layerOrder){
    if (!o[option] || !bridgeOptions.has(option)) continue;
    const bridgeOption = `bridge:${option}`;
    if (CELL_ONLY_MODE){
      const grid = grids.get(bridgeOption);
      if (grid) drawCellPixelArtTransportGrid(grid, option, cellRenderingStats, transportCenters.get(bridgeOption), true);
      countCellFeatures(bridgeOption);
    }
    else if (STANDALONE_UNIFIED_STYLE && STANDALONE_STYLE_SPEC.corridor[option])
      drawUnifiedCorridorLayer(option, true);
    else if (SMOOTH_ROAD_OPTIONS.has(option)) drawSmoothRoadLayer(option, true);
    else {
      const grid = grids.get(bridgeOption);
      if (grid) drawGrid(grid, bldGrid, bldStyle, { grass:false, routeOption:option }, true);
    }
    renderOrder.push(`Z3:bridge:${option}`);
  }
  if (o.buildings && !STANDALONE_PRECISE_BUILDINGS){
    if (CELL_ONLY_MODE)
      drawCellPixelArtBuildingGrid(poiBuildingGrid, bldGrid, buildingKinds, buildingDescs, buildingAnchors, 'poiBuildings', cellRenderingStats);
    else
      drawGrid(poiBuildingGrid, bldGrid, bldStyle, { grass:false, buildingKinds, buildingDescs, buildingAnchors }, true);
    renderOrder.push('Z3:poiBuilding');
  }

  if (CELL_ONLY_MODE){
    if (o.dots && !o.poi){
      drawCellDots(facilitiesInView.filter(p => p.representation !== 'cluster-member'));
      drawCellClusters();
      renderOrder.push('Z4:dots');
    }
    if (o.poi){
      drawCellPoi();
      renderOrder.push('Z4:poi');
    }
    if (o.terrainNames){
      drawCellTerrainSymbols();
      renderOrder.push('Z4:terrainSymbols');
    }
    // 地図地物と記号を意味セルバッファへ合成し終えてから、名称を鮮明に重ねる。
    flushSolidCellBuffer(cellRenderingStats);
    for (const option of layerOrder){
      if (!o[option] || !cellLabelDrawers[option]) continue;
      cellLabelDrawers[option]();
      renderOrder.push(`Z4:${option}`);
    }
  } else {
    for (const option of layerOrder){
      if (!o[option]) continue;
      if (drawers[option]) drawers[option]();
      else continue;
      renderOrder.push(`Z4:${option}`);
    }
  }
  const toolbar = document.getElementById('toolbar');
  toolbar.dataset.renderOrder = renderOrder.join(',');
  drawCurrentLocation();
  if (currentLocation){
    renderOrder.push('Z4:currentLocation');
    toolbar.dataset.renderOrder = renderOrder.join(',');
  }
  const classesBySource = Object.fromEntries(Object.entries(tileLayers).map(([name, layer]) => [
    name,
    [...new Set(layer.features.flatMap(feature =>
      [feature.props.class, feature.props.subclass].filter(Boolean)
    ))].sort(),
  ]));
  const featureCounts = Object.fromEntries(
    Object.entries(tileLayers).map(([name, layer]) => [name, layer.features.length])
  );
  const countBy = (items, keyFor) => items.reduce((counts, item) => {
    const key = keyFor(item);
    counts[key] = (counts[key] || 0) + 1;
    return counts;
  }, {});
  const decisionFingerprintFor = items => items
    .map(item => `${item.key}|${item.representation}|${item.worldX.toFixed(3)}|${item.worldY.toFixed(3)}|${item.assetSize || item.size}`)
    .sort()
    .reduce((hash,value) => {
      for(let index=0;index<value.length;index++) hash=Math.imul(hash^value.charCodeAt(index),16777619);
      return hash>>>0;
    },2166136261).toString(16).padStart(8,'0');
  const decisionFingerprint = decisionFingerprintFor(resolvedView.facilities);
  const decisionItemsByTile = new Map();
  for(const item of resolvedView.facilities){
    const key=`${Math.floor(item.sourceWorldX/W)}/${Math.floor(item.sourceWorldY/H)}`;
    if(!decisionItemsByTile.has(key)) decisionItemsByTile.set(key,[]);
    decisionItemsByTile.get(key).push(item);
  }
  const decisionFingerprintsByTile=Object.fromEntries([...decisionItemsByTile]
    .sort(([a],[b])=>a.localeCompare(b))
    .map(([key,items])=>[key,{count:items.length,fingerprint:decisionFingerprintFor(items)}]));
  const visibleMetricItems = facilitiesInView.filter(item => item.pt[0] >= 0 && item.pt[1] >= 0 && item.pt[0] <= W && item.pt[1] <= H);
  const quantiles = (items, key) => {
    const values = items.map(item => item.metrics[key]).sort((a,b) => a-b);
    const at = q => values.length ? values[Math.min(values.length - 1, Math.floor((values.length - 1) * q))] : 0;
    return { p25:at(.25), p50:at(.5), p75:at(.75), p90:at(.9), p99:at(.99), max:at(1) };
  };
  const gridCellCount = (option, id) => {
    const grid = grids.get(option);
    if (!grid) return 0;
    let count = 0;
    for (const cell of grid) if (cell === id) count++;
    return count;
  };
  const surfaceCellCounts = {
    forest:gridCellCount('forest', ID.FOREST),
    woods:gridCellCount('woods', ID.WOODS),
    parks:{
      small:gridCellCount('parks', ID.PARK),
      medium:gridCellCount('parks', ID.PARK_MEDIUM),
      large:gridCellCount('parks', ID.PARK_LARGE),
      reserve:gridCellCount('parks', ID.PARK_RESERVE),
    },
  };
  const corridorFamilyBindings = L('transportation').map(feature => corridorBinding(feature));
  const corridorModifierCounts = Object.fromEntries(
    ['bridge','construction','levelCrossing','tunnel','underground','service'].map(modifier => [
      modifier,corridorFamilyBindings.filter(binding => binding.modifiers[modifier]).length,
    ])
  );
  toolbar.dataset.renderMs = (performance.now() - renderStartedAt).toFixed(1);
  toolbar.dataset.renderCount = renderCount;
  window.PixelMapDiagnostics = {
    renderMode:RENDER_MODE,
    retainedSourceLayers:[...RETAINED_SOURCE_LAYERS],
    loadedSourceLayers:Object.keys(tileLayers),
    unexpectedSourceLayers:Object.keys(tileLayers).filter(name => !RETAINED_SOURCE_LAYERS.has(name)),
    featureCounts,
    classesBySource,
    surfaceCellCounts,
    activeOptions:Object.entries(o).filter(([, enabled]) => enabled).map(([name]) => name),
    layerOrder:[...layerOrder],
    renderOrder:[...renderOrder],
    buildingKindCounts:{ ...buildingKindCounts },
    buildingBandCounts:countBy(buildingDescs.filter(Boolean), d => String(d.band)),
    buildingCategoryCounts:countBy(buildingDescs.filter(Boolean).filter(d => d.glyph), d => d.glyph),
    buildingGeometry:{
      preciseLogicalPixelMask:STANDALONE_PRECISE_BUILDINGS,
      immutableSourceGeometry:STANDALONE_UNIFIED_STYLE,
      logicalPixels:preciseBuildingRaster ? preciseBuildingRaster.owner.reduce((count, bi) => count + (bi ? 1 : 0), 0) : 0,
      corridorOverlapPixels:preciseBuildingRoadOverlapPixels,
      corridorOverlapBuildings:preciseBuildingOverlapAudit?.buildings || 0,
      displacedBuildings:0,
      maximumDisplacementLogicalPixels:0,
      shadowsExcludedFromCorridors:Boolean(preciseSurfaceRoadMask),
      semanticLod:preciseBuildingLodStats ? {
        mode:WORLD_STYLE.building.mode,
        detailedBuildings:preciseBuildingLodStats.detailedBuildings,
        quietBuildings:preciseBuildingLodStats.quietBuildings,
        omittedMicroBuildings:preciseBuildingLodStats.omittedMicroBuildings,
      } : null,
    },
    corridorFamilies:{
      registryVersion:ASSET_FAMILY_REGISTRY.version,
      total:corridorFamilyBindings.length,
      families:countBy(corridorFamilyBindings, binding => binding.familyId),
      variants:countBy(corridorFamilyBindings, binding => binding.variantId),
      assets:countBy(corridorFamilyBindings, binding => binding.assetId),
      stateAssets:countBy(corridorFamilyBindings, binding => binding.stateAssetId),
      modifiers:corridorModifierCounts,
      derivedLevelCrossings:unifiedLevelCrossingPoints.length,
      fallbacks:corridorFamilyBindings.filter(binding => binding.fallback).length,
    },
    styleSpec:{
      enabled:STANDALONE_UNIFIED_STYLE,
      version:STANDALONE_STYLE_SPEC.version,
      primitives:['area','corridor','symbol'],
      corridorRenderer:STANDALONE_UNIFIED_STYLE ? 'continuous-distance-mask' : 'legacy-mixed',
      corridorRendererVersion:STANDALONE_UNIFIED_STYLE ? CORRIDOR_RENDERER.version : null,
      corridorContractVersion:STANDALONE_UNIFIED_STYLE ? LAYER_ASSET_CATALOG.corridorContractVersion : null,
      corridorPhase:STANDALONE_UNIFIED_STYLE ? 'source-line-distance' : 'legacy-screen-phase',
      compositor:STANDALONE_UNIFIED_STYLE
        ? [...WORLD_STYLE.compositor]
        : ['legacy-z-order'],
      symbolRenderer:STANDALONE_UNIFIED_STYLE ? 'existing-poi-asset' : 'legacy-building-sprite',
      symbolSizeTiers:[...STANDALONE_STYLE_SPEC.symbol.sizeTiers],
      symbolSelectionAuthority:STANDALONE_STYLE_SPEC.symbol.selectionAuthority,
      symbolSelectionOverride:WORLD_STYLE_MODE ? 'resolver-world-style-density-budget' : false,
      symbolAnchorMode:STANDALONE_UNIFIED_STYLE ? 'source-point' : 'legacy-pattern-offset',
      symbolCollisionBounds:STANDALONE_UNIFIED_STYLE ? 'poi-asset-measured-bounds' : 'legacy-radius',
      sourceGeometryImmutable:STANDALONE_UNIFIED_STYLE,
    },
    worldStyle:{
      enabled:WORLD_STYLE_MODE,
      version:WORLD_STYLE.version,
      id:WORLD_STYLE.id,
      assetPack:WORLD_STYLE_MODE ? WORLD_STYLE.assetPack : 'legacy',
      tileZoom:WORLD_STYLE.tileZoom,
      defaultProfile:WORLD_STYLE_MODE ? 'game' : STUDY_MODE ? 'study' : 'embedded',
      density:{
        maxIcons:WORLD_STYLE.density.maxIcons,
        selectedIcons:drawnIcons.length,
        rejectedIcons:viewportIconSelection.rejected.length,
        roleCounts:{...viewportIconSelection.roleCounts},
        categoryCounts:{...viewportIconSelection.categoryCounts},
      },
    },
    pattern:{
      id:ACTIVE_PATTERN.id,
      slug:ACTIVE_PATTERN.slug,
      name:ACTIVE_PATTERN.name,
      marker:ACTIVE_PATTERN.marker,
      drawOrder:ACTIVE_PATTERN.drawOrder,
    },
    tileZoom:TILE.z,
    pixel:{
      requestedScale:REQUESTED_DISPLAY_SCALE,
      effectiveScale:Number(document.documentElement.dataset.pixelScale || REQUESTED_DISPLAY_SCALE),
      sceneSize:SCENE_SIZE,
      presentationSize:PRESENTATION_SIZE,
      scenePixelsPerLogicalPixel:2,
      assetLogicalPixel:1,
      assetScenePixel:SCENE_PIXELS_PER_LOGICAL_PIXEL,
      quantizedAssetTiles:true,
      quantizedSceneRects:true,
    },
    minorRoutes:{
      standaloneMinimum:STANDALONE_MINIMUM_MINOR_ROUTES,
      unit:'logical-px',
      localRoadWidth:CELL_ONLY_MODE
        ? (STANDALONE_MINIMUM_MINOR_ROUTES ? 1 : CELL_DETAIL_SCALE) * MAP_CELL_LOGICAL_SIZE
        : STANDALONE_UNIFIED_STYLE
          ? STANDALONE_STYLE_SPEC.corridor.localRoads.width
          : SMOOTH_ROAD_STYLE.localRoads.width / SCENE_PIXELS_PER_LOGICAL_PIXEL,
      pathWidth:CELL_ONLY_MODE
        ? (STANDALONE_MINIMUM_MINOR_ROUTES ? 1 : CELL_DETAIL_SCALE) * MAP_CELL_LOGICAL_SIZE
        : STANDALONE_UNIFIED_STYLE
          ? STANDALONE_STYLE_SPEC.corridor.paths.width
          : STANDALONE_MINIMUM_MINOR_ROUTES ? 1 : 2,
      casingWidth:STANDALONE_UNIFIED_STYLE
        ? STANDALONE_STYLE_SPEC.corridor.localRoads.edgeWidth
        : SMOOTH_ROAD_STYLE.localRoads.casing / SCENE_PIXELS_PER_LOGICAL_PIXEL,
    },
    cellRendering:{
      enabled:CELL_ONLY_MODE,
      mode:RENDER_MODE,
      styleProfile:CELL_ONLY_MODE ? 'standard-pixel-art' : 'standard',
      cellLogicalPixels:MAP_CELL_LOGICAL_SIZE,
      cellScenePixels:CPX,
      gridCellsPerSide:GRID,
      singleColorCells:CELL_ONLY_MODE,
      semanticCellBuffer:CELL_ONLY_MODE,
      cellizedFeatures:CELL_ONLY_MODE ? cellRenderingStats.cellizedFeatures : 0,
      facilitySymbols:CELL_ONLY_MODE ? cellRenderingStats.facilitySymbols : 0,
      terrainSymbols:CELL_ONLY_MODE ? cellRenderingStats.terrainSymbols : 0,
      paintedCells:CELL_ONLY_MODE ? cellRenderingStats.paintedCells : 0,
      occupiedCells:CELL_ONLY_MODE ? cellRenderingStats.occupiedCells : 0,
      groundPatternCells:CELL_ONLY_MODE ? cellRenderingStats.groundPatternCells : 0,
      boundaryCells:CELL_ONLY_MODE ? cellRenderingStats.boundaryCells : 0,
      roadCasingCells:CELL_ONLY_MODE ? cellRenderingStats.roadCasingCells : 0,
      roadCenterCells:CELL_ONLY_MODE ? cellRenderingStats.roadCenterCells : 0,
      railTieCells:CELL_ONLY_MODE ? cellRenderingStats.railTieCells : 0,
      buildingDetailCells:CELL_ONLY_MODE ? cellRenderingStats.buildingDetailCells : 0,
      spriteCells:CELL_ONLY_MODE ? cellRenderingStats.spriteCells : 0,
      layerCells:CELL_ONLY_MODE ? { ...cellRenderingStats.layerCells } : {},
    },
    resolver:{
      algorithmVersion:RESOLVER.ALGORITHM_VERSION,
      resolvedTiles:resolvedView.resolvedTileCount,
      pendingTiles:resolvedView.pendingTiles,
    },
    landmarks:resolvedView.landmarks,
    poi:{
      total:resolvedView.facilities.length,
      visible:facilitiesInView.length,
      offscreen:resolvedView.facilities.length - facilitiesInView.length,
      icons:drawnIcons.length,
      dots:drawnDotCount,
      dotCandidates:hiddenPois.length,
      clusters:clusterMarks.length,
      clusteredMembers:facilitiesInView.filter(item => item.representation === 'cluster-member').length,
      mixedBuildings:facilitiesInView.filter(item => item.facilityRole === 'mixed_building').length,
      assetFamilyRegistryVersion:RESOLVER.assetFamilyRegistryVersion,
      assetPacks:countBy(facilitiesInView, item => item.assetPack || 'legacy-direct'),
      assetFamilies:countBy(facilitiesInView, item => item.assetFamily || 'unclassified'),
      assetVariants:countBy(facilitiesInView, item => item.assetVariant || 'unclassified'),
      spriteAssets:countBy(facilitiesInView, item => item.spriteKey || 'generic'),
      assetFallbacks:facilitiesInView.filter(item => item.assetFallback).length,
      selectionReasons:countBy(facilitiesInView, item => String(item.selectionReason || '').split(':')[0]),
      sizes:countBy(drawnIcons, item => item.size),
      assetSizes:countBy(drawnIcons, item => item.displayAssetSize || item.assetSize || item.size),
      categories:countBy(drawnIcons, item => item.category),
      semanticRoles:countBy(drawnIcons, semanticRoleForPoi),
      anchorModes:countBy(drawnIcons, item => item.anchorMode || 'legacy'),
      contractVersions:countBy(drawnIcons, item => item.contractVersion || 'legacy'),
      allContractVersions:countBy(resolvedView.facilities, item => item.contractVersion || 'legacy'),
      sourceCoordinateMismatches:resolvedView.facilities.filter(item =>
        item.worldX !== item.sourceWorldX || item.worldY !== item.sourceWorldY).length,
      viewportBudgetRejected:viewportIconSelection.rejected.length,
      viewportRoleCounts:{...viewportIconSelection.roleCounts},
      decisionFingerprint,
      decisionFingerprintsByTile,
      assetCounts:countBy(drawnIcons, item => String(item.assetCount)),
      maxHeight:drawnIcons.reduce((max, item) => Math.max(max, item.metrics.height), 0),
      maxArea:drawnIcons.reduce((max, item) => Math.max(max, item.metrics.area), 0),
      metrics:{ area:quantiles(visibleMetricItems,'area'), height:quantiles(visibleMetricItems,'height') },
    },
    renderMs:Number(toolbar.dataset.renderMs),
  };
  toolbar.dataset.diagnostics = JSON.stringify(window.PixelMapDiagnostics);
  presentScene();
}

/* =====================================================
   8. データ取得
   ===================================================== */
const msg = document.getElementById('msg');
const mapPosition = document.getElementById('mapPosition');
const locateBtn = document.getElementById('locateBtn');
const MOBILE_QUERY = '(max-width:760px), (max-height:500px)';
const DEFAULT_MSG = window.matchMedia(MOBILE_QUERY).matches
  ? 'ドラッグで マップをいどう。ばしょを タップして しらべよう。'
  : 'ドラッグで マップをいどう。アイコンや点も しらべられるよ。';
function appendMsgCursor(){
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  cursor.textContent = '▼';
  msg.append(cursor);
}
function setMsg(message){
  msg.replaceChildren();
  if (typeof message === 'string'){
    msg.append(document.createTextNode(message));
  } else {
    msg.append(document.createTextNode(message.before));
    const strong = document.createElement('b');
    strong.textContent = message.strong;
    msg.append(strong, document.createTextNode(message.after));
  }
  appendMsgCursor();
}
function showLoadError(){
  msg.replaceChildren(document.createTextNode('データを とりにいけなかった……'), document.createElement('br'));

  const details = document.createElement('small');
  details.style.color = '#a8a088';
  details.append(document.createTextNode('チャット内プレビューはCSPで外部通信がブロックされます。'));
  const recommendation = document.createElement('b');
  recommendation.textContent = 'このHTMLをダウンロードしてブラウザで開く';
  details.append(recommendation, document.createTextNode('のがいちばん簡単です。'), document.createElement('br'));
  details.append(document.createTextNode('あるいは下のコマンドでタイルを保存して、ファイルとして読み込むこともできます:'), document.createElement('br'));
  const command = document.createElement('code');
  command.style.fontSize = '10px';
  command.style.color = '#88c860';
  command.textContent = `curl -o tile.pbf "${FALLBACK_TILE_URL
    .replace('{z}', TILE.z).replace('{x}', TILE.x).replace('{y}', TILE.y)}"`;
  details.append(command);

  const retry = document.createElement('button');
  retry.type = 'button';
  retry.className = 'retry';
  retry.textContent = 'もういちど ためす';

  const picker = document.createElement('input');
  picker.type = 'file';

  pickerButton.type = 'button';
  pickerButton.className = 'retry';
  pickerButton.textContent = 'PBFをひらく';
  pickerButton.addEventListener('click', () => picker.click());

  msg.append(details, document.createElement('br'), retry, document.createTextNode(' '), pickerButton, picker);

}

let tileTemplate = FALLBACK_TILE_URL;
let networkTilesEnabled = true;
let tileGeneration = 0;
const tileCache = new Map();
const tileLoads = new Map();
const tileKey = (x, y) => `${x}/${y}`;
const RETAINED_SOURCE_LAYERS = new Set([
  'landcover','landuse','park','water','waterway','transportation',
  'building','poi','aeroway','mountain_peak','place',
]);
function retainRpgLayers(layers){
  return Object.fromEntries(
    Object.entries(layers).filter(([name]) => RETAINED_SOURCE_LAYERS.has(name))
  );
}

function offsetTileLayers(layers, tileX, tileY, originX = TILE.x, originY = TILE.y){
  const dx = tileX - originX, dy = tileY - originY;
  for (const layer of Object.values(layers)){
    const ox = dx * layer.extent, oy = dy * layer.extent;
    for (const f of layer.features)
      for (const line of f.geom)
        for (const pt of line){ pt[0] += ox; pt[1] += oy; }
  }
  return layers;
}

function rebuildTileLayers(){
  const merged = {};
  const pointKeys = new Map();
  const pad = 96;
  const minDx = Math.floor((viewOffset.x - pad) / W);
  const maxDx = Math.floor((viewOffset.x + W + pad) / W);
  const minDy = Math.floor((viewOffset.y - pad) / H);
  const maxDy = Math.floor((viewOffset.y + H + pad) / H);
  for (let dy = minDy; dy <= maxDy; dy++){
    for (let dx = minDx; dx <= maxDx; dx++){
      const cached = tileCache.get(tileKey(TILE.x + dx, TILE.y + dy));
      if (!cached) continue;
      for (const [name, layer] of Object.entries(cached)){
        if (!merged[name]){
          merged[name] = { name, extent:layer.extent, features:[] };
          pointKeys.set(name, new Set());
        }
        for (const feature of layer.features){
          if (feature.type === 1){
            const props = feature.props;
            const coordinates = feature.geom.flat().map(point => `${point[0]},${point[1]}`).join(';');
            const key = `${feature.id ?? ''}|${props.class ?? ''}|${props.subclass ?? ''}|`+
              `${featureName(props) ?? ''}|${coordinates}`;
            if (pointKeys.get(name).has(key)) continue;
            pointKeys.get(name).add(key);
          }
          merged[name].features.push(feature);
        }
      }
    }
  }
  if (Object.keys(merged).length) tileLayers = merged;
}

/* --- 施設リゾルバー連携 ---
   icon / dot / cluster はワールド座標で事前確定し、正規MVTタイル単位でキャッシュする。
   キャッシュキーは (MVTタイル, パターン固定, tileGeneration)。レイヤー切り替えでは
   無効化しない（レイヤーは描画フィルタであって選抜の入力ではない）。 */
const resolvedTiles = new Map();   // "x/y" -> { generation, result }
function resolverGetTile(x, y){
  const max = 2 ** TILE.z;
  if (y < 0 || y >= max) return { empty:true };
  const layers = tileCache.get(tileKey(x, y));
  if (layers) return { layers, baseX:TILE.x, baseY:TILE.y };
  // ローカルPBFモードはMVTタイルを1枚しか持たないため、周辺を空MVTタイルとして扱う
  return networkTilesEnabled ? null : { empty:true };
}
function resolveTileFacilities(x, y){
  const key = tileKey(x, y);
  const cached = resolvedTiles.get(key);
  if (cached && cached.generation === tileGeneration) return cached.result;
  const result = RESOLVER.resolveTile({
    tileX:x,tileY:y,pattern:ACTIVE_PATTERN,getTile:resolverGetTile,
    assetCatalog:STANDALONE_UNIFIED_STYLE ? POI_SPRITE_CATALOG : null,
    sourceAnchored:STANDALONE_UNIFIED_STYLE,
    assetPack:ACTIVE_ASSET_PACK,
  });
  if (result) resolvedTiles.set(key, { generation:tileGeneration, result });
  return result;
}
function viewTileRange(pad = 96){
  const max = 2 ** TILE.z;
  return {
    minX:TILE.x + Math.floor((viewOffset.x - pad) / W),
    maxX:TILE.x + Math.floor((viewOffset.x + W + pad) / W),
    minY:Math.max(0, TILE.y + Math.floor((viewOffset.y - pad) / H)),
    maxY:Math.min(max - 1, TILE.y + Math.floor((viewOffset.y + H + pad) / H)),
  };
}
function collectResolvedFacilities(){
  const range = viewTileRange();
  const facilities = [], clusters = [];
  let resolvedTileCount = 0, pendingTiles = 0;
  for (let ty = range.minY; ty <= range.maxY; ty++){
    for (let tx = range.minX; tx <= range.maxX; tx++){
      const result = resolveTileFacilities(tx, ty);
      if (!result){ pendingTiles++; continue; }
      resolvedTileCount++;
      facilities.push(...result.facilities);
      clusters.push(...result.clusters);
    }
  }
  return { facilities, clusters, resolvedTileCount, pendingTiles };
}

async function fetchMapTile(x, y){
  const key = tileKey(x, y);
  if (tileCache.has(key)) return tileCache.get(key);
  const generation = tileGeneration;
  const loadKey = `${generation}:${key}`;
  if (tileLoads.has(loadKey)) return tileLoads.get(loadKey);
  const originX = TILE.x, originY = TILE.y;
  const max = 2 ** TILE.z;
  if (y < 0 || y >= max) return null;
  const request = (async () => {
    const wrappedX = ((x % max) + max) % max;
    const url = tileTemplate.replace('{z}', TILE.z).replace('{x}', wrappedX).replace('{y}', y);
    const res = await fetch(url);
    if (!res.ok) throw new Error(`tile fetch ${res.status}: ${x}/${y}`);
    const parsed = retainRpgLayers(parseTile(await maybeGunzip(await res.arrayBuffer())));
    const layers = offsetTileLayers(parsed, x, y, originX, originY);
    if (generation !== tileGeneration) return null;
    tileCache.set(key, layers);
    return layers;
  })();
  tileLoads.set(loadKey, request);
  try { return await request; }
  finally { tileLoads.delete(loadKey); }
}

function centerTile(){
  return {
    x: TILE.x + Math.floor((viewOffset.x + W / 2) / W),
    y: TILE.y + Math.floor((viewOffset.y + H / 2) / H),
  };
}

function updateMapPosition(){
  const t = centerTile();
  const pt = locationCanvasPoint();
  const atLocation = pt && Math.hypot(pt[0] - W / 2, pt[1] - H / 2) < 2;
  const prefix = atLocation
    ? `現在地 ${currentLocation.latitude.toFixed(5)}, ${currentLocation.longitude.toFixed(5)} / `
    : '';
  mapPosition.dataset.offsetX = viewOffset.x.toFixed(3);
  mapPosition.dataset.offsetY = viewOffset.y.toFixed(3);
  mapPosition.textContent = `${prefix}OpenFreeMap z${TILE.z} / ${t.x} / ${t.y} ─ 地理の読みやすさ`;
}

let ensureTilesRunning = false;
async function ensureTilesAround(){
  if (!networkTilesEnabled || ensureTilesRunning) return;
  ensureTilesRunning = true;
  const cacheSizeBefore = tileCache.size;
  try {
    // ビューポートにかかる各MVTタイルの3×3文脈まで先読みし、
    // 画面へ入る施設が常に確定済みの状態で描けるようにする。
    const range = viewTileRange();
    const requests = [];
    for (let ty = range.minY - 1; ty <= range.maxY + 1; ty++)
      for (let tx = range.minX - 1; tx <= range.maxX + 1; tx++)
        requests.push(fetchMapTile(tx, ty));
    await Promise.allSettled(requests);
  } finally {
    ensureTilesRunning = false;
  }
  if (tileCache.size === cacheSizeBefore) return;
  rebuildTileLayers();
  render();
  updateMapPosition();
}

async function maybeGunzip(buf){
  const b = new Uint8Array(buf);
  if (b[0] === 0x1f && b[1] === 0x8b){
    const ds = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
    return await new Response(ds).arrayBuffer();
  }
  return buf;
}
async function loadStandaloneLandmarkData(){
  if (!STANDALONE_LANDMARK_MODE){
    document.documentElement.dataset.landmarkEntities = 'disabled';
    return;
  }
  try {
    const [generatedResponse, overrideResponse] = await Promise.all([
      fetch(LANDMARK_GENERATED_DATA_URL),
      fetch(LANDMARK_OVERRIDE_DATA_URL),
    ]);
    if (!generatedResponse.ok) throw new Error(`landmark fetch ${generatedResponse.status}`);
    if (!overrideResponse.ok) throw new Error(`landmark override fetch ${overrideResponse.status}`);
    const [generated, overrides] = await Promise.all([
      generatedResponse.json(),
      overrideResponse.json(),
    ]);
    if (generated?.type !== 'FeatureCollection' || !Array.isArray(generated.features))
      throw new Error('invalid landmark FeatureCollection');
    landmarkFeatureCollection = LANDMARK_ENTITY_API.mergeOverrides(generated, overrides);
    landmarkLoadState = 'ready';
    document.documentElement.dataset.landmarkEntities = String(landmarkFeatureCollection.features.length);
  } catch (error) {
    landmarkLoadState = 'error';
    document.documentElement.dataset.landmarkEntities = 'error';
    console.warn('ランドマーク補助データを読み込めませんでした', error);
  }
}
async function loadFromBuffer(buf){
  tileGeneration++;
  networkTilesEnabled = false;
  tileCache.clear();
  tileLayers = null;
  currentLocation = null;
  viewOffset.x = 0;
  viewOffset.y = 0;
  const parsed = retainRpgLayers(parseTile(await maybeGunzip(buf)));
  tileCache.set(tileKey(TILE.x, TILE.y), offsetTileLayers(parsed, TILE.x, TILE.y));
  rebuildTileLayers();
  render();
  updateMapPosition();
  setMsg(DEFAULT_MSG);
}
async function loadTile(){
  setMsg('マップデータを よみこんでいる……');
  if (!networkTilesEnabled){ tileCache.clear(); tileLayers = null; }
  if (!CAPTURE_MODE){
    try {
      const tj = await (await fetch(TILEJSON_URL)).json();
      if (tj.tiles && tj.tiles[0]) tileTemplate = tj.tiles[0];
    } catch (e) {}
  }
  networkTilesEnabled = true;
  await fetchMapTile(TILE.x, TILE.y);
  await ensureTilesAround();
}
async function boot(){
  locateBtn.disabled = true;
  try { await document.fonts.load('17px DotGothic16'); } catch (e) {}
  buildTiles();
  applyInitialQueryViewport();
  try {
    await loadStandaloneLandmarkData();
    await loadTile();
    setMsg(DEFAULT_MSG);
  } catch (e) {
    console.error(e);
    window.PixelMapBootError = {name:e?.name || 'Error',message:String(e?.message || e),stack:String(e?.stack || '')};
    document.documentElement.dataset.bootError = String(e?.message || e);
    showLoadError();
  } finally {
    locateBtn.disabled = false;
  }
}
async function pickPbf(input){
  const file = input.files[0];
  if (!file) return;
  try {
    setMsg('ファイルを よみこんでいる……');
    await loadFromBuffer(await file.arrayBuffer());
  } catch (e) {
    console.error(e);
    setMsg(`このファイルは よめなかった……（gzip/生PBFの両対応です。z${TILE.z}タイルか確認してください）`);
  }
}

function tilePointFromCoordinates(latitude, longitude){
  const maxLat = 85.05112878;
  const lat = Math.max(-maxLat, Math.min(maxLat, latitude));
  const n = 2 ** TILE.z;
  const wrappedLon = ((longitude + 180) % 360 + 360) % 360 - 180;
  const tileX = (wrappedLon + 180) / 360 * n;
  const rad = lat * Math.PI / 180;
  const projectedY = (1 - Math.asinh(Math.tan(rad)) / Math.PI) / 2 * n;
  const tileY = Math.max(0, Math.min(n - 1e-7, projectedY));
  return { tileX, tileY };
}

function applyInitialQueryViewport(){
  if (!HAS_INITIAL_LOCATION) return;
  const point = tilePointFromCoordinates(INITIAL_LAT, INITIAL_LON);
  const maxTile = 2 ** TILE.z;
  const baseX = Math.max(0, Math.min(maxTile - 1, Math.floor(point.tileX)));
  const baseY = Math.max(0, Math.min(maxTile - 1, Math.floor(point.tileY)));
  TILE.x = baseX; TILE.y = baseY;
  viewOffset.x = (point.tileX - baseX) * W - W / 2;
  viewOffset.y = (point.tileY - baseY) * H - H / 2;
  currentLocation = null;
  cv.setAttribute('aria-label', `${INITIAL_PLACE}周辺の${ACTIVE_PATTERN.name}アイコン地図。ドラッグで移動できます`);
  updateMapPosition();
}

function geolocationErrorMessage(error){
  if (error?.code === 1) return '現在地の使用が 許可されていないよ。ブラウザの設定で 位置情報を許可してね。';
  if (error?.code === 2) return '現在地を みつけられなかった……電波のよい場所で もういちど試してね。';
  if (error?.code === 3) return '現在地の取得が タイムアウトした……もういちど試してね。';
  return '現在地を 取得できなかった……';
}

function getCurrentPosition(){
  return new Promise((resolve, reject) => navigator.geolocation.getCurrentPosition(resolve, reject, {
    enableHighAccuracy:true,
    timeout:15000,
    maximumAge:30000,
  }));
}

async function showCurrentPosition(position){
  const { latitude, longitude, accuracy } = position.coords;
  const point = tilePointFromCoordinates(latitude, longitude);
  const maxTile = 2 ** TILE.z;
  const baseX = Math.max(0, Math.min(maxTile - 1, Math.floor(point.tileX)));
  const baseY = Math.max(0, Math.min(maxTile - 1, Math.floor(point.tileY)));
  const previous = {
    tileX:TILE.x, tileY:TILE.y, offsetX:viewOffset.x, offsetY:viewOffset.y,
    location:currentLocation, layers:tileLayers, networkTilesEnabled,
    cache:new Map(tileCache),
  };

  tileGeneration++;
  tileCache.clear();
  tileLayers = null;
  networkTilesEnabled = true;
  TILE.x = baseX; TILE.y = baseY;
  viewOffset.x = (point.tileX - baseX) * W - W / 2;
  viewOffset.y = (point.tileY - baseY) * H - H / 2;
  currentLocation = {
    latitude, longitude,
    accuracy:Number.isFinite(accuracy) ? Math.max(0, accuracy) : 0,
    ...point,
  };
  updateMapPosition();

  try {
    await fetchMapTile(baseX, baseY);
    await ensureTilesAround();
    publishViewport();
  } catch (error) {
    tileGeneration++;
    TILE.x = previous.tileX; TILE.y = previous.tileY;
    viewOffset.x = previous.offsetX; viewOffset.y = previous.offsetY;
    currentLocation = previous.location;
    networkTilesEnabled = previous.networkTilesEnabled;
    tileCache.clear();
    for (const [key, layers] of previous.cache) tileCache.set(key, layers);
    tileLayers = previous.layers;
    render();
    updateMapPosition();
    throw error;
  }
}

async function locateMe(){
  if (!('geolocation' in navigator)){
    setMsg('このブラウザでは 現在地を取得できないよ。');
    return;
  }
  if (!window.isSecureContext){
    setMsg('現在地の取得には HTTPS または localhost で開く必要があるよ。');
    return;
  }

  locateBtn.disabled = true;
  locateBtn.textContent = '◎ さがしている…';
  setMsg('現在地を さがしている……');
  try {
    const position = await getCurrentPosition();
    setMsg('現在地の マップを よみこんでいる……');
    await showCurrentPosition(position);
    setMsg(`現在地に いどうしたよ。（精度 約${Math.round(position.coords.accuracy)}m）`);
  } catch (error) {
    console.error(error);
    const isPositionError = Number.isInteger(error?.code) && error.code >= 1 && error.code <= 3;
    setMsg(isPositionError
      ? geolocationErrorMessage(error)
      : '現在地は取得できたけれど、マップを よみこめなかった……');
  } finally {
    locateBtn.disabled = false;
    locateBtn.textContent = '◎ 現在地へ';
  }
}
