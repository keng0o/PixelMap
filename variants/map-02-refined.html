const preciseBuildingLayerCanvas = document.createElement('canvas');
preciseBuildingLayerCanvas.width = preciseBuildingLayerCanvas.height = SCENE_SIZE;
const preciseBuildingLayerContext = preciseBuildingLayerCanvas.getContext('2d');
preciseBuildingLayerContext.imageSmoothingEnabled = false;
quantizeContextFillRects(preciseBuildingLayerContext);
const preciseBuildingMaskCanvas = document.createElement('canvas');
preciseBuildingMaskCanvas.width = preciseBuildingMaskCanvas.height = PRESENTATION_SIZE;
const preciseBuildingMaskContext = preciseBuildingMaskCanvas.getContext('2d');
const preciseBuildingDetailCanvas = document.createElement('canvas');
preciseBuildingDetailCanvas.width = preciseBuildingDetailCanvas.height = PRESENTATION_SIZE;
const preciseBuildingDetailContext = preciseBuildingDetailCanvas.getContext('2d');
const preciseRoadMaskCanvas = document.createElement('canvas');
preciseRoadMaskCanvas.width = preciseRoadMaskCanvas.height = PRESENTATION_SIZE;
const preciseRoadMaskContext = preciseRoadMaskCanvas.getContext('2d', { willReadFrequently:true });
const unifiedCorridorCanvas = document.createElement('canvas');
unifiedCorridorCanvas.width = unifiedCorridorCanvas.height = PRESENTATION_SIZE;
const unifiedCorridorContext = unifiedCorridorCanvas.getContext('2d');
const unifiedAreaMaskCanvas = document.createElement('canvas');
unifiedAreaMaskCanvas.width = unifiedAreaMaskCanvas.height = PRESENTATION_SIZE;
const unifiedAreaMaskContext = unifiedAreaMaskCanvas.getContext('2d', { willReadFrequently:true });

function logicalPointForMapGeometry(point){
  const [sceneX, sceneY] = tp(point);
  return [
    Math.round(sceneX / SCENE_PIXELS_PER_LOGICAL_PIXEL),
    Math.round(sceneY / SCENE_PIXELS_PER_LOGICAL_PIXEL),
  ];
}

function worldLogicalPhase(x, y, period){
  const worldSceneX = x * SCENE_PIXELS_PER_LOGICAL_PIXEL + viewOffset.x + TILE.x * W;
  const worldSceneY = y * SCENE_PIXELS_PER_LOGICAL_PIXEL + viewOffset.y + TILE.y * H;
  const worldX = Math.floor(worldSceneX / SCENE_PIXELS_PER_LOGICAL_PIXEL);
  const worldY = Math.floor(worldSceneY / SCENE_PIXELS_PER_LOGICAL_PIXEL);
  return positiveModulo(worldX + worldY * 3, period);
}

function buildUnifiedCorridorMasks(features, style){
  return CORRIDOR_RENDERER.buildMasks({
    width:PRESENTATION_SIZE,
    height:PRESENTATION_SIZE,
    features,
    style,
    pointFor:logicalPointForMapGeometry,
    phaseAt:(x,y)=>worldLogicalPhase(x,y,65521),
    maskContext:unifiedAreaMaskContext,
  });
}

function corridorModifierStyle(style,modifier){
  const contract=WORLD_STYLE.corridorModifiers?.[modifier];
  if(!contract) return style;
  if(modifier==='bridge') return {
    ...style,
    edgeWidth:Math.max(contract.minimumEdgeWidth || 0,style.edgeWidth || 0),
    edge:contract.edge || style.edge,
  };
  return style;
}

function renderUnifiedCorridor(features, style, bridge = false, preparedMasks = null){
  if (!features.length) return null;
  const bridgeStyle = bridge ? corridorModifierStyle(style,'bridge') : style;
  const masks=CORRIDOR_RENDERER.render(unifiedCorridorContext,{
    width:PRESENTATION_SIZE,
    height:PRESENTATION_SIZE,
    features,
    style:bridgeStyle,
    pointFor:logicalPointForMapGeometry,
    phaseAt:(x,y)=>worldLogicalPhase(x,y,65521),
    maskContext:unifiedAreaMaskContext,
    preparedMasks,
  });
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(
    unifiedCorridorCanvas,
    0, 0, PRESENTATION_SIZE, PRESENTATION_SIZE,
    0, 0, SCENE_SIZE, SCENE_SIZE
  );
  ctx.restore();
  return masks;
}

// 元ポリゴンを出力画素の中心で走査する。8×8論理pxセルを膨張させず、
// 屋根模様とは独立した棟IDの意味マスクを作る。
function rasterizeStandaloneBuildingPixels(bldUnits){
  const size = PRESENTATION_SIZE;
  const owner = new Uint32Array(size * size);
  for (let unitIndex = 0; unitIndex < bldUnits.length; unitIndex++){
    const bi = unitIndex + 1;
    const rings = bldUnits[unitIndex].rings.map(ring => ring.map(point => {
      const [sceneX, sceneY] = tp(point);
      return [sceneX / SCENE_PIXELS_PER_LOGICAL_PIXEL, sceneY / SCENE_PIXELS_PER_LOGICAL_PIXEL];
    }));
    let minY = Infinity, maxY = -Infinity;
    for (const ring of rings) for (const [, y] of ring){
      minY = Math.min(minY, y);
      maxY = Math.max(maxY, y);
    }
    const y0 = Math.max(0, Math.ceil(minY - .5));
    const y1 = Math.min(size - 1, Math.floor(maxY - .5));
    let painted = false;
    for (let y = y0; y <= y1; y++){
      const sampleY = y + .5;
      const intersections = [];
      for (const ring of rings){
        for (let i = 0; i + 1 < ring.length; i++){
          const [xa, ya] = ring[i], [xb, yb] = ring[i + 1];
          if ((ya <= sampleY) !== (yb <= sampleY))
            intersections.push(xa + (sampleY - ya) * (xb - xa) / (yb - ya));
        }
      }
      intersections.sort((a, b) => a - b);
      for (let i = 0; i + 1 < intersections.length; i += 2){
        const x0 = Math.max(0, Math.ceil(intersections[i] - .5));
        const x1 = Math.min(size - 1, Math.floor(intersections[i + 1] - .5));
        for (let x = x0; x <= x1; x++){
          owner[y * size + x] = bi;
          painted = true;
        }
      }
    }
    // 1論理pxの中心も含まない極小棟だけ、重心位置へ最小1pxを残す。
    if (!painted && rings[0]?.length){
      let sx = 0, sy = 0;
      for (const [x, y] of rings[0]){ sx += x; sy += y; }
      const x = Math.floor(sx / rings[0].length);
      const y = Math.floor(sy / rings[0].length);
      if (x >= 0 && y >= 0 && x < size && y < size) owner[y * size + x] = bi;
    }
  }
  const pixelCounts = new Uint32Array(bldUnits.length + 1);
  for (const bi of owner) if (bi) pixelCounts[bi]++;
  return { owner, pixelCounts, size };
}

// 地理形状は不変に保ち、競合は診断値としてだけ記録する。
// 表示密度が足りない場合の対応はズーム別LODで行い、衝突後の移動・変形はしない。
function auditStandaloneBuildingCorridorOverlap(raster, corridorMask){
  let overlapPixels = 0;
  const buildingIds = new Set();
  for (let index = 0; index < raster.owner.length; index++){
    const buildingId = raster.owner[index];
    if (!buildingId || !corridorMask[index]) continue;
    overlapPixels++;
    buildingIds.add(buildingId);
  }
  return Object.freeze({ overlapPixels, buildings:buildingIds.size });
}

// z14では全棟のsource形状を保持しつつ、通常小規模棟だけを安定したLODへ分ける。
// 大型・中高層・POI棟は常に詳細、住宅はringKey由来seedの共通比率で詳細化する。
// ビューポート座標や道路との衝突を入力にしないため、パンや場所別例外で変化しない。
function selectWorldStyleBuildingLod(raster, buildingKinds, buildingDescs, foregroundBuildingIds = new Set()){
  const detailed = new Uint8Array(raster.pixelCounts.length);
  let detailedBuildings = 0, quietBuildings = 0, omittedMicroBuildings = 0;
  for (let bi = 1; bi < raster.pixelCounts.length; bi++){
    if (!raster.pixelCounts[bi]) continue;
    const desc = buildingDescs[bi];
    const alwaysDetailed = foregroundBuildingIds.has(bi) || desc?.areaClass !== 'S' ||
      (Number(desc?.band || 0) >= 3 && raster.pixelCounts[bi] >= WORLD_STYLE.building.minimumTallDetailedArea);
    const sampled = raster.pixelCounts[bi] >= WORLD_STYLE.building.sampledMinimumArea &&
      positiveModulo(Number(desc?.lodSeed || bi), WORLD_STYLE.building.detailedSmallModulo) === 0;
    if (!WORLD_STYLE_MODE || alwaysDetailed || sampled){
      detailed[bi] = 1;
      detailedBuildings++;
    } else if (raster.pixelCounts[bi] >= WORLD_STYLE.building.quietMinimumArea){
      quietBuildings++;
    } else {
      omittedMicroBuildings++;
    }
  }
  return Object.freeze({ detailed, detailedBuildings, quietBuildings, omittedMicroBuildings });
}

// 建物チップを置く粗いセルは、正確な意味マスクが触れた詳細棟のセルから作る。
// 同一セルに複数棟がある場合だけ、占有画素数（同数ならPOI）で代表棟を選ぶ。
function preciseBuildingTextureGrid(raster, buildingKinds, detailedBuildings = null){
  const RG = GRID + 2;
  const votes = new Array(RG * RG);
  for (let y = 0; y < raster.size; y++) for (let x = 0; x < raster.size; x++){
    const bi = raster.owner[y * raster.size + x];
    if (!bi || (detailedBuildings && !detailedBuildings[bi])) continue;
    const sceneX = (x + .5) * SCENE_PIXELS_PER_LOGICAL_PIXEL;
    const sceneY = (y + .5) * SCENE_PIXELS_PER_LOGICAL_PIXEL;
    const gx = Math.floor((sceneX - gridShiftX) / CPX);
    const gy = Math.floor((sceneY - gridShiftY) / CPX);
    if (gx < 0 || gy < 0 || gx >= RG || gy >= RG) continue;
    const index = gy * RG + gx;
    const cellVotes = votes[index] || (votes[index] = new Map());
    cellVotes.set(bi, (cellVotes.get(bi) || 0) + 1);
  }
  const grid = new Uint8Array(RG * RG);
  const bldGrid = new Uint16Array(RG * RG);
  for (let index = 0; index < votes.length; index++){
    const cellVotes = votes[index];
    if (!cellVotes) continue;
    let selected = 0, selectedCount = -1;
    for (const [bi, count] of cellVotes){
      const selectedPoi = selected && buildingKinds[selected] !== 'normal';
      const candidatePoi = buildingKinds[bi] !== 'normal';
      if (count > selectedCount || (count === selectedCount && candidatePoi && !selectedPoi)){
        selected = bi;
        selectedCount = count;
      }
    }
    grid[index] = ID.BLD;
    bldGrid[index] = selected;
  }
  return { grid, bldGrid };
}

// 建物の南影だけが地表道路へ乗らないよう、実際の道路ストロークと同じ幅で
// 論理pxマスクを作る。建物本体はこのマスクで削らない。
function standaloneSurfaceRoadMask(options, transportationFeatures){
  const mask = preciseRoadMaskContext;
  mask.save();
  mask.setTransform(1, 0, 0, 1, 0, 0);
  mask.clearRect(0, 0, PRESENTATION_SIZE, PRESENTATION_SIZE);
  mask.fillStyle = '#fff';
  mask.strokeStyle = '#fff';
  mask.lineCap = 'round';
  mask.lineJoin = 'round';
  for (const feature of transportationFeatures){
    const binding = corridorBinding(feature);
    const option = binding.assetId;
    const style = SMOOTH_ROAD_STYLE[option];
    if (!style || !options[option]) continue;
    const isBridge = binding.modifiers.bridge;
    const isTunnel = binding.modifiers.tunnel;
    if (isBridge || isTunnel) continue;
    const trace = close => {
      mask.beginPath();
      for (const line of feature.geom){
        line.forEach((point, index) => {
          const [sceneX, sceneY] = tp(point);
          const x = Math.round(sceneX / SCENE_PIXELS_PER_LOGICAL_PIXEL);
          const y = Math.round(sceneY / SCENE_PIXELS_PER_LOGICAL_PIXEL);
          index ? mask.lineTo(x, y) : mask.moveTo(x, y);
        });
        if (close) mask.closePath();
      }
    };
    if (feature.type === 3){
      trace(true);
      mask.fill('evenodd');
      mask.lineWidth = style.casing;
      if (mask.lineWidth > 0) mask.stroke();
    } else if (feature.type === 2){
      trace(false);
      mask.lineWidth = (style.width + style.casing * 2) / SCENE_PIXELS_PER_LOGICAL_PIXEL;
      mask.stroke();
    }
  }
  mask.restore();
  const rgba = mask.getImageData(0, 0, PRESENTATION_SIZE, PRESENTATION_SIZE).data;
  const road = new Uint8Array(PRESENTATION_SIZE * PRESENTATION_SIZE);
  for (let i = 0; i < road.length; i++) road[i] = rgba[i * 4 + 3] >= 96 ? 1 : 0;
  return road;
}

function putLogicalImageData(target, data){
  target.putImageData(data, 0, 0);
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(target.canvas, 0, 0, PRESENTATION_SIZE, PRESENTATION_SIZE, 0, 0, SCENE_SIZE, SCENE_SIZE);
  ctx.restore();
}

function drawStandalonePreciseBuildings(
  raster, buildingKinds, buildingDescs, buildingAnchors, bldStyle, roadMask,
  foregroundBuildingIds = new Set()
){
  const lod = selectWorldStyleBuildingLod(
    raster, buildingKinds, buildingDescs, foregroundBuildingIds
  );
  const { grid, bldGrid } = preciseBuildingTextureGrid(raster, buildingKinds, lod.detailed);
  const size = raster.size;

  // quiet棟も正確なfootprintのまま残すが、黒い輪郭・屋根ディテールを付けず
  // landuse上の低コントラストareaとして扱う。1px未満相当の微小棟はLODで省略する。
  if (WORLD_STYLE_MODE){
    const quiet = preciseBuildingDetailContext.createImageData(size, size);
    const fillCache = new Map();
    for (let index = 0; index < raster.owner.length; index++){
      const bi = raster.owner[index];
      if (!bi || lod.detailed[bi] || raster.pixelCounts[bi] < WORLD_STYLE.building.quietMinimumArea) continue;
      const seed = Number(buildingDescs[bi]?.lodSeed || bi);
      const fillIndex = positiveModulo(seed, WORLD_STYLE.building.quietFills.length);
      let rgba = fillCache.get(fillIndex);
      if (!rgba){
        rgba = solidCellRgba(WORLD_STYLE.building.quietFills[fillIndex]);
        fillCache.set(fillIndex, rgba);
      }
      const pixel = index * 4;
      quiet.data[pixel] = rgba[0];
      quiet.data[pixel + 1] = rgba[1];
      quiet.data[pixel + 2] = rgba[2];
      quiet.data[pixel + 3] = 255;
    }
    putLogicalImageData(preciseBuildingDetailContext, quiet);
  }

  // 最終輪郭から1論理pxの南影を作る。他の建物には重ねない。
  // roadMaskは地表corridor上へ建物の南影だけが落ちないように使う。
  // 建物本体やsource geometryは削らず、全域で同じ遮蔽規則を適用する。
  const shadow = preciseBuildingDetailContext.createImageData(size, size);
  for (let y = 1; y < size; y++) for (let x = 0; x < size; x++){
    const index = y * size + x;
    const northBuilding = raster.owner[index - size];
    if (raster.owner[index] || !northBuilding || !lod.detailed[northBuilding] || roadMask?.[index]) continue;
    const pixel = index * 4;
    shadow.data[pixel] = 24;
    shadow.data[pixel + 1] = 32;
    shadow.data[pixel + 2] = 20;
    shadow.data[pixel + 3] = 72;
  }
  putLogicalImageData(preciseBuildingDetailContext, shadow);

  // 既存の8×8論理px屋根・壁・施設記号を透明レイヤーへ描き、
  // 1論理px意味マスクでだけ切り取る。
  preciseBuildingLayerContext.save();
  preciseBuildingLayerContext.setTransform(1, 0, 0, 1, 0, 0);
  preciseBuildingLayerContext.globalCompositeOperation = 'source-over';
  preciseBuildingLayerContext.clearRect(0, 0, SCENE_SIZE, SCENE_SIZE);
  drawGrid(grid, bldGrid, bldStyle,
    { grass:false, buildingKinds, buildingDescs, buildingAnchors }, true, preciseBuildingLayerContext);
  preciseBuildingLayerContext.globalCompositeOperation = 'destination-in';
  preciseBuildingLayerContext.imageSmoothingEnabled = false;
  const maskImage = preciseBuildingMaskContext.createImageData(size, size);
  for (let i = 0; i < raster.owner.length; i++){
    if (!raster.owner[i] || !lod.detailed[raster.owner[i]]) continue;
    const pixel = i * 4;
    maskImage.data[pixel] = maskImage.data[pixel + 1] = maskImage.data[pixel + 2] = 255;
    maskImage.data[pixel + 3] = 255;
  }
  preciseBuildingMaskContext.putImageData(maskImage, 0, 0);
  preciseBuildingLayerContext.drawImage(
    preciseBuildingMaskCanvas,
    0, 0, PRESENTATION_SIZE, PRESENTATION_SIZE,
    0, 0, SCENE_SIZE, SCENE_SIZE
  );
  preciseBuildingLayerContext.restore();
  ctx.drawImage(preciseBuildingLayerCanvas, 0, 0);

  // クリップ後の輪郭を1論理pxで描き直し、切断面ではなく意図したドット輪郭にする。
  const detail = preciseBuildingDetailContext.createImageData(size, size);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++){
    const index = y * size + x;
    const bi = raster.owner[index];
    if (!bi || !lod.detailed[bi] || raster.pixelCounts[bi] < 3) continue;
    const north = y > 0 ? raster.owner[index - size] : 0;
    const south = y + 1 < size ? raster.owner[index + size] : 0;
    const west = x > 0 ? raster.owner[index - 1] : 0;
    const east = x + 1 < size ? raster.owner[index + 1] : 0;
    let color = null;
    const pal = buildingDescs[bi]?.pal || ROOFPAL[0];
    if (west !== bi || east !== bi) color = P.outline;
    else if (south !== bi) color = pal[1];
    else if (north !== bi) color = pal[2];
    if (!color) continue;
    const rgba = solidCellRgba(color);
    const pixel = index * 4;
    detail.data[pixel] = rgba[0];
    detail.data[pixel + 1] = rgba[1];
    detail.data[pixel + 2] = rgba[2];
    detail.data[pixel + 3] = 255;
  }
  putLogicalImageData(preciseBuildingDetailContext, detail);
  return lod;
}

// 森林は他の地表と分離して描画し、連続面・林縁・植生の違いを専用アセットで表す。
function drawForestGrid(grid){
  const RG = GRID + 2;
  const at = (x, y) => (x < 0 || y < 0 || x >= RG || y >= RG) ? ID.GRASS : grid[y * RG + x];
  const put = (name, x, y) => ctx.drawImage(TILES[name], gridShiftX + x * CPX, gridShiftY + y * CPX);
  const boundary = (x, y, dir) => {
    const px = gridShiftX + x * CPX, py = gridShiftY + y * CPX;
    ctx.fillStyle = P.forestDeep;
    if (dir === 'L') ctx.fillRect(px, py, 3, CPX);
    if (dir === 'R') ctx.fillRect(px + CPX - 3, py, 3, CPX);
    if (dir === 'U') ctx.fillRect(px, py, CPX, 3);
    if (dir === 'D') ctx.fillRect(px, py + CPX - 4, CPX, 4);
    ctx.fillStyle = P.forestLight;
    if (dir === 'L') ctx.fillRect(px + 3, py + 3, 1, 5);
    if (dir === 'R') ctx.fillRect(px + CPX - 4, py + 8, 1, 5);
    if (dir === 'U') ctx.fillRect(px + 3, py + 3, 5, 1);
    if (dir === 'D') ctx.fillRect(px + 8, py + CPX - 5, 5, 1);
  };

  for (let y = 0; y < RG; y++){
    for (let x = 0; x < RG; x++){
      if (at(x, y) !== ID.FOREST) continue;
      const h = cellHash(x, y);
      const interior = at(x-1,y) === ID.FOREST && at(x+1,y) === ID.FOREST &&
        at(x,y-1) === ID.FOREST && at(x,y+1) === ID.FOREST;
      const asset = interior && h >= 94
        ? 'forestClearing'
        : h < 48 ? 'forestBroad0' : h < 78 ? 'forestBroad1' : 'forestPine';
      put(asset, x, y);
      if (at(x-1,y) !== ID.FOREST) boundary(x, y, 'L');
      if (at(x+1,y) !== ID.FOREST) boundary(x, y, 'R');
      if (at(x,y-1) !== ID.FOREST) boundary(x, y, 'U');
      if (at(x,y+1) !== ID.FOREST) boundary(x, y, 'D');
    }
  }
}

function drawWoodsGrid(grid){
  const RG = GRID + 2;
  const at = (x, y) => (x < 0 || y < 0 || x >= RG || y >= RG) ? ID.GRASS : grid[y * RG + x];
  const put = (name, x, y) => ctx.drawImage(TILES[name], gridShiftX + x * CPX, gridShiftY + y * CPX);
  const boundary = (x, y, dir) => {
    const px = gridShiftX + x * CPX, py = gridShiftY + y * CPX;
    ctx.fillStyle = P.woodsDeep;
    if (dir === 'L') ctx.fillRect(px, py, 2, CPX);
    if (dir === 'R') ctx.fillRect(px + CPX - 2, py, 2, CPX);
    if (dir === 'U') ctx.fillRect(px, py, CPX, 2);
    if (dir === 'D') ctx.fillRect(px, py + CPX - 2, CPX, 2);
    ctx.fillStyle = P.woodsLight;
    if (dir === 'L') ctx.fillRect(px + 2, py + 4, 1, 4);
    if (dir === 'R') ctx.fillRect(px + CPX - 3, py + 9, 1, 4);
    if (dir === 'U') ctx.fillRect(px + 4, py + 2, 4, 1);
    if (dir === 'D') ctx.fillRect(px + 9, py + CPX - 3, 4, 1);
  };
  for (let y = 0; y < RG; y++){
    for (let x = 0; x < RG; x++){
      if (at(x, y) !== ID.WOODS) continue;
      const h = cellHash(x, y);
      const interior = at(x-1,y) === ID.WOODS && at(x+1,y) === ID.WOODS &&
        at(x,y-1) === ID.WOODS && at(x,y+1) === ID.WOODS;
      put(interior && h >= 94 ? 'woodsLane' : h < 35 ? 'woodsCopse0' : h < 70 ? 'woodsCopse1' : 'woodsOpen', x, y);
      if (at(x-1,y) !== ID.WOODS) boundary(x, y, 'L');
      if (at(x+1,y) !== ID.WOODS) boundary(x, y, 'R');
      if (at(x,y-1) !== ID.WOODS) boundary(x, y, 'U');
      if (at(x,y+1) !== ID.WOODS) boundary(x, y, 'D');
    }
  }
}

function drawParkGrid(grid){
  const RG = GRID + 2;
  const at = (x, y) => (x < 0 || y < 0 || x >= RG || y >= RG) ? ID.GRASS : grid[y * RG + x];
  const put = (name, x, y) => ctx.drawImage(TILES[name], gridShiftX + x * CPX, gridShiftY + y * CPX);
  const boundary = (x, y, dir, id) => {
    const px = gridShiftX + x * CPX, py = gridShiftY + y * CPX;
    const thick = id === ID.PARK ? 4 : id === ID.PARK_MEDIUM ? 3 : 2;
    ctx.fillStyle = P.treeDk;
    if (dir === 'L') ctx.fillRect(px, py, thick, CPX);
    if (dir === 'R') ctx.fillRect(px + CPX - thick, py, thick, CPX);
    if (dir === 'U') ctx.fillRect(px, py, CPX, thick);
    if (dir === 'D') ctx.fillRect(px, py + CPX - thick, CPX, thick);
    ctx.fillStyle = P.treeMd;
    if (dir === 'L') ctx.fillRect(px + thick, py + 4, 1, 5);
    if (dir === 'R') ctx.fillRect(px + CPX - thick - 1, py + 7, 1, 5);
    if (dir === 'U') ctx.fillRect(px + 4, py + thick, 5, 1);
    if (dir === 'D') ctx.fillRect(px + 7, py + CPX - thick - 1, 5, 1);
  };
  for (let y = 0; y < RG; y++){
    for (let x = 0; x < RG; x++){
      const id = at(x, y);
      if (!isPark(id)) continue;
      const h = cellHash(x, y), wx = gridOriginX + x, wy = gridOriginY + y;
      if (id === ID.PARK_RESERVE){
        // 国立公園・保護区は土地被覆ではないため、森や林を塗り潰さず境界だけを示す。
      } else if (id === ID.PARK){
        put(h < 50 ? 'parkPocket0' : 'parkPocket1', x, y);
      } else if (id === ID.PARK_MEDIUM){
        put(h < 30 ? 'parkTree' : h < 58 ? 'parkMeadow' : h < 74 ? 'parkFlower' : h < 86 ? 'bench' : 'lawn', x, y);
      } else {
        const verticalPath = ((wx % 13) + 13) % 13 === 0;
        const horizontalPath = ((wy % 11) + 11) % 11 === 0;
        put(verticalPath ? 'parkPromenadeV' : horizontalPath ? 'parkPromenadeH'
          : h < 56 ? 'parkMeadow' : h < 76 ? 'parkGrove' : h < 86 ? 'parkGrandGarden' : 'lawn', x, y);
      }
      for (const [dir, nx, ny] of [['L',x-1,y],['R',x+1,y],['U',x,y-1],['D',x,y+1]]){
        const neighbor = at(nx, ny);
        if (!isPark(neighbor) && neighbor !== ID.FOREST && neighbor !== ID.WOODS) boundary(x, y, dir, id);
      }
    }
  }
}

/* =====================================================
   6. スプライト・ラベル（前版から流用、パレットのみ調整）
   ===================================================== */
const OUT = P.outline;
let spritePaintContext = ctx;
const px = (x, y, w, h, c) => {
  spritePaintContext.fillStyle = c;
  spritePaintContext.fillRect(x, y, w, h);
};

/* --- スプライト共通: 輪郭は接地部だけ。陰影で立体感を出す --- */
const sh = (hex, f = 0.72) => {                 // 暗く
  const n = parseInt(hex.slice(1), 16);

  const candidates = [

  const rect = candidates.find(r => !hits(r));
  if (!rect) return null;
