/* --- 単体ページ用ランドマーク施設 ---
   raw OSMから事前生成したGeoJSONの親施設・代表子施設を、通常POIとは別枠で
   読み込む。「施設」では通常POIアセットを出さず、建物型は正本形状、
   公園・神社仏閣は単色の小さなマーカーで描画する。 */
const LANDMARK_ENTITY_API = window.PixelMapLandmarkEntities;
function landmarkWorldPoint(coordinate){
  const point = tilePointFromCoordinates(coordinate[1], coordinate[0]);
  return [point.tileX * W, point.tileY * H];
}
function landmarkAreaCells(areaM2, latitude){
  const metersPerTile = 40075016.686 * Math.cos(latitude * Math.PI / 180) / (2 ** TILE.z);
  const metersPerScenePixel = metersPerTile / W;
  return Number(areaM2 || 0) / Math.max(1, metersPerScenePixel ** 2 * STANDARD_CPX ** 2);
}
function makeLandmarkFacility(feature, coordinate){
  const props = feature.properties || {};
  const renderClass = props.render_class || props.class || 'attraction';
  const category = props.category || 'landmark';
  const size = props.icon_size || (props.role === 'complex' ? 'L' : 'M');
  const visualScale = ACTIVE_PATTERN.scale * (ACTIVE_PATTERN.categoryScale[category] || 1);
  const assetCount = 1;
  const entityProps = {
    name:props.name,
    'name:ja':props['name:ja'] || props.name,
    'name:en':props['name:en'],
    class:renderClass,
    subclass:renderClass,
    landmark_class:props.class,
    religion:props.religion,
    source_geometry_type:props.source_geometry_type,
    osm_type:props.osm_type,
    osm_id:props.osm_id,
  };
  // 事前収集施設にはPOI Asset Contractを使わない。建物型はsource形状、
  // 記号型は直接描く単色マーカーなので、衝突範囲も固定値で定義する。
  const collisionRadius = size === 'L' ? 18 : 14;
  const collisionGeometry = {
    contractVersion:null,
    semanticRole:'marker',
    assetBounds:null,
    assetAnchor:null,
    assetSize:size,
    collisionBounds:{
      left:-collisionRadius, top:-collisionRadius,
      right:collisionRadius, bottom:collisionRadius,
    },
    collisionRadius,
  };
  const [worldX, worldY] = landmarkWorldPoint(coordinate);
  return {
    key:`landmark:${props.id || feature.id}`,
    name:featureName(entityProps),
    props:entityProps,
    sourcePoiIds:[String(props.id || feature.id)],
    buildingId:null,
    facilityRole:props.role === 'complex' ? 'landmark_complex' : 'signature_venue',
    category,
    collectionGroup:props.collection_group || null,
    symbolSource:'solid-facility-marker',
    variant:0,
    importance:1,
    rank:Number(props.rank ?? 1),
    metrics:{
      area:landmarkAreaCells(props.area_m2, coordinate[1]),
      height:Number(props.height_m || 0),
      kind:'poi',
    },
    size,
    assetCount,
    visualScale,
    ...collisionGeometry,
    selectionPriority:props.role === 'complex' ? 35 : 25,
    sourceWorldX:worldX,
    sourceWorldY:worldY,
    worldX,
    worldY,
    anchorMode:'source-point',
    representation:'icon',
    selectionReason:'landmark-guaranteed',
    landmarkEntity:true,
    landmarkEntityId:String(props.id || feature.id),
    parentId:props.parent_id || null,
    landmarkDisplay:props.display_mode || 'building',
    labelEnabled:props.label_enabled !== false,
    anchorCoordinate:coordinate,
  };
}
function applyStandaloneLandmarks(resolvedView){
  if (!STANDALONE_LANDMARK_MODE || !landmarkFeatureCollection || !LANDMARK_ENTITY_API)
    return {
      ...resolvedView,
      landmarkFeatures:[],
      landmarks:{ enabled:false, state:landmarkLoadState, selected:[] },
    };

  const commercialEnabled = commercialLandmarkToggle.checked;
  const eligibleParentIds = new Set(landmarkFeatureCollection.features
    .filter(feature => feature.properties?.role === 'complex' &&
      (feature.properties.collection_group !== 'commercial' || commercialEnabled))
    .map(feature => LANDMARK_ENTITY_API.featureId(feature)));
  const eligibleCollection = {
    ...landmarkFeatureCollection,
    features:landmarkFeatureCollection.features.filter(feature => {
      const props = feature.properties || {};
      if (props.standalone_only && EMBEDDED) return false;
      if (props.role === 'complex') return eligibleParentIds.has(LANDMARK_ENTITY_API.featureId(feature));
      if (props.collection_group === 'commercial') return commercialEnabled;
      return !props.parent_id || eligibleParentIds.has(props.parent_id);
    }),
  };
  const selection = LANDMARK_ENTITY_API.selectForZoom(eligibleCollection, TILE.z);
  const activeLandmarkAtZoom = feature => {
    const props = feature.properties || {};
    return TILE.z >= Number(props.minzoom ?? 0) && TILE.z <= Number(props.maxzoom ?? 24);
  };
  const activeFeatures = selection.collection.features.filter(activeLandmarkAtZoom);
  const range = viewTileRange(W);
  const anchorInContext = feature => {
    const coordinate = LANDMARK_ENTITY_API.anchorOf(feature);
    if (!coordinate) return false;
    const [worldX, worldY] = landmarkWorldPoint(coordinate);
    const tileX = Math.floor(worldX / W), tileY = Math.floor(worldY / H);
    return tileX >= range.minX - 1 && tileX <= range.maxX + 1 &&
      tileY >= range.minY - 1 && tileY <= range.maxY + 1;
  };
  const contextParentIds = new Set(activeFeatures
    .filter(feature => feature.properties.role === 'complex' && anchorInContext(feature))
    .map(feature => LANDMARK_ENTITY_API.featureId(feature)));
  // 施設表示では代表建物だけに絞らず、表示対象の複合施設にひもづく
  // 事前収集済みの館内施設もすべて表示する。
  const selectedFeatures = activeFeatures.filter(feature => {
    if (feature.properties.role === 'complex')
      return contextParentIds.has(LANDMARK_ENTITY_API.featureId(feature));
    if (feature.properties.parent_id)
      return contextParentIds.has(feature.properties.parent_id);
    return anchorInContext(feature);
  });
  if (!selectedFeatures.length)
    return {
      ...resolvedView,
      landmarkFeatures:[],
      landmarks:{ enabled:true, state:landmarkLoadState, selected:[] },
    };

  // 建物型表示では衝突回避による移動・点化を行わない。収集データのsource形状と
  // anchorをそのまま使い、通常POIは別レイヤーの入力として維持する。
  const landmarkFacilities = selectedFeatures.map(feature => {
    const coordinate = LANDMARK_ENTITY_API.anchorOf(feature);
    return coordinate ? makeLandmarkFacility(feature, coordinate) : null;
  }).filter(Boolean);
  const religiousPointLandmarksByName = new Map();
  for (const facility of landmarkFacilities.filter(item =>
    item.landmarkDisplay === 'religious_structure' && item.name)){
    if (!religiousPointLandmarksByName.has(facility.name))
      religiousPointLandmarksByName.set(facility.name, []);
    religiousPointLandmarksByName.get(facility.name).push(facility);
  }
  // 同じOSM点が通常MVT POIにも入る場合がある。専用建物絵の近傍にある
  // 同名place_of_worshipだけを除き、「小さな施設(点)」との二重表示を防ぐ。
  const sourceFacilities = resolvedView.facilities.filter(facility => {
    const worship = facility.assetFamily === 'worship' ||
      facilityPropTypes(facility.props).has('place_of_worship');
    if (!worship) return true;
    const fallbacks = religiousPointLandmarksByName.get(featureName(facility.props));
    return !fallbacks?.some(fallback =>
      Math.hypot(facility.worldX - fallback.worldX, facility.worldY - fallback.worldY) <= 8);
  });

  return {
    ...resolvedView,
    facilities:[...sourceFacilities, ...landmarkFacilities],
    landmarkFeatures:selectedFeatures,
    landmarks:{
      enabled:true,
      state:landmarkLoadState,
      algorithmVersion:selection.algorithmVersion,
      scope:landmarkFeatureCollection.properties?.scope || null,
      overridesSchema:landmarkFeatureCollection.properties?.overrides_schema || null,
      commercialEnabled,
      selected:landmarkFacilities.map(facility => ({
        id:facility.landmarkEntityId,
        name:facility.name,
        role:facility.facilityRole,
        renderer:facility.landmarkDisplay === 'symbol' ? 'solid-facility-marker'
          : facility.landmarkDisplay === 'religious_structure'
            ? 'pixel-religious-structure' : 'building-footprint',
        representation:facility.landmarkDisplay === 'symbol' ? 'symbol'
          : facility.landmarkDisplay === 'religious_structure' ? 'structure' : 'building',
        geometrySource:facility.props.source_geometry_type === 'point' ? 'osm-point-anchor'
          : facility.collectionGroup === 'facility'
            ? 'precollected-facility-footprint' : 'matched-or-collected-building',
        anchor:facility.anchorCoordinate,
      })),
      suppressed:0,
    },
  };
}

function landmarkGeometryPolygons(geometry){
  if (geometry?.type === 'Polygon') return [geometry.coordinates];
  if (geometry?.type === 'MultiPolygon') return geometry.coordinates;
  return [];
}

function isRacecourseLandmarkProps(props = {}){
  const typeValues = [
    props.class,
    props.subclass,
    props.leisure,
    props.sport,
    props.facility_tag_value,
  ].map(value => String(value || '').toLowerCase());
  if (typeValues.some(value => value === 'horse_racing' || value === 'racetrack')) return true;
  const name = String(props['name:ja'] || props.name || '');
  return name.includes('競馬場') || /\brace\s*course\b/i.test(name);
}

function rasterizeStandaloneLandmarkBuildings(features, worldToGridPoint, gridSize){
  const grid = new Uint8Array(gridSize * gridSize);
  const bldGrid = new Uint16Array(gridSize * gridSize);
  const buildingKinds = Array(features.length + 1).fill('normal');
  const buildingDescs = Array(features.length + 1).fill(null);
  const buildingAnchors = Array(features.length + 1).fill(null);
  const featureRoles = Array(features.length + 1).fill(null);
  const featureCollectionGroups = Array(features.length + 1).fill(null);
  const featureGridAnchors = Array(features.length + 1).fill(null);
  const bldStyle = new Uint8Array(features.length + 1);
  let visibleFeatures = 0;

  const stampCell = (bi, x, y) => {
    if (x < 0 || y < 0 || x >= gridSize || y >= gridSize) return false;
    grid[y * gridSize + x] = ID.BLD;
    bldGrid[y * gridSize + x] = bi;
    return true;
  };
  for (let featureIndex = 0; featureIndex < features.length; featureIndex++){
    const feature = features[featureIndex];
    const props = feature.properties || {};
    const bi = featureIndex + 1;
    const anchor = LANDMARK_ENTITY_API.anchorOf(feature);
    const latitude = Number(anchor?.[1] || 0);
    featureRoles[bi] = props.role || 'standalone';
    featureCollectionGroups[bi] = props.collection_group || null;
    if (anchor){
      const [worldX, worldY] = landmarkWorldPoint(anchor);
      const [gx, gy] = worldToGridPoint(worldX, worldY);
      featureGridAnchors[bi] = [Math.floor(gx), Math.floor(gy)];
    }
    const lodSeed = BUILDING_STYLES.seedFromKey(`landmark:${LANDMARK_ENTITY_API.featureId(feature)}`);
    buildingDescs[bi] = {
      ...buildingAppearanceForActiveProfile({
        heightM:Number(props.height_m || 0),
        areaCells:landmarkAreaCells(props.area_m2, latitude),
        // 競馬場の専用色はstandalone testだけで検証し、embedded本番は従来色を保つ。
        kind:!EMBEDDED && isRacecourseLandmarkProps(props) ? 'racecourse' : 'normal',
        category:null,
        seed:lodSeed,
      }),
      lodSeed,
    };
    bldStyle[bi] = buildingDescs[bi].styleIndex;

    let painted = false;
    for (const polygon of landmarkGeometryPolygons(feature.geometry)){
      const rings = polygon.map(ring => ring.map(coordinate => {
        const [worldX, worldY] = landmarkWorldPoint(coordinate);
        return worldToGridPoint(worldX, worldY);
      }));
      let minY = Infinity, maxY = -Infinity;
      for (const ring of rings) for (const [, y] of ring){
        minY = Math.min(minY, y);
        maxY = Math.max(maxY, y);
      }
      const y0 = Math.max(0, Math.ceil(minY - .5));
      const y1 = Math.min(gridSize - 1, Math.floor(maxY - .5));
      for (let y = y0; y <= y1; y++){
        const sampleY = y + .5;
        const intersections = [];
        for (const ring of rings){
          for (let index = 0; index + 1 < ring.length; index++){
            const [xa, ya] = ring[index], [xb, yb] = ring[index + 1];
            if ((ya <= sampleY) !== (yb <= sampleY))
              intersections.push(xa + (sampleY - ya) * (xb - xa) / (yb - ya));
          }
        }
        intersections.sort((a, b) => a - b);
        for (let index = 0; index + 1 < intersections.length; index += 2){
          const x0 = Math.max(0, Math.ceil(intersections[index] - .5));
          const x1 = Math.min(gridSize - 1, Math.floor(intersections[index + 1] - .5));
          for (let x = x0; x <= x1; x++) painted = stampCell(bi, x, y) || painted;
        }
      }
    }
    if (!painted && anchor){
      const [worldX, worldY] = landmarkWorldPoint(anchor);
      const [gx, gy] = worldToGridPoint(worldX, worldY);
      const radius = props.role === 'complex' ? 2 : 1;
      for (let dy = -radius; dy <= radius; dy++) for (let dx = -radius; dx <= radius; dx++)
        painted = stampCell(bi, Math.floor(gx) + dx, Math.floor(gy) + dy) || painted;
    }
    if (painted) visibleFeatures++;
  }
  return {
    grid, bldGrid, buildingKinds, buildingDescs, buildingAnchors, bldStyle,
    featureRoles, featureCollectionGroups, featureGridAnchors, visibleFeatures,
  };
}

// 収集ランドマークと施設敷地は表示対象の選抜にだけ使い、見た目は
// 「たてもの」レイヤーの実建物ID・形状・配色をそのまま再利用する。
// ランドマークに対応建物がない場合だけ収集形状へ戻す。
function matchStandaloneLandmarksToSourceBuildings(
  landmark, sourceBuildingGrid, sourceBldGrid,
  sourceBuildingKinds, sourceBuildingDescs, sourceBuildingAnchors, sourceBldStyle,
  facilityTargets = [], sourceUnitByRingKey = null, facilityToGridPoint = null,
  facilitySites = []
){
  const directFacilityTargets = facilityTargets.filter(facility =>
    isStationProps(facility.props) || isSchoolFacilityProps(facility.props));
  if (!sourceBuildingGrid) return {
    ...landmark,
    layers:[landmark],
    matchedFeatures:0,
    unmatchedFeatures:landmark.visibleFeatures,
    matchedFacilityTargets:0,
    unmatchedFacilityTargets:directFacilityTargets.length,
    matchedFacilityTypes:{ station:0, school:0 },
    matchedFacilities:new Set(),
    facilitySiteCandidates:0,
    matchedFacilitySites:0,
    unmatchedFacilitySites:0,
    matchedFacilitySiteClasses:{},
    matchedFacilitySiteOwners:[],
    matchedFacilitySiteBuildings:0,
    sourceBuildingIds:0,
  };

  const cellsByFeature = Array.from({ length:landmark.featureRoles.length }, () => []);
  for (let index = 0; index < landmark.grid.length; index++){
    const featureId = landmark.bldGrid[index];
    if (featureId) cellsByFeature[featureId].push(index);
  }
  const sourceBuildingIds = new Set();
  const matchedFeatureIds = new Set();
  const size = RASTER_GRID_SIZE;
  const nearestSourceBuilding = anchor => {
    if (!anchor) return 0;
    const [rawX, rawY] = anchor;
    const cx = Math.floor(rawX), cy = Math.floor(rawY);
    const limit = Math.max(2, detailCellSpan(5));
    for (let radius = 0; radius <= limit; radius++){
      const candidates = [];
      for (let dy = -radius; dy <= radius; dy++){
        for (let dx = -radius; dx <= radius; dx++){
          if (radius && Math.abs(dx) !== radius && Math.abs(dy) !== radius) continue;
          const x = cx + dx, y = cy + dy;
          if (x < 0 || y < 0 || x >= size || y >= size) continue;
          const index = y * size + x;
          if (sourceBuildingGrid[index] === ID.BLD && sourceBldGrid[index])
            candidates.push({ id:sourceBldGrid[index], distance:dx * dx + dy * dy });
        }
      }
      if (candidates.length){
        candidates.sort((a, b) => a.distance - b.distance || a.id - b.id);
        return candidates[0].id;
      }
    }
    return 0;
  };

  for (let featureId = 1; featureId < cellsByFeature.length; featureId++){
    if (!cellsByFeature[featureId].length) continue;
    const overlaps = new Map();
    for (const index of cellsByFeature[featureId]){
      if (sourceBuildingGrid[index] !== ID.BLD || !sourceBldGrid[index]) continue;
      const buildingId = sourceBldGrid[index];
      overlaps.set(buildingId, (overlaps.get(buildingId) || 0) + 1);
    }
    if (overlaps.size){
      const ranked = [...overlaps].sort((a, b) => b[1] - a[1] || a[0] - b[0]);
      const selected = landmark.featureRoles[featureId] === 'complex' ? ranked : ranked.slice(0, 1);
      for (const [buildingId] of selected) sourceBuildingIds.add(buildingId);
      matchedFeatureIds.add(featureId);
      continue;
    }
    const nearest = nearestSourceBuilding(landmark.featureGridAnchors[featureId]);
    if (nearest){
      sourceBuildingIds.add(nearest);
      matchedFeatureIds.add(featureId);
    }
  }

  const matchedFacilities = new Set();
  const matchedFacilityTypes = { station:0, school:0 };
  let matchedDirectFacilityTargets = 0;
  for (const facility of directFacilityTargets){
    let buildingId = facility.buildingId && sourceUnitByRingKey
      ? sourceUnitByRingKey.get(facility.buildingId) || 0
      : 0;
    if (!buildingId && facilityToGridPoint)
      buildingId = nearestSourceBuilding(facilityToGridPoint(facility));
    if (!buildingId) continue;
    sourceBuildingIds.add(buildingId);
    matchedFacilities.add(facility);
    matchedDirectFacilityTargets++;
    const type = isStationProps(facility.props) ? 'station' : 'school';
    matchedFacilityTypes[type]++;
  }

  // 施設classを列挙して分岐せず、敷地classのasset familyとPOI familyを照合する。
  // 同一敷地の代表施設を1件選び、50%以上が敷地内に入る全棟を同じ表示集合へ加える。
  const facilityGridPoints = new Map(facilityTargets.map(facility => [
    facility,
    facilityToGridPoint ? facilityToGridPoint(facility) : null,
  ]));
  const facilitySourceBuildingIds = new Map(facilityTargets.map(facility => [
    facility,
    facility.buildingId && sourceUnitByRingKey
      ? sourceUnitByRingKey.get(facility.buildingId) || 0
      : 0,
  ]));
  const candidateSites = facilitySites.filter(site =>
    site.buildingIds.length && !NON_FACILITY_SITE_CLASSES.has(site.siteClass));
  const matchedFacilitySiteClasses = {};
  const matchedFacilitySiteOwners = [];
  const matchedFacilitySiteBuildingIds = new Set();
  let matchedFacilitySites = 0;
  for (const site of candidateSites){
    const siteBuildingIds = new Set(site.buildingIds);
    const owners = facilityTargets.filter(facility =>
      facilityMatchesSite(facility, site) &&
      (facilitySiteContainsGridPoint(site, facilityGridPoints.get(facility)) ||
       siteBuildingIds.has(facilitySourceBuildingIds.get(facility))));
    if (!owners.length) continue;
    owners.sort((a, b) => compareFacilitySiteOwners(a, b, site));
    const owner = owners[0];
    matchedFacilities.add(owner);
    matchedFacilitySites++;
    matchedFacilitySiteClasses[site.siteClass] = (matchedFacilitySiteClasses[site.siteClass] || 0) + 1;
    matchedFacilitySiteOwners.push({
      siteClass:site.siteClass,
      name:featureName(owner.props),
      assetFamily:owner.assetFamily || 'generic',
      buildings:site.buildingIds.length,
    });
    for (const buildingId of site.buildingIds){
      sourceBuildingIds.add(buildingId);
      matchedFacilitySiteBuildingIds.add(buildingId);
    }
  }

  const sourceGrid = new Uint8Array(sourceBuildingGrid.length);
  const facilityFootprintGrid = new Uint8Array(landmark.grid.length);
  const fallbackGrid = new Uint8Array(landmark.grid.length);
  const facilityFootprintFeatureIds = new Set();
  for (let index = 0; index < sourceBuildingGrid.length; index++){
    if (sourceBuildingGrid[index] === ID.BLD && sourceBuildingIds.has(sourceBldGrid[index]))
      sourceGrid[index] = ID.BLD;
    const featureId = landmark.bldGrid[index];
    if (landmark.grid[index] !== ID.BLD || !featureId) continue;
    // 汎用施設は通常建物との重なり有無にかかわらず、収集した閉じた敷地形状を
    // 必ず描く。通常建物だけへ置換すると、川崎変電所のように敷地の大半が
    // 建物ではない施設が選択済みでも画面上から消えてしまう。
    if (landmark.featureCollectionGroups?.[featureId] === 'facility'){
      facilityFootprintGrid[index] = ID.BLD;
      facilityFootprintFeatureIds.add(featureId);
    } else if (!matchedFeatureIds.has(featureId)){
      fallbackGrid[index] = ID.BLD;
    }
  }
  const layers = [];
  // 敷地面を先に、その中のMVT建物を後から描いて内部棟の輪郭を保持する。
  if (facilityFootprintGrid.some(Boolean)) layers.push({
    ...landmark, grid:facilityFootprintGrid, source:'facility-site-footprints',
  });
  if (sourceBuildingIds.size) layers.push({
    grid:sourceGrid,
    bldGrid:sourceBldGrid,
    buildingKinds:sourceBuildingKinds,
    buildingDescs:sourceBuildingDescs,
    buildingAnchors:sourceBuildingAnchors,
    bldStyle:sourceBldStyle,
    source:'map-buildings',
  });
  if (fallbackGrid.some(Boolean)) layers.push({ ...landmark, grid:fallbackGrid, source:'collected-fallback' });
  return {
    ...landmark,
    layers,
    matchedFeatures:matchedFeatureIds.size,
    unmatchedFeatures:landmark.visibleFeatures - matchedFeatureIds.size,
    matchedFacilityTargets:matchedFacilities.size,
    unmatchedFacilityTargets:directFacilityTargets.length - matchedDirectFacilityTargets,
    matchedFacilityTypes,
    matchedFacilities,
    facilitySiteCandidates:candidateSites.length,
    matchedFacilitySites,
    unmatchedFacilitySites:candidateSites.length - matchedFacilitySites,
    matchedFacilitySiteClasses,
    matchedFacilitySiteOwners,
    matchedFacilitySiteBuildings:matchedFacilitySiteBuildingIds.size,
    sourceBuildingIds:sourceBuildingIds.size,
    facilityFootprintFeatures:facilityFootprintFeatureIds.size,
  };
}

function drawCurrentLocation(){
  const pt = locationCanvasPoint();
  if (!pt) return;
  const [x, y] = pt;
  if (x < -200 || y < -200 || x > W + 200 || y > H + 200) return;

  const metersPerTile = 40075016.686 * Math.cos(currentLocation.latitude * Math.PI / 180) / (2 ** TILE.z);
  const radius = Math.max(18, Math.min(180, currentLocation.accuracy / metersPerTile * W));
  ctx.save();
  ctx.fillStyle = 'rgba(72,144,224,.18)';
  ctx.strokeStyle = 'rgba(248,240,216,.9)';
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.restore();

  px(Math.round(x) - 11, Math.round(y) - 11, 22, 22, OUT);
  px(Math.round(x) - 8, Math.round(y) - 8, 16, 16, '#4890e0');
  px(Math.round(x) - 3, Math.round(y) - 3, 6, 6, '#f8f0d8');
  hitAreas.push({
    x:x - 18, y:y - 18, w:36, h:36,
    p:{ name:'現在地', class:'current_location' }, kind:'location',
  });
}

function render(){
  if (!tileLayers) return;
  renderCount++;
  const renderStartedAt = performance.now();
  const o = opts();
  hitAreas = [];
  const L = n => (tileLayers[n] ? tileLayers[n].features : []);
  window.PixelMapGameData = {
    places:L('place'),
    sourceLayers:Object.keys(tileLayers),
  };
  SCALE = W / (tileLayers.transportation?.extent || tileLayers.building?.extent || 4096);
  if (BEARING_STUDY_MODE){
    gridOriginX = Math.floor((viewOffset.x + W / 2) / CPX) - Math.floor(RASTER_GRID_SIZE / 2);
    gridOriginY = Math.floor((viewOffset.y + H / 2) / CPX) - Math.floor(RASTER_GRID_SIZE / 2);
  } else {
    gridOriginX = Math.floor(viewOffset.x / CPX) - 1;
    gridOriginY = Math.floor(viewOffset.y / CPX) - 1;
  }
  gridShiftX = gridOriginX * CPX - viewOffset.x;
  gridShiftY = gridOriginY * CPX - viewOffset.y;

  /* --- 地形のマップグリッド + 建物情報 --- */
  const rasterized = getRasterizedGrid(tileLayers, o);
  const {
    grids, transportCenters, transportRailSkins, bldGrid, bldUnits, unitByRingKey, bldArea,
    facilitySites, featureCountsByOption,
  } = rasterized;
  const RG = RASTER_GRID_SIZE;
  const worldToGridCell = (wx, wy) => [
    Math.floor(wx / CPX) - TILE.x * GRID - gridOriginX,
    Math.floor(wy / CPX) - TILE.y * GRID - gridOriginY,
  ];
  const worldToGridPoint = (wx, wy) => [
    wx / CPX - TILE.x * GRID - gridOriginX,
    wy / CPX - TILE.y * GRID - gridOriginY,
  ];
  const cellRenderingStats = {
    gridSize:RG,
    pixelData:CELL_ONLY_MODE ? new Uint8ClampedArray(RG * RG * 4) : null,
    occupiedMask:CELL_ONLY_MODE ? new Uint8Array(RG * RG) : null,
    // 建物と点登録神社仏閣だけが共有する画面奥行き。地表や通常記号は対象外。
    worldStructureDepth:CELL_ONLY_MODE && !EMBEDDED
      ? new Float32Array(RG * RG).fill(Number.NEGATIVE_INFINITY) : null,
    depthRejectedCells:0,
    religiousDepthRejectedCells:0,
    paintedCells:0,
    occupiedCells:0,
    layerCells:Object.create(null),
    countedFeatureOptions:new Set(),
    cellizedFeatures:0,
    facilitySymbols:0,
    terrainSymbols:0,
    groundPatternCells:0,
    boundaryCells:0,
    roadCasingCells:0,
    roadCenterCells:0,
    railTieCells:0,
    railSourcePaths:0,
    railTopologyPaths:0,
    railLodSuppressedPaths:0,
    buildingDetailCells:0,
    extrudedBuildings:0,
    maxBuildingRiseCells:0,
    maxBuildingRiseLogicalPixels:0,
    spriteCells:0,
    rerasterizedLogicalPixels:0,
    flushed:false,
  };

  /* --- リゾルバーの確定施設データ（アイコンにも建物の用途分類にも使う） --- */
  const resolvedView = applyStandaloneLandmarks(collectResolvedFacilities());
  if (resolvedView.pendingTiles) ensureTilesAround().catch(console.error);

  /* --- 建物の意味づけ: 棟 × リゾルバー施設 → 見た目記述子 ---
     kind/categoryはリゾルバーが唯一の正典。未解決MVTタイルの棟は一旦normalで描き、
     解決済みMVTタイルが増える（stampが変わる）たびに再計算して昇格させる。 --- */
  const semanticStamp = tileGeneration + ':' + resolvedView.resolvedTileCount;
  if (!rasterized.semantic || rasterized.semantic.stamp !== semanticStamp){
    const unitCount = bldUnits.length;
    const buildingKinds = Array(unitCount + 1).fill('normal');
    const buildingDescs = Array(unitCount + 1).fill(null);
    const buildingAnchors = Array(unitCount + 1).fill(null);
    const facilityByUnit = Array(unitCount + 1).fill(null);
    const unitAt = (cx, cy) => (cx >= 0 && cy >= 0 && cx < RG && cy < RG) ? bldGrid[cy * RG + cx] : 0;
    for (const facility of resolvedView.facilities){
      if (!facility.buildingId) continue;
      let bi = unitByRingKey.get(facility.buildingId) || 0;
      if (!bi){
        // MVTタイル境界でリング片が異なる場合は施設位置のセルから引く
        const [cx, cy] = worldToGridCell(facility.worldX, facility.worldY);
        bi = unitAt(cx, cy);
      }
      if (!bi) continue;
      const current = facilityByUnit[bi];
      if (!current || facility.selectionPriority < current.selectionPriority ||
          (facility.selectionPriority === current.selectionPriority && facility.key < current.key))
        facilityByUnit[bi] = facility;
    }
    for (let bi = 1; bi <= unitCount; bi++){
      const unit = bldUnits[bi - 1];
      const facility = facilityByUnit[bi];
      const kind = facility && facility.metrics.kind !== 'none' ? facility.metrics.kind : 'normal';
      buildingKinds[bi] = kind;
      const lodSeed = BUILDING_STYLES.seedFromKey(unit.ringKey);
      buildingDescs[bi] = {
        ...buildingAppearanceForActiveProfile({
        heightM:Number(unit.props.render_height || 0),
        areaCells:unit.geomAreaCells,
        kind,
        category:facility ? facility.category : null,
        seed:lodSeed,
        }),
        lodSeed,
      };
      if (facility){
        // 屋上マークと入口は施設のワールド座標にアンカーする（パンで動かない）
        let [ax, ay] = worldToGridCell(facility.worldX, facility.worldY);
        if (unitAt(ax, ay) !== bi){
          let found = false;
          const searchRadius = Math.max(1, Math.ceil(CELL_DETAIL_SCALE));
          for (let dy = -searchRadius; dy <= searchRadius && !found; dy++)
            for (let dx = -searchRadius; dx <= searchRadius && !found; dx++)
              if (unitAt(ax + dx, ay + dy) === bi){ ax += dx; ay += dy; found = true; }
          if (!found) ax = -1;
        }
        if (ax >= 0){
          let ay0 = ay, ay1 = ay;
          while (ay0 - 1 >= 0 && unitAt(ax, ay0 - 1) === bi) ay0--;
          while (ay1 + 1 < RG && unitAt(ax, ay1 + 1) === bi) ay1++;
          // 屋上マークはアンカー列の最上段、入口は最下段
          buildingAnchors[bi] = { gx:ax, gy:ay0, ex:ax, ey:ay1 };
        }
      }
    }
    const bldStyle = new Uint8Array(unitCount + 1);
    for (let bi = 1; bi <= unitCount; bi++) bldStyle[bi] = buildingDescs[bi].styleIndex;
    const buildingGrid = grids.get('buildings');
    const normalBuildingGrid = new Uint8Array(RG * RG);
    const poiBuildingGrid = new Uint8Array(RG * RG);
    if (buildingGrid){
      for (let i = 0; i < buildingGrid.length; i++){
        if (buildingGrid[i] !== ID.BLD) continue;
        const target = buildingKinds[bldGrid[i]] === 'normal' ? normalBuildingGrid : poiBuildingGrid;
        target[i] = ID.BLD;
      }
    }
    rasterized.semantic = {
      stamp:semanticStamp, buildingKinds, buildingDescs, buildingAnchors,
      bldStyle, normalBuildingGrid, poiBuildingGrid,
    };
  }
  const { buildingKinds, buildingDescs, buildingAnchors, bldStyle, normalBuildingGrid, poiBuildingGrid } = rasterized.semantic;
  const emptyGrid = new Uint8Array(RASTER_GRID_SIZE * RASTER_GRID_SIZE);
  if (CELL_ONLY_MODE) drawCellPixelArtSurfaceGrid(emptyGrid, 'grass', cellRenderingStats, false);
  else drawGrid(emptyGrid, bldGrid, bldStyle, { grass:false });

  const unifiedCorridorCache = new Map();
  let unifiedLevelCrossingPoints = [];
  const unifiedWaterwayClasses = new Set(['river','stream','canal','ditch','drain']);
  function unifiedCorridorFeatures(option, bridge = false){
    const style = STANDALONE_STYLE_SPEC.corridor[option];
    if (!style) return [];
    if (style.source === 'waterway'){
      return L('waterway').filter(feature => {
        const kind = feature.props.subclass || feature.props.class || '';
        return style.fallback ? !unifiedWaterwayClasses.has(kind) : style.classes.includes(kind);
      });
    }
    return L('transportation').filter(feature => {
      const binding = corridorBinding(feature);
      const routeOption = binding.assetId;
      const isBridge = binding.modifiers.bridge;
      const isTunnel = binding.modifiers.tunnel;
      if (style.tunnelGroup){
        return !bridge && binding.stateAssetId === option;
      }
      if (option === 'subway') return routeOption === 'subway' && !isBridge;
      if (routeOption !== option || isTunnel) return false;
      return bridge ? isBridge : !isBridge;
    });
  }
  function unifiedCorridorEntry(option, bridge = false){
    const key = `${option}:${bridge ? 'bridge' : 'surface'}`;
    if (unifiedCorridorCache.has(key)) return unifiedCorridorCache.get(key);
    const style = STANDALONE_STYLE_SPEC.corridor[option];
    const features = unifiedCorridorFeatures(option, bridge);
    const maskStyle = bridge ? corridorModifierStyle(style,'bridge') : style;
    const entry = {
      style,
      features,
      masks:features.length ? buildUnifiedCorridorMasks(features, maskStyle) : null,
    };
    unifiedCorridorCache.set(key, entry);
    return entry;
  }
  function drawUnifiedCorridorLayer(option, bridge = false){
    const entry = unifiedCorridorEntry(option, bridge);
    if (!entry?.masks) return;
    renderUnifiedCorridor(entry.features, entry.style, bridge, entry.masks);
  }
  function activeUnifiedCorridorMask(){
    const combined = new Uint8Array(PRESENTATION_SIZE * PRESENTATION_SIZE);
    for (const [option, style] of Object.entries(STANDALONE_STYLE_SPEC.corridor)){
      if (!o[option] || style.tunnelGroup || option === 'subway' || option === 'ferries' || option === 'aerialways') continue;
      const masks = unifiedCorridorEntry(option, false).masks;
      if (!masks) continue;
      for (let index = 0; index < combined.length; index++)
        if (masks.body[index]) combined[index] = 1;
    }
    return combined;
  }
  function combinedGroundCorridorMask(options){
    const combined=new Uint8Array(PRESENTATION_SIZE*PRESENTATION_SIZE);
    for(const option of options){
      if(!o[option]) continue;
      const masks=unifiedCorridorEntry(option,false).masks;
      if(!masks) continue;
      for(let index=0;index<combined.length;index++)
        if(masks.body[index]) combined[index]=1;
    }
    return combined;
  }
  function drawUnifiedLevelCrossings(){
    const modifier=WORLD_STYLE.corridorModifiers?.levelCrossing;
    if(!modifier || modifier.enabled === false || !o.rail) return [];
    const roadOptions=Object.keys(STANDALONE_STYLE_SPEC.corridor).filter(option =>
      ASSET_FAMILY_REGISTRY.corridorFamilyIdsForAsset(option,ACTIVE_ASSET_PACK).includes('road') &&
      !STANDALONE_STYLE_SPEC.corridor[option].tunnelGroup);
    const roadMask=combinedGroundCorridorMask(roadOptions);
    const railMask=combinedGroundCorridorMask(['rail']);
    const points=CORRIDOR_RENDERER.findMaskIntersections(
      roadMask,railMask,PRESENTATION_SIZE,PRESENTATION_SIZE,
      {minimumSpacing:modifier.minimumSpacing});
    ctx.save();
    for(const point of points){
      const x=point.x*SCENE_PIXELS_PER_LOGICAL_PIXEL;
      const y=point.y*SCENE_PIXELS_PER_LOGICAL_PIXEL;
      ctx.fillStyle=modifier.outline;ctx.fillRect(x-4,y-4,8,8);
      ctx.fillStyle=modifier.light;ctx.fillRect(x-2,y-2,4,4);
      ctx.fillStyle=modifier.dark;
      ctx.fillRect(x-2,y-2,2,2);ctx.fillRect(x,y,2,2);
    }
    ctx.restore();
    return points;
  }

  /* 本番道路は16pxセルへ落とさず、MVTの元形状を2シーンpx
     （出力画像上1論理px）のグリッドへ直接描く。外形・舗装・中央線を
     別ストロークにすることで、交差点をつなげたまま細かな曲線を保つ。 */
  function drawSmoothRoadLayer(option, bridge = false){
    const style = SMOOTH_ROAD_STYLE[option];
    if (!style) return;
    const features = L('transportation').filter(feature => {
      const binding = corridorBinding(feature);
      if (binding.assetId !== option) return false;
      const isBridge = binding.modifiers.bridge;
      const isTunnel = binding.modifiers.tunnel;
      return bridge ? isBridge : !isBridge && !isTunnel;
    });
    if (!features.length) return;

    const point = value => {
      const [x, y] = tp(value);
      return [Math.round(x / 2) * 2, Math.round(y / 2) * 2];
    };
    const lineFeatures = features.filter(feature => feature.type === 2);
    const areaFeatures = features.filter(feature => feature.type === 3);
    const traceLines = () => {
      ctx.beginPath();
      for (const feature of lineFeatures){
        for (const line of feature.geom){
          line.forEach((pt, index) => {
            const [x, y] = point(pt);
            index ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
          });
        }
      }
    };

    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const minimumLocalRoad = STANDALONE_MINIMUM_MINOR_ROUTES && option === 'localRoads';
    const bridgeExtra = bridge && !minimumLocalRoad ? 4 : 0;
    const width = style.width + bridgeExtra;
    if (areaFeatures.length){
      for (const feature of areaFeatures){
        ctx.beginPath();
        for (const ring of feature.geom){
          ring.forEach((pt, index) => {
            const [x, y] = point(pt);
            index ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
          });
          ctx.closePath();
        }
        ctx.fillStyle = style.fill;
        ctx.strokeStyle = style.edge;
        ctx.lineWidth = style.casing * 2 + bridgeExtra;
        ctx.fill('evenodd');
        if (ctx.lineWidth > 0) ctx.stroke();
      }
    }
    if (lineFeatures.length){
      if (style.casing > 0 || bridgeExtra > 0){
        traceLines();
        ctx.strokeStyle = style.edge;
        ctx.lineWidth = width + style.casing * 2;
        ctx.stroke();
      }
      traceLines();
      ctx.strokeStyle = style.fill;
      ctx.lineWidth = width;
      ctx.stroke();
      if (style.center){
        traceLines();
        ctx.strokeStyle = style.center;
        ctx.lineWidth = style.centerWidth;
        ctx.setLineDash(style.dash);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }
    ctx.restore();
  }

  function drawTunnelLayer(option){
    const tunnelRule=CANONICAL_TRANSPORT_RULES[option];
    ctx.globalAlpha = tunnelRule.alpha;
    ctx.lineCap = 'round';
    for (const f of L('transportation')){
      const binding = corridorBinding(f);
      const routeOption = binding.assetId;
      const isTunnel = binding.modifiers.tunnel;
      const isBridge = binding.modifiers.bridge;
      const showSubway = option === 'subway' && routeOption === 'subway' && !isBridge;
      const showRoadTunnel = option === 'roadTunnels' && binding.stateAssetId === option;
      const showPathTunnel = option === 'pathTunnels' && binding.stateAssetId === option;
      const showRailTunnel = option === 'railTunnels' && binding.stateAssetId === option;
      if (!showSubway && !showRoadTunnel && !showPathTunnel && !showRailTunnel) continue;
      ctx.strokeStyle = tunnelRule.fill;
      ctx.lineWidth = tunnelRule.logicalWidth * SCENE_PIXELS_PER_LOGICAL_PIXEL;
      ctx.setLineDash(tunnelRule.dash.map(value => value * SCENE_PIXELS_PER_LOGICAL_PIXEL));
      if (f.type === 1){
        const [x, y] = tp(f.geom[0][0]);
        px(x - 4, y - 4, 8, 8, '#282838');
      }else{
        ctx.beginPath();
        for (const ln of f.geom)
          ln.forEach((pt, i) => { const [x, y] = tp(pt); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
        ctx.stroke();
      }
    }
    ctx.setLineDash([]); ctx.globalAlpha = 1;
  }

  // 建物マスクはMVT形状から一度だけ確定する。corridorとの競合は診断するが、
  // 建物・POIを衝突後に移動または変形させない。
  let preciseBuildingRaster = null;
  let preciseSurfaceRoadMask = null;
  let preciseBuildingOverlapAudit = null;
  let preciseBuildingRoadOverlapPixels = 0;
  let preciseBuildingLodStats = null;
  if (o.buildings && STANDALONE_PRECISE_BUILDINGS){
    preciseBuildingRaster = rasterizeStandaloneBuildingPixels(bldUnits);
    preciseSurfaceRoadMask = STANDALONE_UNIFIED_STYLE
      ? activeUnifiedCorridorMask()
      : standaloneSurfaceRoadMask(o, L('transportation'));
    preciseBuildingOverlapAudit = auditStandaloneBuildingCorridorOverlap(
      preciseBuildingRaster, preciseSurfaceRoadMask
    );
    preciseBuildingRoadOverlapPixels = preciseBuildingOverlapAudit.overlapPixels;
  }

  /* --- レイヤー統計 --- */
  const stats = {};
  for (const n in tileLayers) stats[n] = tileLayers[n].features.length;
  const buildingKindCounts = buildingKinds.slice(1).reduce((counts, kind) => {
    counts[kind] = (counts[kind] || 0) + 1;
    return counts;
  }, {});
  document.getElementById('stats').innerHTML =
    (CELL_ONLY_MODE ? `<span>描画: ${MAP_CELL_LOGICAL_SIZE}×${MAP_CELL_LOGICAL_SIZE}論理px原子セルのピクセルアート</span>` : '')+
    `<span>普通建物: ${buildingKindCounts.normal || 0}</span>`+
    `<span>病院: ${buildingKindCounts.hospital || 0}</span>`+
    `<span>コンビニ: ${buildingKindCounts.convenience || 0}</span>`+
    `<span>雑居ビル: ${buildingKindCounts.mixed || 0}</span>`+
    `<span>その他POI建物: ${buildingKindCounts.poi || 0}</span>`+
    Object.entries(stats).map(([k, v]) => `<span>${k}: ${v}</span>`).join('');

  /* --- POI ---
     icon / dot / cluster はリゾルバーがワールド座標で確定済み。
     ここでは範囲内の確定データを画面座標へ変換して描くだけで、
     パンしても選抜・表示順・アイコンと点の切り替えは一切起きない。 --- */
  const worldToScreen = (wx, wy) => [wx - TILE.x * W - viewOffset.x, wy - TILE.y * H - viewOffset.y];
  const rotationVisibilityMargin = BEARING_STUDY_MODE
    ? Math.ceil((Math.SQRT2 - 1) * W / 2) + 90
    : 70;
  const facilitiesInView = resolvedView.facilities
    .map(f => {
      const pt = worldToScreen(f.worldX, f.worldY);
      return { ...f, pt, visualRadius:f.collisionRadius };
    })
    .filter(p => p.pt[0] >= -rotationVisibilityMargin && p.pt[1] >= -rotationVisibilityMargin &&
      p.pt[0] <= W + rotationVisibilityMargin && p.pt[1] <= H + rotationVisibilityMargin)
    // 神社仏閣は「施設アイコン」の表示対象。OFF時は「小さな施設(点)」や
    // 施設名、当たり判定へ回さず、別表現で再表示されないよう入口で除外する。
    .filter(p => o.poi || !(
      p.collectionGroup === 'religious' || p.assetFamily === 'worship' ||
      facilityPropTypes(p.props).has('place_of_worship')
    ));
  // standalone testの「施設」は、収集ランドマークと敷地所有施設を
  // 実建物として表示する。敷地がない駅・学校は従来の1棟fallbackを維持する。
  const facilityBuildingTargets = STANDALONE_LANDMARK_MODE
    ? facilitiesInView.filter(item => !item.landmarkEntity)
    : [];
  const collectedLandmarkRaster = STANDALONE_LANDMARK_MODE && o.poi
    ? rasterizeStandaloneLandmarkBuildings(resolvedView.landmarkFeatures.filter(feature =>
      (feature.properties?.display_mode || 'building') === 'building'), worldToGridPoint, RG)
    : null;
  const landmarkBuildingRaster = collectedLandmarkRaster
    ? matchStandaloneLandmarksToSourceBuildings(
      collectedLandmarkRaster, grids.get('buildings'), bldGrid,
      buildingKinds, buildingDescs, buildingAnchors, bldStyle,
      facilityBuildingTargets, unitByRingKey,
      facility => worldToGridPoint(facility.worldX, facility.worldY),
      facilitySites
    )
    : null;
  const matchedStandaloneFacilities = landmarkBuildingRaster?.matchedFacilities || new Set();
  const isStandaloneBuildingFacility = item => item.landmarkEntity ||
    isStationProps(item.props) || isSchoolFacilityProps(item.props) ||
    matchedStandaloneFacilities.has(item);
  const poiSourceFacilities = STANDALONE_LANDMARK_MODE
    ? facilitiesInView.filter(isStandaloneBuildingFacility)
    : facilitiesInView;
  const viewportIconSelection = WORLD_STYLE_MODE
    ? RESOLVER.selectViewportIcons(poiSourceFacilities, WORLD_STYLE.density)
    : {
        selected:poiSourceFacilities.filter(p => p.representation === 'icon'),
        rejected:[],roleCounts:{},categoryCounts:{},maxIcons:Infinity,
      };
  const worldStyleDisplayAssetSize = item => {
    const sourceSize = item.assetSize || item.size || 'S';
    const minimum = WORLD_STYLE.symbol.minimumAssetSizeByRole[item.semanticRole] || 'S';
    return WORLD_STYLE_MODE && tierValue(sourceSize) < tierValue(minimum) ? minimum : sourceSize;
  };
  const drawnIcons = viewportIconSelection.selected.map(item => ({
    ...item,
    displayAssetSize:worldStyleDisplayAssetSize(item),
  }));
  const foregroundBuildingIds = new Set(drawnIcons
    .map(item => item.buildingId ? unitByRingKey.get(item.buildingId) : 0)
    .filter(Boolean));
  const hiddenPois = STANDALONE_LANDMARK_MODE
    ? facilitiesInView.filter(p => !isStandaloneBuildingFacility(p) && p.representation === 'dot')
    : [
        ...facilitiesInView.filter(p => p.representation === 'dot'),
        ...viewportIconSelection.rejected,
      ];
  const clusterMarks = resolvedView.clusters
    .map(c => ({ ...c, pt:worldToScreen(c.worldX, c.worldY) }))
    .filter(c => c.pt[0] >= -rotationVisibilityMargin && c.pt[1] >= -rotationVisibilityMargin &&
      c.pt[0] <= W + rotationVisibilityMargin && c.pt[1] <= H + rotationVisibilityMargin);
  let drawnDotCount = 0;
  function drawDotMarker(p){
    const [x0, y0] = p.pt;
    const x = Math.round(x0), y = Math.round(y0);
    const tone = categoryTone(p.category);
    const s = Math.max(2, Math.round(4 * ACTIVE_PATTERN.dotScale));
    const kind = ACTIVE_PATTERN.dot;
    if (kind === 'category-shape'){
      drawCategoryShape(x, y, Math.max(5,s+2), p.category, tone, .9);
      return;
    }
    ctx.save();
    ctx.fillStyle = OUT; ctx.strokeStyle = OUT; ctx.lineWidth = 2;

            const [x0, y0] = screenToGridCell(tp(line[index - 1]));

            walkLine(x0 + .5, y0 + .5, x1 + .5, y1 + .5, (x, y) => cells.add(`${x},${y}`));
          }

let tileTemplate = FALLBACK_TILE_URL;
let networkTilesEnabled = true;
let tileGeneration = 0;
const tileCache = new Map();
const tileLoads = new Map();
const tileKey = (x, y) => `${x}/${y}`;
const RETAINED_SOURCE_LAYERS = new Set([
  'landcover','landuse','park','water','waterway','transportation',
  'building','poi','aeroway','mountain_peak','place',
]);
function retainRpgLayers(layers){
  return Object.fromEntries(
    Object.entries(layers).filter(([name]) => RETAINED_SOURCE_LAYERS.has(name))
  );
}

function offsetTileLayers(layers, tileX, tileY, originX = TILE.x, originY = TILE.y){
  const dx = tileX - originX, dy = tileY - originY;
  for (const layer of Object.values(layers)){
    const ox = dx * layer.extent, oy = dy * layer.extent;
    for (const f of layer.features)
      for (const line of f.geom)
        for (const pt of line){ pt[0] += ox; pt[1] += oy; }
  }
  return layers;
}

function rebuildTileLayers(){
  const merged = {};
  const pointKeys = new Map();
  const pad = 96;
  const minDx = Math.floor((viewOffset.x - pad) / W);
  const maxDx = Math.floor((viewOffset.x + W + pad) / W);
  const minDy = Math.floor((viewOffset.y - pad) / H);
  const maxDy = Math.floor((viewOffset.y + H + pad) / H);
  for (let dy = minDy; dy <= maxDy; dy++){
    for (let dx = minDx; dx <= maxDx; dx++){
      const cached = tileCache.get(tileKey(TILE.x + dx, TILE.y + dy));
      if (!cached) continue;
      for (const [name, layer] of Object.entries(cached)){
        if (!merged[name]){
          merged[name] = { name, extent:layer.extent, features:[] };
          pointKeys.set(name, new Set());
        }
        for (const feature of layer.features){
          if (feature.type === 1){
            const props = feature.props;
            const coordinates = feature.geom.flat().map(point => `${point[0]},${point[1]}`).join(';');
            const key = `${feature.id ?? ''}|${props.class ?? ''}|${props.subclass ?? ''}|`+
              `${featureName(props) ?? ''}|${coordinates}`;
            if (pointKeys.get(name).has(key)) continue;
            pointKeys.get(name).add(key);
          }
          merged[name].features.push(feature);
        }
      }
    }
  }
  if (Object.keys(merged).length) tileLayers = merged;
}

/* --- 施設リゾルバー連携 ---
   icon / dot / cluster はワールド座標で事前確定し、正規MVTタイル単位でキャッシュする。
   キャッシュキーは (MVTタイル, パターン固定, tileGeneration)。レイヤー切り替えでは
   無効化しない（レイヤーは描画フィルタであって選抜の入力ではない）。 */
const resolvedTiles = new Map();   // "x/y" -> { generation, result }
function resolverGetTile(x, y){
  const max = 2 ** TILE.z;
  if (y < 0 || y >= max) return { empty:true };
  const layers = tileCache.get(tileKey(x, y));
  if (layers) return { layers, baseX:TILE.x, baseY:TILE.y };
  // ローカルPBFモードはMVTタイルを1枚しか持たないため、周辺を空MVTタイルとして扱う
  return networkTilesEnabled ? null : { empty:true };
}
function resolveTileFacilities(x, y){
  const key = tileKey(x, y);
  const cached = resolvedTiles.get(key);
  if (cached && cached.generation === tileGeneration) return cached.result;
  const result = RESOLVER.resolveTile({
    tileX:x,tileY:y,pattern:ACTIVE_PATTERN,getTile:resolverGetTile,
    assetCatalog:STANDALONE_UNIFIED_STYLE &&
      (!WORLD_STYLE_MODE || WORLD_STYLE.symbol.collisionBounds === 'poi-asset-measured-bounds')
      ? POI_SPRITE_CATALOG : null,
    sourceAnchored:WORLD_STYLE_MODE
      ? WORLD_STYLE.symbol.sourceAnchored !== false
      : STANDALONE_UNIFIED_STYLE,
    assetPack:ACTIVE_ASSET_PACK,
  });
  if (result) resolvedTiles.set(key, { generation:tileGeneration, result });
  return result;
}
function viewTileRange(pad = 96 + ROTATION_SOURCE_MARGIN_CELLS * CPX){
  const max = 2 ** TILE.z;
  return {
    minX:TILE.x + Math.floor((viewOffset.x - pad) / W),
    maxX:TILE.x + Math.floor((viewOffset.x + W + pad) / W),
    minY:Math.max(0, TILE.y + Math.floor((viewOffset.y - pad) / H)),
    maxY:Math.min(max - 1, TILE.y + Math.floor((viewOffset.y + H + pad) / H)),
  };
}
function collectResolvedFacilities(){
  const range = viewTileRange();
  const facilities = [], clusters = [];
  let resolvedTileCount = 0, pendingTiles = 0;
  for (let ty = range.minY; ty <= range.maxY; ty++){
    for (let tx = range.minX; tx <= range.maxX; tx++){
      const result = resolveTileFacilities(tx, ty);
      if (!result){ pendingTiles++; continue; }
      resolvedTileCount++;
      facilities.push(...result.facilities);
      clusters.push(...result.clusters);
    }
  }
  return { facilities, clusters, resolvedTileCount, pendingTiles };
}

async function fetchMapTile(x, y){
  const key = tileKey(x, y);
  if (tileCache.has(key)) return tileCache.get(key);
  const generation = tileGeneration;
  const loadKey = `${generation}:${key}`;
  if (tileLoads.has(loadKey)) return tileLoads.get(loadKey);
  const originX = TILE.x, originY = TILE.y;
  const max = 2 ** TILE.z;
  if (y < 0 || y >= max) return null;
  const request = (async () => {
    const wrappedX = ((x % max) + max) % max;
    const url = tileTemplate.replace('{z}', TILE.z).replace('{x}', wrappedX).replace('{y}', y);
    const res = await fetch(url);
    if (!res.ok) throw new Error(`tile fetch ${res.status}: ${x}/${y}`);
    const parsed = retainRpgLayers(parseTile(await maybeGunzip(await res.arrayBuffer())));
    const layers = offsetTileLayers(parsed, x, y, originX, originY);
    if (generation !== tileGeneration) return null;
    tileCache.set(key, layers);
    return layers;
  })();
  tileLoads.set(loadKey, request);
  try { return await request; }
  finally { tileLoads.delete(loadKey); }
}

function centerTile(){
  return {
    x: TILE.x + Math.floor((viewOffset.x + W / 2) / W),
    y: TILE.y + Math.floor((viewOffset.y + H / 2) / H),
  };
}

function updateMapPosition(){
  const t = centerTile();
  const pt = locationCanvasPoint();
  const atLocation = pt && Math.hypot(pt[0] - W / 2, pt[1] - H / 2) < 2;
  const prefix = atLocation
    ? `現在地 ${currentLocation.latitude.toFixed(5)}, ${currentLocation.longitude.toFixed(5)} / `
    : '';
  mapPosition.dataset.offsetX = viewOffset.x.toFixed(3);
  mapPosition.dataset.offsetY = viewOffset.y.toFixed(3);
  const bearingText = BEARING_STUDY_MODE ? ` / 方位 ${mapBearing.toFixed(1)}°` : '';
  mapPosition.textContent = `${prefix}OpenFreeMap z${TILE.z} / ${t.x} / ${t.y}${bearingText} ─ 地理の読みやすさ`;
}

let ensureTilesRunning = false;
async function ensureTilesAround(){
  if (!networkTilesEnabled || ensureTilesRunning) return;
  ensureTilesRunning = true;
  const cacheSizeBefore = tileCache.size;
  try {
    // ビューポートにかかる各MVTタイルの3×3文脈まで先読みし、
    // 画面へ入る施設が常に確定済みの状態で描けるようにする。
    const range = viewTileRange();
    const requests = [];
    for (let ty = range.minY - 1; ty <= range.maxY + 1; ty++)
      for (let tx = range.minX - 1; tx <= range.maxX + 1; tx++)
        requests.push(fetchMapTile(tx, ty));
    await Promise.allSettled(requests);
  } finally {
    ensureTilesRunning = false;
  }
  if (tileCache.size === cacheSizeBefore) return;
  rebuildTileLayers();
  render();
  updateMapPosition();
}

async function maybeGunzip(buf){
  const b = new Uint8Array(buf);
  if (b[0] === 0x1f && b[1] === 0x8b){
    const ds = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
    return await new Response(ds).arrayBuffer();
  }
  return buf;
}
async function loadStandaloneLandmarkData(){
  if (!STANDALONE_LANDMARK_MODE){
    document.documentElement.dataset.landmarkEntities = 'disabled';
    return;
  }
  try {
    const [generatedResponse, overrideResponse] = await Promise.all([
      fetch(LANDMARK_GENERATED_DATA_URL),
      fetch(LANDMARK_OVERRIDE_DATA_URL),
    ]);
    if (!generatedResponse.ok) throw new Error(`landmark fetch ${generatedResponse.status}`);
    if (!overrideResponse.ok) throw new Error(`landmark override fetch ${overrideResponse.status}`);
    const [generated, overrides] = await Promise.all([
      generatedResponse.json(),
      overrideResponse.json(),
    ]);
    if (generated?.type !== 'FeatureCollection' || !Array.isArray(generated.features))
      throw new Error('invalid landmark FeatureCollection');
    landmarkFeatureCollection = LANDMARK_ENTITY_API.mergeOverrides(generated, overrides);
    landmarkLoadState = 'ready';
    document.documentElement.dataset.landmarkEntities = String(landmarkFeatureCollection.features.length);
  } catch (error) {
    landmarkLoadState = 'error';
    document.documentElement.dataset.landmarkEntities = 'error';
    console.warn('ランドマーク補助データを読み込めませんでした', error);
  }
}
async function loadFromBuffer(buf){
  tileGeneration++;
  networkTilesEnabled = false;
  tileCache.clear();
  tileLayers = null;
  currentLocation = null;
  viewOffset.x = 0;
  viewOffset.y = 0;
  const parsed = retainRpgLayers(parseTile(await maybeGunzip(buf)));
  tileCache.set(tileKey(TILE.x, TILE.y), offsetTileLayers(parsed, TILE.x, TILE.y));
  rebuildTileLayers();
  render();
  updateMapPosition();
  setMsg(DEFAULT_MSG);
}
async function loadTile(){
  setMsg('マップデータを よみこんでいる……');
  if (!networkTilesEnabled){ tileCache.clear(); tileLayers = null; }
  // 本番比較profileはcapture時も本番と同じ最新TileJSONを使う。
  // 固定日付MVTへ切り替わると、描画差ではなく入力地物差を比較してしまう。
  if (!CAPTURE_MODE || WORLD_STYLE.profileKind === 'production-copy'){
    try {
      const tj = await (await fetch(TILEJSON_URL)).json();
      if (tj.tiles && tj.tiles[0]) tileTemplate = tj.tiles[0];
    } catch (e) {}
  }
  networkTilesEnabled = true;
  await fetchMapTile(TILE.x, TILE.y);
  await ensureTilesAround();
}
async function boot(){
  locateBtn.disabled = true;
  try { await document.fonts.load('17px DotGothic16'); } catch (e) {}
  buildTiles();
  applyInitialQueryViewport();
  try {
    await loadStandaloneLandmarkData();
    await loadTile();
    setMsg(DEFAULT_MSG);
  } catch (e) {
    console.error(e);
    window.PixelMapBootError = {name:e?.name || 'Error',message:String(e?.message || e),stack:String(e?.stack || '')};
    document.documentElement.dataset.bootError = String(e?.message || e);
    showLoadError();
  } finally {
    locateBtn.disabled = false;
  }
}
async function pickPbf(input){
  const file = input.files[0];
  if (!file) return;
  try {
    setMsg('ファイルを よみこんでいる……');
    await loadFromBuffer(await file.arrayBuffer());
  } catch (e) {
    console.error(e);
    setMsg(`このファイルは よめなかった……（gzip/生PBFの両対応です。z${TILE.z}タイルか確認してください）`);
  }
}

function tilePointFromCoordinates(latitude, longitude){
  const maxLat = 85.05112878;
  const lat = Math.max(-maxLat, Math.min(maxLat, latitude));
  const n = 2 ** TILE.z;
  const wrappedLon = ((longitude + 180) % 360 + 360) % 360 - 180;
  const tileX = (wrappedLon + 180) / 360 * n;
  const rad = lat * Math.PI / 180;
  const projectedY = (1 - Math.asinh(Math.tan(rad)) / Math.PI) / 2 * n;
  const tileY = Math.max(0, Math.min(n - 1e-7, projectedY));
  return { tileX, tileY };
}

function applyInitialQueryViewport(){
  if (!HAS_INITIAL_LOCATION) return;
  const point = tilePointFromCoordinates(INITIAL_LAT, INITIAL_LON);
  const maxTile = 2 ** TILE.z;
  const baseX = Math.max(0, Math.min(maxTile - 1, Math.floor(point.tileX)));
  const baseY = Math.max(0, Math.min(maxTile - 1, Math.floor(point.tileY)));
  TILE.x = baseX; TILE.y = baseY;
  viewOffset.x = (point.tileX - baseX) * W - W / 2;
  viewOffset.y = (point.tileY - baseY) * H - H / 2;
  currentLocation = null;
  cv.setAttribute('aria-label', `${INITIAL_PLACE}周辺の${ACTIVE_PATTERN.name}アイコン地図。ドラッグで移動できます`);
  updateMapPosition();
}

function geolocationErrorMessage(error){
  if (error?.code === 1) return '現在地の使用が 許可されていないよ。ブラウザの設定で 位置情報を許可してね。';
  if (error?.code === 2) return '現在地を みつけられなかった……電波のよい場所で もういちど試してね。';
  if (error?.code === 3) return '現在地の取得が タイムアウトした……もういちど試してね。';
  return '現在地を 取得できなかった……';
}

function getCurrentPosition(){
  return new Promise((resolve, reject) => navigator.geolocation.getCurrentPosition(resolve, reject, {
    enableHighAccuracy:true,
    timeout:15000,
    maximumAge:30000,
  }));
}

async function showCurrentPosition(position){
  const { latitude, longitude, accuracy } = position.coords;
  const point = tilePointFromCoordinates(latitude, longitude);
  const maxTile = 2 ** TILE.z;
  const baseX = Math.max(0, Math.min(maxTile - 1, Math.floor(point.tileX)));
  const baseY = Math.max(0, Math.min(maxTile - 1, Math.floor(point.tileY)));
  const previous = {
    tileX:TILE.x, tileY:TILE.y, offsetX:viewOffset.x, offsetY:viewOffset.y,
    location:currentLocation, layers:tileLayers, networkTilesEnabled,
    cache:new Map(tileCache),
  };

  tileGeneration++;
  tileCache.clear();
  tileLayers = null;
  networkTilesEnabled = true;
  TILE.x = baseX; TILE.y = baseY;
  viewOffset.x = (point.tileX - baseX) * W - W / 2;
  viewOffset.y = (point.tileY - baseY) * H - H / 2;
  currentLocation = {
    latitude, longitude,
    accuracy:Number.isFinite(accuracy) ? Math.max(0, accuracy) : 0,
    ...point,
  };
  updateMapPosition();

  try {
    await fetchMapTile(baseX, baseY);
    await ensureTilesAround();
    publishViewport();
  } catch (error) {
    tileGeneration++;
    TILE.x = previous.tileX; TILE.y = previous.tileY;
    viewOffset.x = previous.offsetX; viewOffset.y = previous.offsetY;
    currentLocation = previous.location;
    networkTilesEnabled = previous.networkTilesEnabled;
    tileCache.clear();
    for (const [key, layers] of previous.cache) tileCache.set(key, layers);
    tileLayers = previous.layers;
    render();
    updateMapPosition();
    throw error;
  }
}

async function locateMe(){
  if (!('geolocation' in navigator)){
    setMsg('このブラウザでは 現在地を取得できないよ。');
    return;
  }
  if (!window.isSecureContext){
    setMsg('現在地の取得には HTTPS または localhost で開く必要があるよ。');
    return;
  }

  locateBtn.disabled = true;
  locateBtn.textContent = '◎ さがしている…';
  setMsg('現在地を さがしている……');
  try {
    const position = await getCurrentPosition();
    setMsg('現在地の マップを よみこんでいる……');
    await showCurrentPosition(position);
    setMsg(`現在地に いどうしたよ。（精度 約${Math.round(position.coords.accuracy)}m）`);
  } catch (error) {
    console.error(error);
    const isPositionError = Number.isInteger(error?.code) && error.code >= 1 && error.code <= 3;
    setMsg(isPositionError
      ? geolocationErrorMessage(error)
      : '現在地は取得できたけれど、マップを よみこめなかった……');
  } finally {
    locateBtn.disabled = false;
    locateBtn.textContent = '◎ 現在地へ';
  }
}

const CLASS_JP = {
  railway:'鉄道', bus:'バス', shop:'店', grocery:'食料品', restaurant:'レストラン', fast_food:'ファストフード',
  cafe:'カフェ', bar:'バー', beer:'居酒屋', lodging:'宿', hospital:'病院', convenience:'コンビニ', pharmacy:'薬局', dentist:'歯科',
  doctors:'医院', school:'学校', college:'専門・大学', university:'大学', kindergarten:'幼稚園・保育園',
  library:'図書館', bank:'銀行', atm:'ATM', post:'郵便', police:'警察', fire_station:'消防',
  town_hall:'役所', place_of_worship:'神社・寺・教会', attraction:'名所', monument:'記念碑', museum:'博物館',
  art_gallery:'ギャラリー', theatre:'劇場', cinema:'映画館', park:'公園', garden:'庭園', playground:'遊び場',
  stadium:'スタジアム', pitch:'グラウンド', golf:'ゴルフ', swimming:'プール', zoo:'動物園',
  parking:'駐車場', fuel:'ガソリンスタンド', charging_station:'充電スタンド', clothing_store:'衣料品店',
  alcohol_shop:'酒屋', bakery:'パン屋', ice_cream:'アイス', entertainment:'娯楽', music:'音楽',
  city:'市', town:'町', suburb:'地区', quarter:'地区', neighbourhood:'町名', village:'村',
  current_location:'測位結果',

};
function describe(p){
  const name = p['name:ja'] || p.name || 'なまえのない場所';
  const en = p['name:en'] ? `（${p['name:en']}）` : '';
  const cls = CLASS_JP[p.subclass] || CLASS_JP[p.class] || p.subclass || p.class || '';
  return {
    before:'＊「ここは ',
    strong:String(name),
    after:`${en}${cls ? ' ─ ' + cls : ''} だ。」`,
  };
}
function hitTest(ev){
  const r = cv.getBoundingClientRect();
  const x = (ev.clientX - r.left) / r.width * W;
  const y = (ev.clientY - r.top) / r.height * H;
  for (let i = hitAreas.length - 1; i >= 0; i--){
    const a = hitAreas[i];
    if (x >= a.x && x <= a.x + a.w && y >= a.y && y <= a.y + a.h) return a;
  }
  return null;
}
let drag = null;
let suppressClick = false;
let renderFrame = 0;
let dragPreviewFrame = 0;
function scheduleRender(){
  if (renderFrame) return;
  renderFrame = requestAnimationFrame(() => {
    renderFrame = 0;
    render();
    updateMapPosition();
  });
}
function scheduleDragPreview(){
  if (!drag || dragPreviewFrame) return;
  dragPreviewFrame = requestAnimationFrame(() => {
    dragPreviewFrame = 0;
    if (!drag) return;
    drag.previewFrames++;
    ctx.save();
    ctx.fillStyle = '#15151c';
    ctx.fillRect(0, 0, W, H);
    ctx.drawImage(drag.preview, drag.previewX, drag.previewY);
    ctx.restore();
    presentScene();
  });
}
function viewportState(){
  return {
    tileX:TILE.x,
    tileY:TILE.y,
    offsetX:viewOffset.x,
    offsetY:viewOffset.y,
    currentLocation,
  };
}
function publishViewport(){
  if (!EMBEDDED) return;
  window.parent.postMessage({
    type:'pixelmap:viewport',
    mapId:MAP_ID,
    state:viewportState(),
  }, MESSAGE_ORIGIN);
}
function publishBearing(){
  if (!EMBEDDED) return;
  window.parent.postMessage({
    type:'pixelmap:bearing',
    mapId:MAP_ID,
    bearing:mapBearing,
  }, MESSAGE_ORIGIN);
}
function layerSnapshot(){
  return {
    activeOptions:layerInputs.filter(input => input.checked).map(optionForInput),
    layerOrder:[...layerOrder],
    catalog:[...document.querySelectorAll('.layer-category')].map(panel => ({
      title:panel.querySelector('.category-title')?.textContent?.trim() || '',
      items:[...panel.querySelectorAll('[data-category-item]')].map(input => ({
        option:optionForInput(input),
        label:input.parentElement?.textContent?.trim() || optionForInput(input),
        checked:input.checked,
      })),
    })),
  };
}
function publishLayerState(){
  if (!EMBEDDED) return;
  window.parent.postMessage({
    type:'pixelmap:layers',
    mapId:MAP_ID,
    layers:layerSnapshot(),
  }, MESSAGE_ORIGIN);
}
function applySharedLayers(state){
  if (!state || !Array.isArray(state.activeOptions)) return;
  const allowed = new Set(layerInputs.map(optionForInput));
  const active = new Set(state.activeOptions.filter(option => allowed.has(option)));
  for (const input of layerInputs) input.checked = active.has(optionForInput(input));

  const requestedOrder = Array.isArray(state.layerOrder) ? state.layerOrder : [];
  const seen = new Set();
  layerOrder = requestedOrder.filter(option => active.has(option) && !seen.has(option) && seen.add(option));
  for (const input of layerInputs){
    const option = optionForInput(input);
    if (active.has(option) && !seen.has(option)){
      seen.add(option);
      layerOrder.push(option);
    }
  }
  document.getElementById('toolbar').dataset.layerOrder = layerOrder.join(',');
  for (const panel of document.querySelectorAll('.layer-category')) syncCategoryMaster(panel);
  syncAllLayersToggle();
  syncCommercialLandmarkState();
  render();
  publishLayerState();
}
async function applySharedViewport(state){
  if (!state || ![state.tileX, state.tileY, state.offsetX, state.offsetY].every(Number.isFinite)) return;
  const tileX = Math.trunc(state.tileX);
  const tileY = Math.trunc(state.tileY);
  const tileChanged = tileX !== TILE.x || tileY !== TILE.y;

  viewOffset.x = state.offsetX;
  viewOffset.y = state.offsetY;
  currentLocation = state.currentLocation &&
    Number.isFinite(state.currentLocation.latitude) &&
    Number.isFinite(state.currentLocation.longitude)
      ? { ...state.currentLocation }
      : null;

  if (!tileChanged){
    scheduleRender();
    updateMapPosition();
    return;
  }

  tileGeneration++;
  tileCache.clear();
  tileLayers = null;
  networkTilesEnabled = true;
  TILE.x = tileX;
  TILE.y = tileY;
  updateMapPosition();
  setMsg('もう一方のマップと 位置をそろえている……');
  try {
    await fetchMapTile(tileX, tileY);
    await ensureTilesAround();
    setMsg(DEFAULT_MSG);
  } catch (error) {
    console.error(error);
    setMsg('同期した位置のマップを よみこめなかった……');
  }
}
if (EMBEDDED){
  window.addEventListener('message', ev => {
    if (ev.source !== window.parent) return;
    if (location.origin !== 'null' && ev.origin !== location.origin) return;
    if (ev.data?.type === 'pixelmap:set-viewport') applySharedViewport(ev.data.state);
    if (ev.data?.type === 'pixelmap:set-layers') applySharedLayers(ev.data.layers);
    if (ev.data?.type === 'pixelmap:set-bearing')
      setMapBearingWithoutReload(ev.data.bearing, { source:'synchronized-map-bearing', publish:false });
  });
}
cv.addEventListener('pointerdown', ev => {
  if (!tileLayers || (ev.pointerType === 'mouse' && ev.button !== 0)) return;
  const r = cv.getBoundingClientRect();
  if (renderFrame){ cancelAnimationFrame(renderFrame); renderFrame = 0; }
  const preview = document.createElement('canvas');
  preview.width = W; preview.height = H;
  preview.getContext('2d').drawImage(sceneCanvas, 0, 0);
  drag = {
    id:ev.pointerId, x:ev.clientX, y:ev.clientY,
    offsetX:viewOffset.x, offsetY:viewOffset.y,
    scaleX:W / r.width, scaleY:H / r.height,
    preview, previewX:0, previewY:0, previewFrames:0,
    renderCountAtStart:renderCount, moved:false,
  };
  suppressClick = false;
  cv.setPointerCapture(ev.pointerId);
  cv.classList.add('dragging');
  cv.style.cursor = 'grabbing';
});
cv.addEventListener('pointermove', ev => {
  if (!tileLayers) return;
  if (drag && ev.pointerId === drag.id){
    const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) <= 4) return;
    drag.moved = true;
    const screenDx = dx * drag.scaleX;
    const screenDy = dy * drag.scaleY;
    const [worldDx, worldDy] = BEARING_STUDY_MODE
      ? window.PixelMapBearing.screenVectorToWorld([screenDx, screenDy], mapBearing)
      : [screenDx, screenDy];
    viewOffset.x = drag.offsetX - worldDx;
    viewOffset.y = drag.offsetY - worldDy;
    const maxTile = 2 ** TILE.z;
    viewOffset.y = Math.max(-TILE.y * H, Math.min((maxTile - TILE.y - 1) * H, viewOffset.y));
    // previewは既に回転・再ラスタライズ済みなので、指の画面移動量で平行移動する。
    drag.previewX = screenDx;
    drag.previewY = screenDy;
    scheduleDragPreview();
    updateMapPosition();
    if (drag.moved) setMsg('マップを いどうしている……');
    return;
  }
  if (ev.pointerType === 'touch') return;
  const hit = hitTest(ev);
  cv.style.cursor = hit ? 'pointer' : 'grab';
  setMsg(hit ? describe(hit.p) : DEFAULT_MSG);
});
function finishDrag(ev, cancelled = false){
  if (!drag || ev.pointerId !== drag.id) return;
  suppressClick = drag.moved || cancelled;
  if (dragPreviewFrame){ cancelAnimationFrame(dragPreviewFrame); dragPreviewFrame = 0; }
  const dragMetrics = {
    moved:drag.moved,
    previewFrames:drag.previewFrames,
    renderCountAtStart:drag.renderCountAtStart,
  };
  drag = null;
  cv.classList.remove('dragging');
  cv.style.cursor = 'grab';
  setMsg(DEFAULT_MSG);
  if (!dragMetrics.moved){
    document.getElementById('toolbar').dataset.lastDragPreviewFrames = dragMetrics.previewFrames;
    document.getElementById('toolbar').dataset.lastDragRenderCalls = 0;
    return;
  }
  rebuildTileLayers();
  render();
  document.getElementById('toolbar').dataset.lastDragPreviewFrames = dragMetrics.previewFrames;
  document.getElementById('toolbar').dataset.lastDragRenderCalls = renderCount - dragMetrics.renderCountAtStart;
  updateMapPosition();
  publishViewport();
  if (!cancelled) ensureTilesAround().catch(console.error);
}
cv.addEventListener('pointerup', ev => finishDrag(ev));
cv.addEventListener('pointercancel', ev => finishDrag(ev, true));
cv.addEventListener('mouseleave', () => {
  if (!drag && tileLayers) setMsg(DEFAULT_MSG);
});
cv.addEventListener('click', ev => {
  if (suppressClick){ suppressClick = false; return; }
  const hit = hitTest(ev);
  if (hit) setMsg(describe(hit.p));
});
let keyboardHitIndex = -1;
cv.addEventListener('focus', () => {
  if (hitAreas.length) setMsg('矢印キーで 施設をえらび、Enterで あんないを確認できます。');
});
cv.addEventListener('blur', () => {
  keyboardHitIndex = -1;
  setMsg(DEFAULT_MSG);
});
cv.addEventListener('keydown', ev => {
  const navigable = hitAreas.filter(area => area.p && (featureName(area.p) || area.p.class || area.p.subclass));
  if (!navigable.length) return;
  let nextIndex = keyboardHitIndex;
  if (ev.key === 'ArrowRight' || ev.key === 'ArrowDown') nextIndex++;
  else if (ev.key === 'ArrowLeft' || ev.key === 'ArrowUp') nextIndex--;
  else if (ev.key === 'Home') nextIndex = 0;
  else if (ev.key === 'End') nextIndex = navigable.length - 1;
  else if (ev.key !== 'Enter' && ev.key !== ' ') return;
  ev.preventDefault();
  if (nextIndex < 0) nextIndex = navigable.length - 1;
  keyboardHitIndex = nextIndex % navigable.length;
  setMsg(describe(navigable[keyboardHitIndex].p));
});
function syncCategoryMaster(panel){
  const master = panel.querySelector('[data-category-toggle]');
  if (!master) return;
  const items = [...panel.querySelectorAll('[data-category-item]')];
  const checkedCount = items.filter(item => item.checked).length;
  master.checked = checkedCount === items.length;
  master.indeterminate = checkedCount > 0 && checkedCount < items.length;
}

function bearingUrl(degrees, source = location.href){
  const url = new URL(source);
  url.searchParams.set('bearing', String(Math.round(degrees * 10) / 10));
  return url;
}
function syncBearingStudyState(){
  document.documentElement.dataset.mapBearing = mapBearing.toFixed(1);
  document.documentElement.dataset.bearingSource = mapBearingSource;
  document.documentElement.dataset.renderCount = String(renderCount);
  if (!window.PixelMapStudy) return;
  window.PixelMapStudy.mapBearing = {
    enabled:BEARING_STUDY_MODE,
    degrees:mapBearing,
    source:mapBearingSource,
    control:BEARING_STUDY_MODE ? 'compass-buttons' : 'none',
    stepDegrees:BEARING_STUDY_MODE ? BEARING_STEP_DEGREES : null,
    reloadOnChange:false,
  };
  window.PixelMapStudy.diagnostics = window.PixelMapDiagnostics || null;
}
function setMapBearingWithoutReload(nextBearing, options = {}){
  if (!BEARING_STUDY_MODE || !tileLayers ||
      document.documentElement.dataset.mapReady !== '1') return;
  const normalized = window.PixelMapBearing.normalizeDegrees(nextBearing);
  if (bearingRenderBusy){
    pendingBearingUpdate = { bearing:normalized, options };
    return;
  }
  if (normalized === mapBearing) return;
  mapBearing = normalized;
  mapBearingSource = options.source || 'compass-control';
  bearingRenderBusy = true;
  history.replaceState(history.state, '', bearingUrl(mapBearing));
  syncBearingStudyState();
  updateBearingUi();
  setMsg(`表示方位を ${mapBearing}度へ かいてんしている……`);
  requestAnimationFrame(() => {
    try {
      render();
      updateMapPosition();
      syncBearingStudyState();
      window.dispatchEvent(new CustomEvent('pixelmap:bearingchange', {
        detail:{ degrees:mapBearing, source:mapBearingSource, reloaded:false },
      }));
      if (options.publish !== false) publishBearing();
      setMsg(`表示方位 ${mapBearing}度。ページを よみなおさずに かいてんした。`);
    } catch (error){
      console.error(error);
      setMsg('表示方位を かえられなかった……');
    } finally {
      bearingRenderBusy = false;
      updateBearingUi();
      if (pendingBearingUpdate){
        const pending = pendingBearingUpdate;
        pendingBearingUpdate = null;
        requestAnimationFrame(() => setMapBearingWithoutReload(pending.bearing, pending.options));
      }
    }
  });
}
