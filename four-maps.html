<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="4地点のPixelMapを同時に確認するページ">
<title>PixelMap｜4地点を同時表示</title>
<style>
  *{ box-sizing:border-box; }
  html, body{ width:100%; height:100%; margin:0; overflow:hidden; background:#181820; }
  body{ display:flex; flex-direction:column; }
  iframe{ display:block; flex:1 1 auto; width:100%; min-height:0; border:0; }
  footer{
    flex:0 0 auto;
    padding:3px 8px;
    background:#181820;
    color:#787460;
    font:9px/1.4 monospace;
    text-align:center;
  }
  footer a{ color:#88c860; }
</style>
</head>
<body>
<iframe
  id="fourMapFrame"
  src="variants/height-stack-four-map.html?v=20260823-2"
  title="PixelMap 4地点同時表示"
  allow="geolocation"
></iframe>
<footer>
  地図データ: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors ／
  <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> ／
  <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener">© OpenMapTiles</a>
</footer>
<script>
'use strict';
const fourMapFrame = document.getElementById('fourMapFrame');
const targetOrigin = location.origin === 'null' ? '*' : location.origin;
const normalizedRenderMode = value => value === 'cell3' ? 'cell3' : 'cell2';
const renderModeFromLocation = () => normalizedRenderMode(new URLSearchParams(location.search).get('render'));

function updateTopRenderUrl(mode){
  const normalized = normalizedRenderMode(mode);
  const url = new URL(location.href);
  url.searchParams.set('render', normalized);
  history.pushState({ renderMode:normalized }, '', `${url.pathname}${url.search}${url.hash}`);
  document.documentElement.dataset.renderMode = normalized;
}
function setInitialFrameRenderMode(){
  const mode = renderModeFromLocation();
  document.documentElement.dataset.renderMode = mode;
  const url = new URL(fourMapFrame.src, location.href);
  const frameMode = normalizedRenderMode(url.searchParams.get('render'));
  if (frameMode === mode) return;
  url.searchParams.set('render', mode);
  fourMapFrame.src = url.href;
}
window.addEventListener('message', event => {
  if (event.source !== fourMapFrame.contentWindow) return;
  if (location.origin !== 'null' && event.origin !== location.origin) return;
  if (event.data?.type !== 'pixelmap:render-mode') return;
  const mode = normalizedRenderMode(event.data.renderMode);
  if (mode !== renderModeFromLocation()) updateTopRenderUrl(mode);
});
window.addEventListener('popstate', () => {
  const mode = renderModeFromLocation();
  document.documentElement.dataset.renderMode = mode;
  fourMapFrame.contentWindow?.postMessage({ type:'pixelmap:set-render-mode', renderMode:mode }, targetOrigin);
});
setInitialFrameRenderMode();
</script>
</body>
</html>
