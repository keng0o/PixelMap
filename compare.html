<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="同じ場所を2つのPixelMapで同時に比較するページ">
<title>PixelMap｜同一地点を2画面比較</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&amp;display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;
    --bg:#181820;
    --panel:#101018;
    --ink:#f8f0d8;
    --accent:#88c860;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ width:100%; min-height:100%; }
  body{
    height:100vh;
    height:100dvh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    gap:12px;
    padding:14px;
    background:var(--bg);
    color:var(--ink);
    font-family:'DotGothic16', monospace;
  }
  .comparison{
    min-height:0;
    flex:1 1 auto;
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:12px;
  }
  .map-panel{
    position:relative;
    min-width:0;
    min-height:0;
    display:flex;
    flex-direction:column;
    border:2px solid var(--ink);
    box-shadow:0 0 0 2px var(--panel), 0 0 0 4px var(--ink);
    background:var(--panel);
    overflow:hidden;
  }
  .map-label{
    position:absolute;
    top:8px;
    left:50%;
    transform:translateX(-50%);
    z-index:2;
    padding:4px 7px;
    border:1px solid var(--ink);
    background:#101018e8;
    color:var(--ink);
    font-size:10px;
    pointer-events:none;
  }
  iframe{
    display:block;
    flex:1 1 auto;
    width:100%;
    min-height:0;
    border:0;
    background:#78b850;
  }
  footer{
    flex:0 0 auto;
    color:#787460;
    font-size:9px;
    text-align:center;
  }
  footer a{ color:var(--accent); }
  @media (max-width:680px){
    body{ gap:6px; padding:7px; }
    .comparison{ gap:5px; }
    .map-label{ top:5px; font-size:8px; }
    footer{ font-size:8px; }
  }
</style>
</head>
<body>
<main class="comparison" aria-label="同一地点の2画面比較">
  <section class="map-panel" aria-label="比較マップ A">
    <h1 class="map-label">MAP A</h1>
    <iframe
      src="variants/map-02-refined.html?embedded=1&amp;pattern=07&amp;map=left&amp;lat=35.5314&amp;lon=139.6969&amp;place=%E5%B7%9D%E5%B4%8E%E9%A7%85&amp;v=20260826-bearing-production-1"
      title="比較マップ A。移動はもう一方の地図にも同期されます"
      allow="geolocation"
    ></iframe>
  </section>
  <section class="map-panel" aria-label="比較マップ B">
    <h1 class="map-label">MAP B</h1>
    <iframe
      src="variants/map-02-refined.html?embedded=1&amp;pattern=07&amp;map=right&amp;lat=35.5314&amp;lon=139.6969&amp;place=%E5%B7%9D%E5%B4%8E%E9%A7%85&amp;v=20260826-bearing-production-1"
      title="比較マップ B。移動はもう一方の地図にも同期されます"
      allow="geolocation"
    ></iframe>
  </section>
</main>

<footer>
  2画面の位置は常に同期 ／ 地図データ: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors ／
  <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> ／
  <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener">© OpenMapTiles</a>
</footer>

<script>
'use strict';
const frames = [...document.querySelectorAll('iframe')];
const targetOrigin = location.origin === 'null' ? '*' : location.origin;
let latestViewport = null;
const normalizeBearing = value => {
  const numeric = Number(value);
  return Number.isFinite(numeric) ? ((numeric % 360) + 360) % 360 : 0;
};
let latestBearing = normalizeBearing(new URLSearchParams(location.search).get('bearing'));

function isMapFrame(source){
  return frames.some(frame => frame.contentWindow === source);
}
function sendViewport(frame, state){
  frame.contentWindow?.postMessage({ type:'pixelmap:set-viewport', state }, targetOrigin);
}
function sendBearing(frame, bearing){
  frame.contentWindow?.postMessage({ type:'pixelmap:set-bearing', bearing }, targetOrigin);
}
function updateTopBearingUrl(bearing){
  latestBearing = normalizeBearing(bearing);
  const url = new URL(location.href);
  url.searchParams.set('bearing', String(latestBearing));
  history.replaceState(history.state, '', `${url.pathname}${url.search}${url.hash}`);
  document.documentElement.dataset.mapBearing = String(latestBearing);
}
window.addEventListener('message', event => {
  if (!isMapFrame(event.source)) return;
  if (location.origin !== 'null' && event.origin !== location.origin) return;

  if (event.data?.type === 'pixelmap:ready'){
    const frame = frames.find(item => item.contentWindow === event.source);
    if (latestViewport){
      if (frame) sendViewport(frame, latestViewport);
    }
    if (frame) sendBearing(frame, latestBearing);
    return;
  }
  if (event.data?.type === 'pixelmap:bearing'){
    if (!Number.isFinite(Number(event.data.bearing))) return;
    updateTopBearingUrl(event.data.bearing);
    for (const frame of frames) sendBearing(frame, latestBearing);
    return;
  }
  if (event.data?.type !== 'pixelmap:viewport') return;

  latestViewport = event.data.state;
  for (const frame of frames){
    if (frame.contentWindow !== event.source) sendViewport(frame, latestViewport);
  }
});
window.addEventListener('popstate', () => {
  latestBearing = normalizeBearing(new URLSearchParams(location.search).get('bearing'));
  document.documentElement.dataset.mapBearing = String(latestBearing);
  for (const frame of frames) sendBearing(frame, latestBearing);
});
document.documentElement.dataset.mapBearing = String(latestBearing);
</script>
</body>
</html>
